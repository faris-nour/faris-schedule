<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="aD9480F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9480F"/></marker><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Basic switching element: cross and bar states</text><rect x="170" y="90" width="180" height="180" fill="#F8F9FA" stroke="#495057" stroke-width="2"/><text x="140" y="134.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">in 1</text><text x="140" y="234.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">in 2</text><text x="385" y="134.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">out 1</text><text x="385" y="234.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">out 2</text><line x1="170" y1="130" x2="350" y2="230" stroke="#3B5BDB" stroke-width="3"/><line x1="170" y1="230" x2="350" y2="130" stroke="#D9480F" stroke-width="3"/><text x="260" y="305.2" font-size="15" fill="#212529" text-anchor="middle" font-weight="700">cross state</text><rect x="590" y="90" width="180" height="180" fill="#F8F9FA" stroke="#495057" stroke-width="2"/><text x="560" y="134.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">in 1</text><text x="560" y="234.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">in 2</text><text x="805" y="134.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">out 1</text><text x="805" y="234.2" font-size="12" fill="#495057" text-anchor="middle" font-weight="700">out 2</text><line x1="590" y1="130" x2="770" y2="130" stroke="#3B5BDB" stroke-width="3"/><line x1="590" y1="230" x2="770" y2="230" stroke="#D9480F" stroke-width="3"/><text x="680" y="305.2" font-size="15" fill="#212529" text-anchor="middle" font-weight="700">bar state</text><text x="500" y="354.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">Extinction ratio = P(ON) / P(OFF) · Insertion loss = power lost · Crosstalk = desired vs undesired output</text></svg>