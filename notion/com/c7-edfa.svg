<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="aD9480F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9480F"/></marker><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">EDFA structure</text><rect x="40" y="140" width="140" height="60" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="110.0" y="166.4" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">Signal in</text><text x="110.0" y="182.7" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">1550 nm</text><rect x="230" y="130" width="170" height="80" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="315.0" y="159.2" font-size="12" fill="#6741D9" text-anchor="middle" font-weight="700">WDM</text><text x="315.0" y="174.2" font-size="12" fill="#6741D9" text-anchor="middle" font-weight="700">(λ-selective)</text><text x="315.0" y="189.2" font-size="12" fill="#6741D9" text-anchor="middle" font-weight="700">coupler</text><rect x="230" y="280" width="170" height="60" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="315.0" y="306.4" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="700">Pump laser</text><text x="315.0" y="322.7" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="700">980 / 1480 nm</text><g fill="#FFE8CC" stroke="#D9480F" stroke-width="2.5"><circle cx="500" cy="170" r="34"/><circle cx="522" cy="170" r="34"/><circle cx="544" cy="170" r="34"/><circle cx="566" cy="170" r="34"/></g><text x="533" y="234.6" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="700">Erbium-doped fiber (Er³⁺)</text><rect x="650" y="140" width="130" height="60" rx="12" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="715.0" y="174.9" font-size="14" fill="#C92A2A" text-anchor="middle" font-weight="700">Isolator ▶</text><rect x="830" y="140" width="140" height="60" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="900.0" y="166.4" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">Signal out</text><text x="900.0" y="182.7" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">(amplified)</text><line x1="180" y1="170" x2="228" y2="170" stroke="#3B5BDB" stroke-width="3" marker-end="url(#a3B5BDB)"/><line x1="400" y1="170" x2="462" y2="170" stroke="#3B5BDB" stroke-width="3" marker-end="url(#a3B5BDB)"/><line x1="600" y1="170" x2="648" y2="170" stroke="#3B5BDB" stroke-width="3" marker-end="url(#a3B5BDB)"/><line x1="780" y1="170" x2="828" y2="170" stroke="#2B8A3E" stroke-width="3" marker-end="url(#a2B8A3E)"/><line x1="315" y1="280" x2="315" y2="213" stroke="#D9480F" stroke-width="2.5" marker-end="url(#aD9480F)"/><text x="715" y="236.7" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">stops reflections</text><text x="715" y="251.7" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">(else it becomes a laser!)</text><text x="500" y="374.7" font-size="13.5" fill="#495057" text-anchor="middle" font-weight="700">the weak signal stimulates excited Er³⁺ ions → they release extra photons at the SAME λ</text></svg>