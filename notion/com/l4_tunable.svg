<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 175" width="905" height="175"><rect width="905" height="175" fill="#FFFFFF"/><text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">Tunable lasers (for WDM) vs Laser array</text><rect x="15" y="50" width="207" height="110" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="118.5" y="92.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Mechanically-tuned</text><text x="118.5" y="110.0" text-anchor="middle" font-size="12" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">move the mirrors</text><text x="118.5" y="128.0" text-anchor="middle" font-size="12" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">wide range · slow (ms)</text><rect x="237" y="50" width="207" height="110" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="340.5" y="92.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Acousto/Electro-optic</text><text x="340.5" y="110.0" text-anchor="middle" font-size="12" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">sound waves / current</text><text x="340.5" y="128.0" text-anchor="middle" font-size="12" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">moderate range · tens of ns</text><rect x="459" y="50" width="207" height="110" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="562.5" y="92.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Injection-current</text><text x="562.5" y="110.0" text-anchor="middle" font-size="12" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">change the current</t