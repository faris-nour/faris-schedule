<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Wavelength converter technologies</text><text x="500" y="75.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">1. Opto-electronic (OE-WC)</text><rect x="30" y="95" width="170" height="70" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="115.0" y="134.4" font-size="12.5" fill="#3B5BDB" text-anchor="middle" font-weight="700">λ1 in</text><line x1="200" y1="130" x2="220" y2="130" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="222" y="95" width="170" height="70" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="307.0" y="126.6" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">Photodetector</text><text x="307.0" y="142.2" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">O → E</text><line x1="392" y1="130" x2="412" y2="130" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="414" y="95" width="170" height="70" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="499.0" y="126.6" font-size="12.5" fill="#D9480F" text-anchor="middle" font-weight="700">Amplify · reshape</text><text x="499.0" y="142.2" font-size="12.5" fill="#D9480F" text-anchor="middle" font-weight="700">· retime (E)</text><line x1="584" y1="130" x2="604" y2="130" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="606" y="95" width="170" height="70" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="691.0" y="126.6" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">Laser tuned to λ2</text><text x="691.0" y="142.2" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">E → O</text><line x1="776" y1="130" x2="796" y2="130" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="798" y="95" width="170" height="70" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="883.0" y="134.4" font-size="12.5" fill="#2B8A3E" text-anchor="middle" font-weight="700">λ2 out</text><text x="500" y="235.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">2. Coherent effects (all-optical)</text><rect x="60" y="255" width="170" height="70" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="145.0" y="294.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">λ1 in</text><rect x="330" y="250" width="340" height="80" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="500.0" y="278.8" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">nonlinear medium</text><text x="500.0" y="294.4" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">(SOA · highly nonlinear fiber)</text><text x="500.0" y="310.0" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">no electrical conversion</text><rect x="770" y="255" width="170" height="70" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="855.0" y="294.6" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">λ2 out</text><line x1="230" y1="290" x2="328" y2="290" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><line x1="670" y1="290" x2="768" y2="290" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><text x="500" y="374.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">OE-WC regenerates the signal but is speed-limited · coherent is ultra-fast but does not regenerate</text></svg>