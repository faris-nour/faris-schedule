<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 330" width="930" height="330"><rect width="930" height="330" fill="#FFFFFF"/><text x="465" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">Bandwidth = f(high) − f(low)   (in Hz)</text><text x="20" y="75" text-anchor="start" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Telephone voice</text><text x="165" y="75" text-anchor="start" font-size="12" font-weight="500" fill="#6B7280" font-family="Segoe UI, Tahoma, Arial, sans-serif">300 – 3400 Hz</text><rect x="330" y="60" width="60" height="24" rx="6" fill="#0EA5E9"/><text x="400" y="77" text-anchor="start" font-size="13" font-weight="700" fill="#0369A1" font-family="Segoe UI, Tahoma, Arial, sans-serif">3.1 kHz</text><text x="20" y="117" text-anchor="start" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">AM radio</text><text x="165" y="117" text-anchor="start" font-size="12" font-weight="500" fill="#6B7280" font-family="Segoe UI, Tahoma, Arial, sans-serif">per channel</text><rect x="330" y="102" width="120" height="24" rx="6" fill="#0EA5E9"/><text x="460" y="119" text-anchor="start" font-size="13" font-weight="700" fill="#0369A1" font-family="Segoe UI, Tahoma, Arial, sans-serif">10 kHz</text><text x="20" y="159" text-anchor="start" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">FM radio</text><text x="165" y="159" text-anchor="start" font-size="12" font-weight="500" fill="#6B7280" font-family="Segoe UI, Tahoma, Arial, sans-serif">per channel</text><rect x="330" y="144" width="198" height="24" rx="6" fill="#0EA5E9"/><text x="538.0" y="161" text-anchor="start" font-size="13" font-weight="700" fill="#0369A1" font-family="Segoe UI, Tahoma, Arial, sans-serif">200 kHz</text><text x="20" y="201" text-anchor="start" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Analog TV</text><text x="165" y="201" text-anchor="start" font-size="12" font-weight="500" fill="#6B7280" font-family="Segoe UI, Tahoma, Arial, sans-serif">per channel</text><rect x="330" y="186" width="288" height="24" rx="6" fill="#0EA5E9"/><text x="628.0" y="203" text-anchor="start" font-size="13" font-weight="700" fill="#0369A1" font-family="Segoe UI, Tahoma, Arial, sans-serif">6 MHz</text><text x="20" y="243" text-anchor="start" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Wi-Fi</text><text x="165" y="243" text-anchor="start" font-size="12" font-weight="500" fill="#6B7280" font-family="Segoe UI, Tahoma, Arial, sans-serif">2.4 / 5 GHz bands</text><rect x="330" y="228" width="360" height="24" rx="6" fill="#0EA5E9"/><text x="700" y="245" text-anchor="start" font-size="13" font-weight="700" fill="#0369A1" font-family="Segoe UI, Tahoma, Arial, sans-serif">20 – 160 MHz</text><text x="20" y="285" text-anchor="start" font-size="14" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">5G</text><text x="165" y="285" text-anchor="start" font-size="12" font-weight="500" fill="#6B7280" font-family="Segoe UI, Tahoma, Arial, sans-serif">3 – 100 GHz</text><rect x="330" y="270" width="450" height="24" rx="6" fill="#0EA5E9"/><text x="790.0" y="287" text-anchor="start" font-size="13" font-weight="700" fill="#0369A1" font-family="Segoe UI, Tahoma, Arial, sans-serif">up to several GHz</text><text x="430" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#6B7280" font-family="Segoe UI, Tahoma, Arial, sans-serif">more bandwidth → more data per second (bar length is not to scale)</text></svg>