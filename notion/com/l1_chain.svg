7" font-family="Segoe UI, Tahoma, Arial, sans-serif">Channel Decoder</text><text x="495.0" y="239.0" text-anchor="middle" font-size="10" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">fix errors</text><path d="M570 225 L565.0 225.0" stroke="#334155" stroke-width="2.5" fill="none"/><path d="M555 225 L565.0 230.0 L565.0 220.0 Z" fill="#334155"/><rect x="300" y="190" width="120" height="70" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="360.0" y="221.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Source Decoder</text><text x="360.0" y="239.0" text-anchor="middle" font-size="10" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">decompress</text><path d="M435 225 L430.0 225.0" stroke="#334155" stroke-width="2.5" fill="none"/><path d="M420 225 L430.0 230.0 L430.0 220.0 Z" fill="#334155"/><rect x="165" y="190" width="120" height="70" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="225.0" y="221.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Destination</text><text x="225.0" y="239.0" text-anchor="middle" font-size="10" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">speaker / screen</text><path d="M300 225 L295.0 225.0" stroke="#334155" stroke-width="2.5" fill="none"/><path d="M285 225 L295.0 230.0 L295.0 220.0 Z" fill="#334155"/><path d="M630 130 L630.0 180.0" stroke="#334155" stroke-width="2.5" fill="none"/><path d="M630 190 L635.0 180.0 L625.0 180.0 Z" fill="#334155"/><text x="380" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D" font-family="Segoe UI, Tahoma, Arial, sans-serif">RECEIVER (does the same steps in reverse)</text></svg>