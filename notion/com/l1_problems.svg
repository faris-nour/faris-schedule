<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 175" width="905" height="175"><rect width="905" height="175" fill="#FFFFFF"/><text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">3 problems a signal can face</text><rect x="20" y="50" width="275" height="110" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="157.5" y="92.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Noise</text><text x="157.5" y="110.0" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">from the environment</text><text x="157.5" y="128.0" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">not under our control</text><rect x="315" y="50" width="275" height="110" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="452.5" y="92.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Interference</text><text x="452.5" y="110.0" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">2+ signals overlap</text><text x="452.5" y="128.0" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">often bad design</text><rect x="610" y="50" width="275" height="110" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="747.5" y="92.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Jamming</text><text x="747.5" y="110.0" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">interference ON PURPOSE</text><text x="747.5" y="128.0" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">to destroy the signal</text></svg>