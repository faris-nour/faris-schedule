<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390"><rect width="720" height="390" fill="#FFFFFF"/><text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">16-QAM: 16 points = 4 bits per symbol</text><line x1="80" y1="210" x2="420" y2="210" stroke="#94A3B8"/><line x1="250" y1="50" x2="250" y2="370" stroke="#94A3B8"/><circle cx="115" cy="75" r="9" fill="#7C3AED"/><circle cx="115" cy="165" r="9" fill="#7C3AED"/><circle cx="115" cy="255" r="9" fill="#7C3AED"/><circle cx="115" cy="345" r="9" fill="#7C3AED"/><circle cx="205" cy="75" r="9" fill="#7C3AED"/><circle cx="205" cy="165" r="9" fill="#7C3AED"/><circle cx="205" cy="255" r="9" fill="#7C3AED"/><circle cx="205" cy="345" r="9" fill="#7C3AED"/><circle cx="295" cy="75" r="9" fill="#7C3AED"/><circle cx="295" cy="165" r="9" fill="#7C3AED"/><circle cx="295" cy="255" r="9" fill="#7C3AED"/><circle cx="295" cy="345" r="9" fill="#7C3AED"/><circle cx="385" cy="75" r="9" fill="#7C3AED"/><circle cx="385" cy="165" r="9" fill="#7C3AED"/><circle cx="385" cy="255" r="9" fill="#7C3AED"/><circle cx="385" cy="345" r="9" fill="#7C3AED"/><line x1="250" y1="210" x2="385" y2="75" stroke="#F59E0B" stroke-width="2.5"/><text x="340" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309" font-family="Segoe UI, Tahoma, Arial, sans-serif">amplitude</text><text x="300" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309" font-family="Segoe UI, Tahoma, Arial, sans-serif">phase</text><text x="560" y="110" text-anchor="middle" font-size="14" font-weight="500" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">each point = a different</text><text x="560" y="138" text-anchor="middle" font-size="14" font-weight="500" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">amplitude + phase combo</text><text x="560" y="166" text-anchor="middle" font-size="14" font-weight="500" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif"></text><text x="560" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">QPSK: 4 points → 2 bits</text><text x="560" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">16-QAM: 16 points → 4 bits</text><text x="560" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">64-QAM: 64 points → 6 bits</text><text x="560" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED" font-family="Segoe UI, Tahoma, Arial, sans-serif">bits = log₂(points)</text></svg>