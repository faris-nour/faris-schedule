<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" width="900" height="275"><rect width="900" height="275" fill="#FFFFFF"/><text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">Single-mode vs Multimode fiber</text><text x="225" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" font-family="Segoe UI, Tahoma, Arial, sans-serif">Single-mode (SMF)</text><rect x="20" y="75" width="410" height="90" rx="8" fill="#E5E7EB"/><rect x="20" y="113.0" width="410" height="14" fill="#BAE6FD"/><line x1="25" y1="120" x2="425" y2="120" stroke="#F59E0B" stroke-width="3"/><text x="225" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#374151" font-family="Segoe UI, Tahoma, Arial, sans-serif">core 8–10 µm · ONE path</text><text x="225" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" font-family="Segoe UI, Tahoma, Arial, sans-serif">long distance (40 km+)</text><text x="225" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" font-family="Segoe UI, Tahoma, Arial, sans-serif">higher bandwidth · lower loss</text><text x="225" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" font-family="Segoe UI, Tahoma, Arial, sans-serif">more expensive</text><text x="675" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626" font-family="Segoe UI, Tahoma, Arial, sans-serif">Multimode (MMF)</text><rect x="470" y="75" width="410" height="90" rx="8" fill="#E5E7EB"/><rect x="470" y="95.0" width="410" height="50" fill="#BAE6FD"/><polyline points="475.0,111.2 505.0,128.8 535.0,111.2 565.0,128.8 595.0,111.2 625.0,128.8 655.0,111.2 685.0,128.8 715.0,111.2 745.0,128.8 775.0,111.2 805.0,128.8 835.0,111.2 865.0,128.8" fill="none" stroke="#F59E0B" stroke-width="2.5"/><polyline points="475.0,104.6 525.0,135.4 575.0,104.6 625.0,135.4 675.0,104.6 725.0,135.4 775.0,104.6 825.0,13