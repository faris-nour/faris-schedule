<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200"><rect width="900" height="200" fill="#FFFFFF"/><text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" font-family="Segoe UI, Tahoma, Arial, sans-serif">Dispersion: 3 types (all make the pulse wider)</text><rect x="15" y="50" width="280" height="105" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="155.0" y="89.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Modal</text><text x="155.0" y="107.5" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">different PATHS</text><text x="155.0" y="125.5" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">multimode only</text><rect x="310" y="50" width="280" height="105" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450.0" y="89.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">Chromatic</text><text x="450.0" y="107.5" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">different COLORS (λ)</text><text x="450.0" y="125.5" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">single &amp; multimode</text><rect x="605" y="50" width="280" height="105" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="745.0" y="89.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" font-family="Segoe UI, Tahoma, Arial, sans-serif">PMD (polarization)</text><text x="745.0" y="107.5" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">different POLARIZATIONS</text><text x="745.0" y="125.5" text-anchor="middle" font-size="14" font-weight="500" fill="#4B5563" font-family="Segoe UI, Tahoma, Arial, sans-serif">single-mode · fiber imperfections</text><text x="450" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#B91C1C" font-family="Segoe UI, Tahoma, Arial, sans-serif">wider pulses overlap → ISI → wrong bits → lower data rate</text></svg>