<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="aC92A2A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C92A2A"/></marker><marker id="a212529" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#212529"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">2. Wavelength Add/Drop Multiplexer (WADM / OADM)</text><polygon points="200,70 260,100 260,320 200,350" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><polygon points="800,70 740,100 740,320 800,350" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="230" y="372.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">DEMUX</text><text x="770" y="372.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">MUX</text><line x1="60" y1="200" x2="198" y2="200" stroke="#212529" stroke-width="3" marker-end="url(#a212529)"/><line x1="800" y1="200" x2="950" y2="200" stroke="#212529" stroke-width="3" marker-end="url(#a212529)"/><text x="120" y="184.6" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">λ1 … λn</text><line x1="260" y1="110" x2="440" y2="110" stroke="#3B5BDB" stroke-width="2.5"/><line x1="560" y1="110" x2="740" y2="110" stroke="#3B5BDB" stroke-width="2.5"/><rect x="440" y="88" width="120" height="44" rx="6" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="500.0" y="114.2" font-size="12" fill="#E67700" text-anchor="middle" font-weight="700">switch λ1</text><line x1="260" y1="190" x2="440" y2="190" stroke="#C92A2A" stroke-width="2.5"/><line x1="560" y1="190" x2="740" y2="190" stroke="#C92A2A" stroke-width="2.5"/><rect x="440" y="168" width="120" height="44" rx="6" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="500.0" y="194.2" font-size="12" fill="#E67700" text-anchor="middle" font-weight="700">switch λ2</text><line x1="260" y1="300" x2="440" y2="300" stroke="#2B8A3E" stroke-width="2.5"/><line x1="560" y1="300" x2="740" y2="300" stroke="#2B8A3E" stroke-width="2.5"/><rect x="440" y="278" width="120" height="44" rx="6" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="500.0" y="304.2" font-size="12" fill="#E67700" text-anchor="middle" font-weight="700">switch λ3</text><line x1="480" y1="212" x2="480" y2="262" stroke="#C92A2A" stroke-width="2" marker-end="url(#aC92A2A)"/><text x="470" y="254.2" font-size="12" fill="#C92A2A" text-anchor="end" font-weight="700">drop λ2</text><line x1="520" y1="262" x2="520" y2="214" stroke="#C92A2A" stroke-width="2" marker-end="url(#aC92A2A)"/><text x="530" y="254.2" font-size="12" fill="#C92A2A" text-anchor="start" font-weight="700">add new λ2</text><text x="500" y="62.5" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">one switch per wavelength: pass through, or drop the old stream and add a new one</text></svg>