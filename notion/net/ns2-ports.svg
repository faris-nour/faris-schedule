<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Ports in a DNS request and reply</text><rect x="60" y="120" width="200" height="90" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="160.0" y="161.2" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">Client</text><text x="160.0" y="178.7" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">192.168.1.10</text><rect x="740" y="120" width="200" height="90" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="840.0" y="161.2" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">DNS server</text><text x="840.0" y="178.7" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">8.8.8.8</text><line x1="262" y1="145" x2="738" y2="145" stroke="#3B5BDB" stroke-width="2.5" marker-end="url(#a3B5BDB)"/><rect x="393.08" y="125.6" width="213.84000000000003" height="20.8" rx="5" fill="white" opacity=".92"/><text x="500.0" y="140.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">request · src 52344 → dst 53</text><line x1="738" y1="190" x2="262" y2="190" stroke="#2B8A3E" stroke-width="2.5" marker-end="url(#a2B8A3E)"/><rect x="400.36" y="170.6" width="199.28000000000003" height="20.8" rx="5" fill="white" opacity=".92"/><text x="500.0" y="185.6" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">reply · src 53 → dst 52344</text><text x="500" y="269.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">the client picks a random (ephemeral) source port · the server listens on well-known port 53</text><text x="500" y="304.7" font-size="13.5" fill="#C92A2A" text-anchor="middle" font-weight="700">in the reply the two ports simply swap places</text></svg>