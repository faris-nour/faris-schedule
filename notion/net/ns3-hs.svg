<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Three-way handshake</text><rect x="120" y="60" width="160" height="46" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="200.0" y="88.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">Client</text><rect x="720" y="60" width="160" height="46" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="800.0" y="88.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">Server</text><line x1="200" y1="106" x2="200" y2="400" stroke="#adb5bd" stroke-dasharray="5 4"/><line x1="800" y1="106" x2="800" y2="400" stroke="#adb5bd" stroke-dasharray="5 4"/><line x1="202" y1="140" x2="798" y2="190" stroke="#3B5BDB" stroke-width="2.5" marker-end="url(#a3B5BDB)"/><rect x="400.36" y="145.6" width="199.28000000000003" height="20.8" rx="5" fill="white" opacity=".92"/><text x="500.0" y="160.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">1. SYN  (request to start)</text><line x1="798" y1="220" x2="202" y2="270" stroke="#2B8A3E" stroke-width="2.5" marker-end="url(#a2B8A3E)"/><rect x="371.24" y="225.6" width="257.52" height="20.8" rx="5" fill="white" opacity=".92"/><text x="500.0" y="240.6" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">2. SYN, ACK  (server acknowledges)</text><line x1="202" y1="300" x2="798" y2="350" stroke="#3B5BDB" stroke-width="2.5" marker-end="url(#a3B5BDB)"/><rect x="378.52" y="305.6" width="242.96000000000004" height="20.8" rx="5" fill="white" opacity=".92"/><text x="500.0" y="320.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">3. ACK  (connection established)</text><text x="500" y="404.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">after the 3 packets the data (e.g. HTTP GET) can flow</text></svg>