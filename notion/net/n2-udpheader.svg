<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">UDP segment header (RFC 768)</text><text x="400" y="66.9" font-size="14" fill="#495057" text-anchor="middle" font-weight="700">← 32 bits →</text><rect x="150" y="80" width="250" height="50" rx="4" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="275.0" y="110.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">source port #</text><rect x="400" y="80" width="250" height="50" rx="4" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="525.0" y="110.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">dest port #</text><rect x="150" y="130" width="250" height="50" rx="4" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="275.0" y="160.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">length</text><rect x="400" y="130" width="250" height="50" rx="4" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="525.0" y="160.2" font-size="15" fill="#C92A2A" text-anchor="middle" font-weight="700">checksum</text><rect x="150" y="180" width="500" height="70" rx="4" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="400.0" y="220.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">application data (payload)</text><text x="400" y="284.4" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">length = in bytes of UDP segment, including header</text></svg>