<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="460" viewBox="0 0 1050 460"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker><marker id="aadb5bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#adb5bd"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="525.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Stop-and-wait vs pipelining (1 Gbps, 15 ms prop., 8000-bit packet)</text><rect x="70" y="42" width="120" height="32" rx="8" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="130.0" y="62.5" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">sender</text><rect x="320" y="42" width="120" height="32" rx="8" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="380.0" y="62.5" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">receiver</text><line x1="130" y1="80" x2="130" y2="420" stroke="#adb5bd" stroke-width="2"/><line x1="380" y1="80" x2="380" y2="420" stroke="#adb5bd" stroke-width="2"/><polygon points="130,90 130,98 380,240 380,232" fill="#3B5BDB" opacity=".35"/><text x="255" y="136.7" font-size="12" fill="#3B5BDB" text-anchor="middle" font-weight="700">first packet</text><text x="255" y="151.7" font-size="12" fill="#3B5BDB" text-anchor="middle" font-weight="700">L/R = 8 µs</text><line x1="380" y1="240" x2="130" y2="390" stroke="#2B8A3E" stroke-width="2" marker-end="url(#a2B8A3E)"/><g transform="rotate(-31.0 255.0 315.0)"><rect x="240.2" y="297.4" width="29.6" height="18.0" rx="4" fill="white" opacity=".9"/><text x="255.0" y="311.0" font-size="12" text-anchor="middle" font-weight="700" fill="#2B8A3E">ACK</text></g><path d="M122 90 h-10 V390 h10" stroke="#D9480F" stroke-width="2" fill="none"/><text x="108" y="236.7" font-size="12" fill="#D9480F" text-anchor="end" font-weight="700">RTT + L/R</text><text x="108" y="251.7" font-size="12" fill="#D9480F" text-anchor="end" font-weight="700">= 30.008 ms</text><rect x="470" y="80" width="540" height="150" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="740" y="110.6" font-size="16" fill="#3B5BDB" text-anchor="middle" font-weight="700">Stop-and-wait</text><text x="740" y="149.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Dtrans = L/R = 8000 / 10⁹ = 8 µs</text><text x="740" y="184.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">U = (L/R) / (RTT + L/R) = 0.008 / 30.008</text><text x="740" y="216.9" font-size="14" fill="#C92A2A" text-anchor="middle" font-weight="700">= 0.00027 → performance stinks!</text><rect x="470" y="260" width="540" height="140" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="740" y="290.6" font-size="16" fill="#2B8A3E" text-anchor="middle" font-weight="700">3-packet pipelining</text><text x="740" y="329.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">U = (3L/R) / (RTT + L/R) = 0.024 / 30.008</text><text x="740" y="364.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">= 0.00081 → ×3 utilization</text></svg>