<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">TCP segment structure</text><text x="500" y="62.9" font-size="14" fill="#495057" text-anchor="middle" font-weight="700">← 32 bits →</text><rect x="170" y="75" width="330.0" height="44" rx="3" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="335.0" y="101.9" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">source port #</text><rect x="500.0" y="75" width="330.0" height="44" rx="3" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="665.0" y="101.9" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">dest port #</text><rect x="170" y="119" width="660" height="44" rx="3" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="500.0" y="145.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">sequence number</text><rect x="170" y="163" width="660" height="44" rx="3" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="500.0" y="189.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">acknowledgement number</text><rect x="170" y="207" width="90" height="44" rx="3" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="215.0" y="226.0" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">head</text><text x="215.0" y="239.7" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">len</text><rect x="260" y="207" width="60" height="44" rx="3" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="290.0" y="226.0" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">not</text><text x="290.0" y="239.7" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">used</text><rect x="320.0" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="331.25" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">C</text><rect x="342.5" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="353.75" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">E</text><rect x="365.0" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="376.25" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">U</text><rect x="387.5" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="398.75" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">A</text><rect x="410.0" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="421.25" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">P</text><rect x="432.5" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="443.75" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">R</text><rect x="455.0" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="466.25" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">S</text><rect x="477.5" y="207" width="22.5" height="44" rx="2" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="488.75" y="233.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">F</text><rect x="500" y="207" width="330.0" height="44" rx="3" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="665.0" y="233.9" font-size="14" fill="#6741D9" text-anchor="middle" font-weight="700">receive window</text><rect x="170" y="251" width="330.0" height="44" rx="3" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="335.0" y="277.9" font-size="14" fill="#0C8599" text-anchor="middle" font-weight="700">checksum</text><rect x="500.0" y="251" width="330.0" height="44" rx="3" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="665.0" y="277.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">Urg data pointer</text><rect x="170" y="295" width="660" height="44" rx="3" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="500.0" y="321.9" font-size="14" fill="#495057" text-anchor="middle" font-weight="700">options (variable length)</text><rect x="170" y="339" width="660" height="70" rx="3" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="500.0" y="378.9" font-size="14" fill="#E67700" text-anchor="middle" font-weight="700">application data (variable length)</text><text x="500" y="444.4" font-size="12.5" fill="#343a40" text-anchor="middle" font-weight="700">seq # / ACK #: counting bytes of data (not segments) · A = this is an ACK</text><text x="500" y="469.4" font-size="12.5" fill="#343a40" text-anchor="middle" font-weight="700">C, E = congestion notification · R S F = RST, SYN, FIN (connection management)</text><text x="500" y="494.4" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">receive window = # bytes receiver willing to accept (flow control)</text></svg>