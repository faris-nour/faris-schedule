<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">UDP header: 4 fields, 8 bytes</text><text x="104" y="77.8" font-size="11" fill="#868e96" text-anchor="start">bit 0</text><text x="500" y="77.8" font-size="11" fill="#868e96" text-anchor="middle">16</text><text x="896" y="77.8" font-size="11" fill="#868e96" text-anchor="end">31</text><rect x="100" y="90" width="400" height="60" rx="4" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="300.0" y="124.9" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">Source Port (2 bytes)</text><rect x="500" y="90" width="400" height="60" rx="4" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="700.0" y="124.9" font-size="14" fill="#6741D9" text-anchor="middle" font-weight="700">Destination Port (2 bytes)</text><rect x="100" y="150" width="400" height="60" rx="4" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="300.0" y="184.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">Length (2 bytes)</text><rect x="500" y="150" width="400" height="60" rx="4" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="700.0" y="184.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">Checksum (2 bytes)</text><rect x="100" y="210" width="800" height="50" rx="4" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="500.0" y="239.9" font-size="14" fill="#495057" text-anchor="middle" font-weight="700">Data (payload)</text><text x="500" y="299.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">Length = header + data · Checksum: optional for IPv4, mandatory for IPv6</text></svg>