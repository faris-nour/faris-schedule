<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="525.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Transport layer actions</text><rect x="40" y="60" width="460" height="50" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="270.0" y="91.3" font-size="18" fill="#D9480F" text-anchor="middle" font-weight="700">Sender</text><rect x="60" y="135" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="80" y="166.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">1</text><text x="280" y="165.6" font-size="13" fill="#343a40" text-anchor="middle">is passed an application-layer message</text><line x1="270" y1="187" x2="270" y2="201" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="60" y="203" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="80" y="234.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">2</text><text x="280" y="233.6" font-size="13" fill="#343a40" text-anchor="middle">determines segment header fields values</text><line x1="270" y1="255" x2="270" y2="269" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="60" y="271" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="80" y="302.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">3</text><text x="280" y="301.6" font-size="13" fill="#343a40" text-anchor="middle">creates segment</text><line x1="270" y1="323" x2="270" y2="337" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="60" y="339" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="80" y="370.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">4</text><text x="280" y="369.6" font-size="13" fill="#343a40" text-anchor="middle">passes segment to IP</text><rect x="550" y="60" width="460" height="50" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="780.0" y="91.3" font-size="18" fill="#2B8A3E" text-anchor="middle" font-weight="700">Receiver</text><rect x="570" y="135" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="590" y="166.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">1</text><text x="790" y="165.6" font-size="13" fill="#343a40" text-anchor="middle">receives segment from IP</text><line x1="780" y1="187" x2="780" y2="201" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="570" y="203" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="590" y="234.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">2</text><text x="790" y="233.6" font-size="13" fill="#343a40" text-anchor="middle">checks header values</text><line x1="780" y1="255" x2="780" y2="269" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="570" y="271" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="590" y="302.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">3</text><text x="790" y="301.6" font-size="13" fill="#343a40" text-anchor="middle">extracts application-layer message</text><line x1="780" y1="323" x2="780" y2="337" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="570" y="339" width="420" height="52" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="590" y="370.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">4</text><text x="790" y="361.4" font-size="13" 