 d="M600 175 C680 120, 680 280, 610 228" stroke="#C92A2A" stroke-width="2" fill="none" marker-end="url(#aC92A2A)"/><text x="700" y="196.7" font-size="12" fill="#C92A2A" text-anchor="start" font-weight="700">isNAK →</text><text x="700" y="211.7" font-size="12" fill="#C92A2A" text-anchor="start" font-weight="700">retransmit</text><ellipse cx="920" cy="200" rx="95" ry="55" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="920" y="196.4" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">Wait for call</text><text x="920" y="212.7" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">from below</text><path d="M880 148 C850 70, 990 70, 960 148" stroke="#C92A2A" stroke-width="2" fill="none" marker-end="url(#aC92A2A)"/><text x="920" y="62.2" font-size="12" fill="#C92A2A" text-anchor="middle" font-weight="700">corrupt → send NAK</text><path d="M960 252 C990 330, 850 330, 880 252" stroke="#2B8A3E" stroke-width="2" fill="none" marker-end="url(#a2B8A3E)"/><text x="920" y="356.2" font-size="12" fill="#2B8A3E" text-anchor="middle" font-weight="700">notcorrupt → deliver + ACK</text><text x="360" y="389.9" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">SENDER</text><text x="920" y="389.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">RECEIVER</text></svg>