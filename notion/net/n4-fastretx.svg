ght="700">Seq=100  ✕ lost</text><line x1="250" y1="144" x2="642" y2="234" stroke="#3B5BDB" stroke-width="2" marker-end="url(#a3B5BDB)"/><text x="662" y="237.8" font-size="11" fill="#3B5BDB" text-anchor="start" font-weight="700">Seq=120</text><line x1="250" y1="166" x2="642" y2="256" stroke="#3B5BDB" stroke-width="2" marker-end="url(#a3B5BDB)"/><text x="662" y="259.9" font-size="11" fill="#3B5BDB" text-anchor="start" font-weight="700">Seq=135</text><line x1="250" y1="188" x2="642" y2="278" stroke="#3B5BDB" stroke-width="2" marker-end="url(#a3B5BDB)"/><text x="662" y="281.9" font-size="11" fill="#3B5BDB" text-anchor="start" font-weight="700">Seq=150</text><text x="500" y="185.0" font-size="20" fill="#C92A2A" text-anchor="middle" font-weight="700">✕</text><line x1="650" y1="250" x2="258" y2="310" stroke="#2B8A3E" stroke-width="2" marker-end="url(#a2B8A3E)"/><text x="240" y="313.9" font-size="11" fill="#2B8A3E" text-anchor="end" font-weight="700">ACK=100 (for Seq=92)</text><line x1="650" y1="284" x2="258" y2="344" stroke="#2B8A3E" stroke-width="2" marker-end="url(#a2B8A3E)"/><text x="240" y="347.9" font-size="11" fill="#C2255C" text-anchor="end" font-weight="700">dup ACK=100 #1</text><line x1="650" y1="318" x2="258" y2="378" stroke="#2B8A3E" stroke-width="2" marker-end="url(#a2B8A3E)"/><text x="240" y="381.9" font-size="11" fill="#C2255C" text-anchor="end" font-weight="700">dup ACK=100 #2</text><line x1="650" y1="352" x2="258" y2="412" stroke="#2B8A3E" stroke-width="2" marker-end="url(#a2B8A3E)"/><text x="240" y="415.9" font-size="11" fill="#C92A2A" text-anchor="end" font-weight="700">dup ACK=100 #3 → resend!</text><line x1="250" y1="430" x2="650" y2="490" stroke="#D9480F" stroke-width="2" marker-end="url(#aD9480F)"/><g transform="rotate(8.5 450.0 460.0)"><rect x="352.4" y="442.4" width="195.2" height="18.0" rx="4" fill="white" opacity=".9"/><text x="450.0" y="456.0" font-size="12" text-anchor="middle" font-weight="700" fill="#D9480F">Seq=100, 20 bytes (resend)</text></g><text x="450" y="539.5" font-size="13" fill="#C92A2A" text-anchor="middle" font-weight="700">3 duplicate ACKs → resend the unACKed segment with smallest seq #</text><text x="450" y="564.5" font-size="13" fill="#C92A2A" text-anchor="middle" font-weight="700">(likely lost, so don&#x27;t wait for the timeout)</text></svg>