<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Well-known TCP ports (0 – 1023) vs ephemeral ports</text><rect x="40" y="70" width="215" height="75" rx="10" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="147" y="99.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">HTTP</text><text x="147" y="128.3" font-size="18" fill="#3B5BDB" text-anchor="middle" font-weight="700">80</text><rect x="275" y="70" width="215" height="75" rx="10" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="382" y="99.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">HTTPS</text><text x="382" y="128.3" font-size="18" fill="#3B5BDB" text-anchor="middle" font-weight="700">443</text><rect x="510" y="70" width="215" height="75" rx="10" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="617" y="99.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">FTP control</text><text x="617" y="128.3" font-size="18" fill="#3B5BDB" text-anchor="middle" font-weight="700">21</text><rect x="745" y="70" width="215" height="75" rx="10" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="852" y="99.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">FTP data</text><text x="852" y="128.3" font-size="18" fill="#3B5BDB" text-anchor="middle" font-weight="700">20</text><rect x="40" y="165" width="215" height="75" rx="10" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="147" y="194.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">SSH</text><text x="147" y="223.3" font-size="18" fill="#0C8599" text-anchor="middle" font-weight="700">22</text><rect x="275" y="165" width="215" height="75" rx="10" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="382" y="194.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">SMTP</text><text x="382" y="223.3" font-size="18" fill="#0C8599" text-anchor="middle" font-weight="700">25</text><rect x="510" y="165" width="215" height="75" rx="10" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="617" y="194.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">IMAP / IMAPS</text><text x="617" y="223.3" font-size="18" fill="#0C8599" text-anchor="middle" font-weight="700">143 / 993</text><rect x="745" y="165" width="215" height="75" rx="10" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="852" y="194.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">POP3 / POP3S</text><text x="852" y="223.3" font-size="18" fill="#0C8599" text-anchor="middle" font-weight="700">110 / 995</text><rect x="40" y="280" width="920" height="70" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="500" y="308.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">Ephemeral ports 49152 – 65535</text><text x="500" y="334.4" font-size="12.5" fill="#343a40" text-anchor="middle">high numbers the client picks temporarily as its SOURCE port when it opens a connection</text></svg>