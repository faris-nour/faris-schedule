<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Example: HTTP request ports</text><rect x="60" y="110" width="220" height="90" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="170.0" y="143.3" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">Client</text><text x="170.0" y="159.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">192.168.1.10</text><text x="170.0" y="175.8" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">port 54321 (random)</text><rect x="720" y="110" width="220" height="90" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="830.0" y="143.3" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">Web server</text><text x="830.0" y="159.6" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">93.184.216.34</text><text x="830.0" y="175.8" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">port 80</text><line x1="282" y1="140" x2="718" y2="140" stroke="#3B5BDB" stroke-width="2.5" marker-end="url(#a3B5BDB)"/><rect x="407.64" y="120.6" width="184.72000000000003" height="20.8" rx="5" fill="white" opacity=".92"/><text x="500.0" y="135.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">SYN · src 54321 → dst 80</text><line x1="718" y1="180" x2="282" y2="180" stroke="#2B8A3E" stroke-width="2.5" marker-end="url(#a2B8A3E)"/><rect x="393.08" y="160.6" width="213.84000000000003" height="20.8" rx="5" fill="white" opacity=".92"/><text x="500.0" y="175.6" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">SYN-ACK · src 80 → dst 54321</text><text x="500" y="254.9" font-size="14" fill="#C92A2A" text-anchor="middle" font-weight="700">the SERVER uses the well-known port · the CLIENT uses an ephemeral port</text><text x="500" y="289.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">FTP is the same idea with destination port 21 (control)</text></svg>