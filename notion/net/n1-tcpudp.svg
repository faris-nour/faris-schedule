<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Two principal Internet transport protocols</text><rect x="40" y="60" width="430" height="240" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="255" y="97.7" font-size="22" fill="#3B5BDB" text-anchor="middle" font-weight="700">TCP</text><text x="255" y="116.5" font-size="13" fill="#3B5BDB" text-anchor="middle">Transmission Control Protocol</text><text x="255" y="178.7" font-size="14" fill="#343a40" text-anchor="middle">✓ reliable, in-order delivery</text><text x="255" y="196.2" font-size="14" fill="#343a40" text-anchor="middle">✓ congestion control</text><text x="255" y="213.7" font-size="14" fill="#343a40" text-anchor="middle">✓ flow control</text><text x="255" y="231.2" font-size="14" fill="#343a40" text-anchor="middle">✓ connection setup</text><rect x="530" y="60" width="430" height="240" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="745" y="97.7" font-size="22" fill="#D9480F" text-anchor="middle" font-weight="700">UDP</text><text x="745" y="116.5" font-size="13" fill="#D9480F" text-anchor="middle">User Datagram Protocol</text><text x="745" y="177.4" font-size="14" fill="#343a40" text-anchor="middle">✗ unreliable, unordered delivery</text><text x="745" y="194.9" font-size="14" fill="#343a40" text-anchor="middle">✗ no-frills extension of</text><text x="745" y="212.4" font-size="14" fill="#343a40" text-anchor="middle">&quot;best-effort&quot; IP</text><text direction="rtl" unicode-bidi="embed" x="500" y="324.6" font-size="13" fill="#C92A2A" text-anchor="middle" font-weight="700">الاتنين مش بيدّوا: delay guarantees ولا bandwidth guarantees</text></svg>