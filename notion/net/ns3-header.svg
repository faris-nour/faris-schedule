<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">TCP header (minimum 20 bytes)</text><text x="104" y="71.8" font-size="11" fill="#868e96" text-anchor="start">bit 0</text><text x="500" y="71.8" font-size="11" fill="#868e96" text-anchor="middle">16</text><text x="896" y="71.8" font-size="11" fill="#868e96" text-anchor="end">31</text><rect x="100" y="80" width="400" height="58" rx="3" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="300.0" y="113.4" font-size="12.5" fill="#3B5BDB" text-anchor="middle" font-weight="700">Source Port (2)</text><rect x="500" y="80" width="400" height="58" rx="3" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="700.0" y="113.4" font-size="12.5" fill="#3B5BDB" text-anchor="middle" font-weight="700">Destination Port (2)</text><rect x="100" y="138" width="800" height="58" rx="3" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="500.0" y="171.4" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">Sequence Number (4)</text><rect x="100" y="196" width="800" height="58" rx="3" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="500.0" y="229.4" font-size="12.5" fill="#6741D9" text-anchor="middle" font-weight="700">Acknowledgment Number (4)</text><rect x="100" y="254" width="110" height="58" rx="3" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="155.0" y="279.6" font-size="12.5" fill="#495057" text-anchor="middle" font-weight="700">Hdr len</text><text x="155.0" y="295.2" font-size="12.5" fill="#495057" text-anchor="middle" font-weight="700">4 bits</text><rect x="210" y="254" width="80" height="58" rx="3" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="250.0" y="287.4" font-size="12.5" fill="#495057" text-anchor="middle" font-weight="700">rsvd</text><rect x="290" y="254" width="210" height="58" rx="3" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="395.0" y="279.6" font-size="12.5" fill="#D9480F" text-anchor="middle" font-weight="700">Flags 6 bits</text><text x="395.0" y="295.2" font-size="12.5" fill="#D9480F" text-anchor="middle" font-weight="700">URG ACK PSH RST SYN FIN</text><rect x="500" y="254" width="400" height="58" rx="3" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="700.0" y="287.4" font-size="12.5" fill="#2B8A3E" text-anchor="middle" font-weight="700">Window Size (2)</text><rect x="100" y="312" width="400" height="58" rx="3" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="300.0" y="345.4" font-size="12.5" fill="#C92A2A" text-anchor="middle" font-weight="700">Checksum (2)</text><rect x="500" y="312" width="400" height="58" rx="3" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="700.0" y="345.4" font-size="12.5" fill="#C92A2A" text-anchor="middle" font-weight="700">Urgent Pointer (2)</text><rect x="100" y="370" width="800" height="58" rx="3" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="500.0" y="403.4" font-size="12.5" fill="#495057" text-anchor="middle" font-weight="700">Options (variable: MSS, window scaling …)</text><text x="500" y="457.7" font-size="13.5" fill="#C92A2A" text-anchor="middle" font-weight="700">5 rows × 4 bytes = 20 bytes without options</text></svg>