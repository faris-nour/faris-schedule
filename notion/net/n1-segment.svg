<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="450.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Segment = transport header + application message</text><rect x="150" y="80" width="170" height="70" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="235.0" y="111.2" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">Th</text><text x="235.0" y="128.7" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">(transport header)</text><rect x="320" y="80" width="430" height="70" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="535.0" y="119.9" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">app. msg (application-layer message)</text><text direction="rtl" unicode-bidi="embed" x="450" y="189.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">الـ sender بيضيف الـ header، والـ receiver بيشيله ويطلّع الـ message</text></svg>