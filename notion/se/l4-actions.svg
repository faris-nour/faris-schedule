<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="450.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Activity with actions</text><rect x="150" y="60" width="600" height="230" rx="30" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="450" y="98.0" font-size="17" fill="#3B5BDB" text-anchor="middle" font-weight="700">Display Available Flights</text><line x1="160" y1="112" x2="740" y2="112" stroke="#3B5BDB" stroke-width="1.5"/><text x="180" y="144.6" font-size="13" fill="#D9480F" text-anchor="start" font-weight="700">entry/</text><text x="250" y="144.6" font-size="13" fill="#343a40" text-anchor="start">Find all flights for selected cities</text><text x="180" y="174.6" font-size="13" fill="#D9480F" text-anchor="start" font-weight="700">entry/</text><text x="250" y="174.6" font-size="13" fill="#343a40" text-anchor="start">Determine flights with available seats</text><text x="180" y="204.6" font-size="13" fill="#D9480F" text-anchor="start" font-weight="700">do/</text><text x="250" y="204.6" font-size="13" fill="#343a40" text-anchor="start">Display list of flights with available seats</text><text x="180" y="234.6" font-size="13" fill="#D9480F" text-anchor="start" font-weight="700">event/</text><text x="250" y="234.6" font-size="13" fill="#343a40" text-anchor="start">User request cost information / Display cost information</text><text x="180" y="264.6" font-size="13" fill="#D9480F" text-anchor="start" font-weight="700">exit/</text><text x="250" y="264.6" font-size="13" fill="#343a40" text-anchor="start">Clear temporary search data and disconnect from database</text></svg>