<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Three types of actors</text><circle cx="170" cy="114" r="10" fill="white" stroke="#3B5BDB" stroke-width="2.2"/><path d="M170 124 V148 M154 134 H186 M170 148 L157 166 M170 148 L183 166" stroke="#3B5BDB" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="170" y="186.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">Users of the system</text><text x="170" y="221.7" font-size="12" fill="#495057" text-anchor="middle">a person using the system directly</text><text x="170" y="236.7" font-size="12" fill="#495057" text-anchor="middle">e.g. Student · Cashier</text><rect x="420" y="100" width="160" height="70" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="500.0" y="131.2" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">«actor»</text><text x="500.0" y="148.7" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">Bank System</text><text x="500" y="221.7" font-size="12" fill="#495057" text-anchor="middle">another system that interacts</text><text x="500" y="236.7" font-size="12" fill="#495057" text-anchor="middle">e.g. Payment gateway</text><circle cx="830" cy="130" r="40" fill="#F1EBFF" stroke="#6741D9" stroke-width="2.5"/><path d="M830 130 V102 M830 130 L850 142" stroke="#6741D9" stroke-width="3" stroke-linecap="round"/><text x="830" y="194.9" font-size="14" fill="#6741D9" text-anchor="middle" font-weight="700">Time</text><text x="830" y="221.7" font-size="12" fill="#495057" text-anchor="middle">passing of time triggers an event</text><text x="830" y="236.7" font-size="12" fill="#495057" text-anchor="middle">e.g. end-of-month report</text></svg>