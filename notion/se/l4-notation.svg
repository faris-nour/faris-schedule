<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="525.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Elements of Activity Diagram</text><text x="150" y="69.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Start State</text><circle cx="150" cy="110" r="11" fill="#212529"/><text x="360" y="114.5" font-size="13" fill="#495057" text-anchor="middle">where the flow begins · only one</text><text x="150" y="184.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">End State</text><circle cx="150" cy="225" r="15" fill="white" stroke="#212529" stroke-width="2"/><circle cx="150" cy="225" r="9" fill="#212529"/><text x="360" y="229.6" font-size="13" fill="#495057" text-anchor="middle">where the flow ends · can be more than one</text><text x="150" y="299.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Activity</text><rect x="70.0" y="320.0" width="160" height="40" rx="20.0" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="150.0" y="344.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">Select Flight</text><text x="360" y="344.6" font-size="13" fill="#495057" text-anchor="middle">a task performed in the workflow</text><text x="150" y="414.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Object</text><rect x="75.0" y="430.0" width="150" height="50" fill="white" stroke="#495057" stroke-width="2"/><text x="150" y="451" font-size="13" text-anchor="middle" text-decoration="underline" font-weight="700" fill="#343a40">Object Name</text><text x="150" y="474.2" font-size="12" fill="#495057" text-anchor="middle">[State]</text><text x="360" y="459.6" font-size="13" fill="#495057" text-anchor="middle">an entity used or changed in the flow</text><text x="670" y="69.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Transition</text><line x1="600" y1="110" x2="740" y2="110" stroke="#495057" stroke-width="2.5" marker-end="url(#a495057)"/><text x="880" y="114.5" font-size="13" fill="#495057" text-anchor="middle">flow of control between activities</text><text x="670" y="184.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Decision point</text><polygon points="670,203 692,225 670,247 648,225" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="880" y="229.6" font-size="13" fill="#495057" text-anchor="middle">decision point in the workflow</text><text x="670" y="299.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Synchronization</text><rect x="600" y="336" width="140" height="8" rx="3" fill="#212529"/><text x="880" y="344.6" font-size="13" fill="#495057" text-anchor="middle">branches that occur in parallel</text><text x="670" y="414.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">Swim lane</text><rect x="595" y="425" width="75" height="60" rx="2" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="632.5" y="458.9" font-size="11" fill="#0C8599" text-anchor="middle" font-weight="700">Role A</text><rect x="670" y="425" width="75" height="60" rx="2" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="707.5" y="458.9" font-size="11" fill="#6741D9" text-anchor="middle" font-weight="700">Role B</text><text x="880" y="459.6" font-size="13" fill="#495057" text-anchor="middle">each swimlane = a role</text></svg>