<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Parametric form: one parameter t from 0 to 1</text><line x1="100" y1="150" x2="900" y2="150" stroke="#3B5BDB" stroke-width="4"/><circle cx="100.0" cy="150" r="8" fill="#D9480F"/><text x="100.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0</text><circle cx="180.0" cy="150" r="5" fill="#3B5BDB"/><text x="180.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.1</text><circle cx="260.0" cy="150" r="5" fill="#3B5BDB"/><text x="260.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.2</text><circle cx="340.0" cy="150" r="5" fill="#3B5BDB"/><text x="340.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.3</text><circle cx="420.0" cy="150" r="5" fill="#3B5BDB"/><text x="420.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.4</text><circle cx="500.0" cy="150" r="5" fill="#3B5BDB"/><text x="500.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.5</text><circle cx="580.0" cy="150" r="5" fill="#3B5BDB"/><text x="580.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.6</text><circle cx="660.0" cy="150" r="5" fill="#3B5BDB"/><text x="660.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.7</text><circle cx="740.0" cy="150" r="5" fill="#3B5BDB"/><text x="740.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.8</text><circle cx="820.0" cy="150" r="5" fill="#3B5BDB"/><text x="820.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=0.9</text><circle cx="900.0" cy="150" r="8" fill="#D9480F"/><text x="900.0" y="182.2" font-size="12" fill="#495057" text-anchor="middle">t=1</text><text x="100" y="111.4" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="700">(x1 , y1)</text><text x="100" y="127.7" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="700">start</text><text x="900" y="111.4" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="700">(x2 , y2)</text><text x="900" y="127.7" font-size="13" fill="#D9480F" text-anchor="middle" font-weight="700">end</text><text x="500" y="95.6" font-size="16" fill="#343a40" text-anchor="middle" font-weight="700">x = x1 + t (x2 − x1)      y = y1 + t (y2 − y1)</text><text x="500" y="244.9" font-size="14" fill="#495057" text-anchor="middle" font-weight="700">10 points → step 0.1   ·   100 points → step 0.01 (more accurate)</text></svg>