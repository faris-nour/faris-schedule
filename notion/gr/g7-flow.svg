<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Midpoint ellipse algorithm</text><rect x="80" y="55" width="840" height="52" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="500.0" y="86.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">1. Input rx , ry , (xc , yc) · first point (x0 , y0) = (0 , ry)</text><rect x="80" y="125" width="840" height="52" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="500.0" y="156.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">2. p1₀ = ry² − rx²·ry + ¼·rx²</text><rect x="60" y="200" width="880" height="250" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="500" y="230.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">REGION 1  (repeat while 2ry²x &lt; 2rx²y)</text><rect x="80" y="250" width="410" height="180" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="285" y="280.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">p1k &lt; 0</text><text x="285" y="332.9" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">next = (xk + 1 , yk)</text><text x="285" y="349.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700"></text><text x="285" y="366.6" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">p1k+1 = p1k + 2ry²xk+1 + ry²</text><rect x="510" y="250" width="410" height="180" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="715" y="280.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">p1k ≥ 0</text><text x="715" y="324.4" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">next = (xk + 1 , yk − 1)</text><text x="715" y="341.3" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700"></text><text x="715" y="358.2" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">p1k+1 = p1k + 2ry²xk+1</text><text x="715" y="375.0" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">− 2rx²yk+1 + ry²</text><rect x="80" y="470" width="840" height="60" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="500" y="504.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">4. p2₀ = ry²(x0 + ½)² + rx²(y0 − 1)² − rx²ry²   (last point of region 1)</text><rect x="60" y="550" width="880" height="230" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="500" y="580.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">REGION 2  (repeat until y = 0)</text><rect x="80" y="600" width="410" height="160" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="285" y="630.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">p2k &gt; 0</text><text x="285" y="677.9" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">next = (xk , yk − 1)</text><text x="285" y="694.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700"></text><text x="285" y="711.6" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">p2k+1 = p2k − 2rx²yk+1 + rx²</text><rect x="510" y="600" width="410" height="160" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="715" y="630.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">p2k ≤ 0</text><text x="715" y="669.4" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">next = (xk + 1 , yk − 1)</text><text x="715" y="686.3" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700"></text><text x="715" y="703.2" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">p2k+1 = p2k + 2ry²xk+1</text><text x="715" y="720.0" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">− 2rx²yk+1 + rx²</text><rect x="80" y="800" width="840" height="70" rx="12" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="500" y="831.3" font-size="13.5" fill="#0C8599" text-anchor="middle" font-weight="700">6-7. symmetry in the other 3 quadrants · x = x + xc , y = y + yc</text><text x="500" y="848.2" font-size="13.5" fill="#0C8599" text-anchor="middle" font-weight="700">increments: 2ry²xk+1 = 2ry²xk + 2ry²  ·  2rx²yk+1 = 2rx²yk − 2rx²</text><line x1="500" y1="107" x2="500" y2="123" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><line x1="500" y1="177" x2="500" y2="198" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><line x1="500" y1="450" x2="500" y2="468" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><line x1="500" y1="530" x2="500" y2="548" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><line x1="500" y1="780" x2="500" y2="798" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/></svg>