<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="aD9480F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9480F"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="525.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">2D transformations</text><line x1="60" y1="230" x2="320" y2="230" stroke="#dee2e6"/><line x1="190" y1="90" x2="190" y2="340" stroke="#dee2e6"/><rect x="150" y="190" width="80" height="80" fill="#adb5bd" opacity="1" stroke="#495057" stroke-dasharray="5 4" fill-opacity="0"/><rect x="214" y="150" width="80" height="80" fill="#3B5BDB" opacity="0.8"/><line x1="190" y1="230" x2="252" y2="191" stroke="#D9480F" stroke-width="2" marker-end="url(#aD9480F)"/><text x="190" y="76.0" font-size="17" fill="#3B5BDB" text-anchor="middle" font-weight="700">glTranslatef</text><text x="190" y="359.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">glTranslatef(40, 25, 0);</text><text x="190" y="389.4" font-size="12.5" fill="#495057" text-anchor="middle">moves by x and y (z = 0)</text><line x1="400" y1="230" x2="660" y2="230" stroke="#dee2e6"/><line x1="530" y1="90" x2="530" y2="340" stroke="#dee2e6"/><rect x="490" y="190" width="80" height="80" fill="#adb5bd" opacity="1" stroke="#495057" stroke-dasharray="5 4" fill-opacity="0"/><rect x="490" y="190" width="80" height="80" fill="#3B5BDB" opacity="0.8" transform="rotate(-30 530 230)"/><text x="530" y="76.0" font-size="17" fill="#3B5BDB" text-anchor="middle" font-weight="700">glRotatef</text><text x="530" y="359.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">glRotatef(30, 0, 0, 1);</text><text x="530" y="389.4" font-size="12.5" fill="#495057" text-anchor="middle">counter-clockwise around the origin</text><line x1="740" y1="230" x2="1000" y2="230" stroke="#dee2e6"/><line x1="870" y1="90" x2="870" y2="340" stroke="#dee2e6"/><rect x="830" y="190" width="80" height="80" fill="#adb5bd" opacity="1" stroke="#495057" stroke-dasharray="5 4" fill-opacity="0"/><rect x="810" y="210" width="120" height="40" fill="#3B5BDB" opacity="0.8"/><text x="870" y="76.0" font-size="17" fill="#3B5BDB" text-anchor="middle" font-weight="700">glScalef</text><text x="870" y="359.7" font-size="13.5" fill="#343a40" text-anchor="middle" font-weight="700">glScalef(1.5, 0.5, 1);</text><text x="870" y="389.4" font-size="12.5" fill="#495057" text-anchor="middle">stretches x and y (z = 1)</text></svg>