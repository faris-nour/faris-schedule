<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">DDA line algorithm: steps</text><rect x="200" y="60" width="600" height="52" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="235" y="92.3" font-size="18" fill="#3B5BDB" text-anchor="middle" font-weight="700">1</text><text x="520" y="91.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">Input (x1,y1) and (x2,y2)</text><line x1="500" y1="112" x2="500" y2="126" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="200" y="128" width="600" height="52" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="235" y="160.3" font-size="18" fill="#3B5BDB" text-anchor="middle" font-weight="700">2</text><text x="520" y="159.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">Δx = x2 − x1 ,  Δy = y2 − y1</text><line x1="500" y1="180" x2="500" y2="194" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="200" y="196" width="600" height="52" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="235" y="228.3" font-size="18" fill="#6741D9" text-anchor="middle" font-weight="700">3</text><text x="520" y="227.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">steps = max( |Δx| , |Δy| )</text><line x1="500" y1="248" x2="500" y2="262" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="200" y="264" width="600" height="52" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="235" y="296.3" font-size="18" fill="#6741D9" text-anchor="middle" font-weight="700">4</text><text x="520" y="295.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">xinc = Δx / steps ,  yinc = Δy / steps</text><line x1="500" y1="316" x2="500" y2="330" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="200" y="332" width="600" height="52" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="235" y="364.3" font-size="18" fill="#D9480F" text-anchor="middle" font-weight="700">5</text><text x="520" y="363.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">Start: x = x1 , y = y1 → plot (round x , round y)</text><line x1="500" y1="384" x2="500" y2="398" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="200" y="400" width="600" height="52" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="235" y="432.3" font-size="18" fill="#D9480F" text-anchor="middle" font-weight="700">6</text><text x="520" y="431.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">x = x + xinc ,  y = y + yinc → plot (round)</text><line x1="500" y1="452" x2="500" y2="466" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="200" y="468" width="600" height="52" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="235" y="500.3" font-size="18" fill="#2B8A3E" text-anchor="middle" font-weight="700">7</text><text x="520" y="499.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">Repeat step 6 until (x2 , y2)</text></svg>