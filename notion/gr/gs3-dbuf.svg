<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Double buffering: no flicker</text><text x="180" y="77.6" font-size="16" fill="#3B5BDB" text-anchor="middle" font-weight="700">1. Draw</text><rect x="50" y="95" width="120" height="80" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="110.0" y="139.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">back</text><rect x="190" y="95" width="120" height="80" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="250.0" y="139.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">front</text><text x="180" y="253.3" font-size="13" fill="#343a40" text-anchor="middle">OpenGL draws the new</text><text x="180" y="269.6" font-size="13" fill="#343a40" text-anchor="middle">frame into the hidden</text><text x="180" y="285.8" font-size="13" fill="#343a40" text-anchor="middle">back buffer</text><text x="500" y="77.6" font-size="16" fill="#3B5BDB" text-anchor="middle" font-weight="700">2. Swap</text><rect x="370" y="95" width="120" height="80" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="430.0" y="139.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">back</text><rect x="510" y="95" width="120" height="80" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="570.0" y="139.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">front</text><path d="M430 180 Q500 215 566 182" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#a495057)"/><path d="M570 180 Q500 240 434 182" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#a495057)"/><text x="500" y="261.4" font-size="13" fill="#343a40" text-anchor="middle">glutSwapBuffers()</text><text x="500" y="277.7" font-size="13" fill="#343a40" text-anchor="middle">swaps back and front</text><text x="820" y="77.6" font-size="16" fill="#3B5BDB" text-anchor="middle" font-weight="700">3. Show</text><rect x="690" y="95" width="120" height="80" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="750.0" y="139.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">front</text><rect x="830" y="95" width="120" height="80" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="890.0" y="139.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">back</text><text x="820" y="261.4" font-size="13" fill="#343a40" text-anchor="middle">the finished frame</text><text x="820" y="277.7" font-size="13" fill="#343a40" text-anchor="middle">appears on screen</text><text x="500" y="339.7" font-size="13.5" fill="#C92A2A" text-anchor="middle" font-weight="700">init with GLUT_DOUBLE · call glutSwapBuffers() at the end of OnDisplay</text></svg>