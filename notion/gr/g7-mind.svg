<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="680" viewBox="0 0 1150 680"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker><marker id="aC2255C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C2255C"/></marker><marker id="aE67700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E67700"/></marker><marker id="a0C8599" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0C8599"/></marker><marker id="a6741D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6741D9"/></marker><marker id="aD9480F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9480F"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><line x1="575.0" y1="340.0" x2="575.0" y2="115.6" stroke="#3B5BDB" stroke-width="3"/><line x1="575.0" y1="340.0" x2="871.7050475966173" y2="200.0888884629002" stroke="#2B8A3E" stroke-width="3"/><line x1="575.0" y1="340.0" x2="944.9851426730021" y2="389.93369757979696" stroke="#D9480F" stroke-width="3"/><line x1="575.0" y1="340.0" x2="739.6588789951134" y2="542.1774139573029" stroke="#6741D9" stroke-width="3"/><line x1="575.0" y1="340.0" x2="410.3411210048867" y2="542.1774139573029" stroke="#0C8599" stroke-width="3"/><line x1="575.0" y1="340.0" x2="205.0148573269979" y2="389.93369757979696" stroke="#C2255C" stroke-width="3"/><line x1="575.0" y1="340.0" x2="278.29495240338264" y2="200.08888846290023" stroke="#E67700" stroke-width="3"/><rect x="455.0" y="302.0" width="240" height="76" rx="38" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="575.0" y="335.6" font-size="16" fill="#495057" text-anchor="middle" font-weight="700">Lecture 7</text><text x="575.0" y="355.6" font-size="16" fill="#495057" text-anchor="middle" font-weight="700">Midpoint Ellipse</text><rect x="460.0" y="79.6" width="230" height="72" rx="14" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="575.0" y="101.8" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">Ellipse</text><text x="575.0" y="122.0" font-size="12.5" fill="#343a40" text-anchor="middle">centre (xc , yc)</text><text x="575.0" y="141.0" font-size="12.5" fill="#343a40" text-anchor="middle">semimajor rx · semiminor ry</text><rect x="756.7050475966173" y="173.5888884629002" width="230" height="53" rx="14" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="871.7050475966173" y="195.8" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">Foci</text><text x="871.7050475966173" y="216.0" font-size="12.5" fill="#343a40" text-anchor="middle">d1 + d2 = constant</text><rect x="829.9851426730021" y="353.93369757979696" width="230" height="72" rx="14" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="944.9851426730021" y="376.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">f ellipse</text><text x="944.9851426730021" y="396.3" font-size="12.5" fill="#343a40" text-anchor="middle">ry²x² + rx²y² − rx²ry²</text><text x="944.9851426730021" y="415.3" font-size="12.5" fill="#343a40" text-anchor="middle">&lt; 0 in · 0 on · &gt; 0 out</text><rect x="624.6588789951134" y="506.17741395730286" width="230" height="72" rx="14" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="739.6588789951134" y="528.4" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">Symmetry</text><text x="739.6588789951134" y="548.6" font-size="12.5" fill="#343a40" text-anchor="middle">4-way (quadrants)</text><text x="739.6588789951134" y="567.6" font-size="12.5" fill="#343a40" text-anchor="middle">not 8-way</text><rect x="295.3411210048867" y="506.17741395730286" width="230" height="72" rx="14" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="410.3411210048867" y="528.4" font-size="15" fill="#0C8599" text-anchor="middle" font-weight="700">2 regions</text><text x="410.3411210048867" y="548.6" font-size="12.5" fill="#343a40" text-anchor="middle">Region 1: |slope| &lt; 1 · step x</text><text x="410.3411210048867" y="567.6" font-size="12.5" fill="#343a40" text-anchor="middle">Region 2: |slope| &gt; 1 · step y</text><rect x="90.01485732699791" y="363.43369757979696" width="230" height="53" rx="14" fill="#FFE8F0" stroke="#C2255C" stroke-width="2"/><text x="205.0148573269979" y="385.7" font-size="15" fill="#C2255C" text-anchor="middle" font-weight="700">Switch</text><text x="205.0148573269979" y="405.8" font-size="12.5" fill="#343a40" text-anchor="middle">when 2ry²x ≥ 2rx²y</text><rect x="163.29495240338264" y="164.08888846290023" width="230" height="72" rx="14" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="278.29495240338264" y="186.3" font-size="15" fill="#E67700" text-anchor="middle" font-weight="700">Example</text><text x="278.29495240338264" y="206.5" font-size="12.5" fill="#343a40" text-anchor="middle">rx = 8 , ry = 6</text><text x="278.29495240338264" y="225.5" font-size="12.5" fill="#343a40" text-anchor="middle">p1₀ = −332</text></svg>