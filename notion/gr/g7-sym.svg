<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Ellipse symmetry: 4 points per calculation</text><ellipse cx="400" cy="280" rx="140" ry="200" fill="#F8F9FA" stroke="#495057" stroke-width="2"/><line x1="200" y1="280" x2="600" y2="280" stroke="#adb5bd"/><line x1="400" y1="60" x2="400" y2="500" stroke="#adb5bd"/><circle cx="489.9902653561155" cy="126.79111137620438" r="8" fill="#D9480F" opacity=".9"/><text x="549.9902653561155" y="119.7" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">(x, y)</text><circle cx="310.0097346438845" cy="126.79111137620438" r="8" fill="#3B5BDB" opacity=".9"/><text x="250.00973464388449" y="119.7" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">(−x, y)</text><circle cx="310.0097346438845" cy="433.2088886237956" r="8" fill="#3B5BDB" opacity=".9"/><text x="250.00973464388449" y="450.1" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">(−x, −y)</text><circle cx="489.9902653561155" cy="433.2088886237956" r="8" fill="#3B5BDB" opacity=".9"/><text x="549.9902653561155" y="450.1" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">(x, −y)</text><text x="400" y="509.6" font-size="13" fill="#C92A2A" text-anchor="middle" font-weight="700">rx ≠ ry, so swapping x and y does NOT give a point: 4-way, not 8-way</text></svg>