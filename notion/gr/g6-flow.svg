<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a6741D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6741D9"/></marker><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Midpoint circle algorithm</text><rect x="100" y="60" width="800" height="52" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="130" y="92.3" font-size="18" fill="#3B5BDB" text-anchor="middle" font-weight="700">1</text><text x="515" y="91.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">Input r and centre (xc , yc) · first point (x0 , y0) = (0 , r)</text><line x1="500" y1="112" x2="500" y2="128" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><rect x="100" y="130" width="800" height="52" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="130" y="162.3" font-size="18" fill="#6741D9" text-anchor="middle" font-weight="700">2</text><text x="515" y="161.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">p0 = 5/4 − r   (if r is an integer: p0 = 1 − r)</text><line x1="500" y1="182" x2="500" y2="198" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><polygon points="500,202 548,250 500,298 452,250" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="500" y="254.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">pk &lt; 0 ?</text><rect x="40" y="330" width="400" height="100" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="240" y="362.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">YES</text><text x="240" y="391.1" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">next = (xk + 1 , yk)</text><text x="240" y="408.6" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">pk+1 = pk + 2xk+1 + 1</text><rect x="560" y="330" width="400" height="100" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="760" y="362.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">NO</text><text x="760" y="391.1" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">next = (xk + 1 , yk − 1)</text><text x="760" y="408.6" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">pk+1 = pk + 2xk+1 + 1 − 2yk+1</text><path d="M452 250 H240 V328" stroke="#2B8A3E" stroke-width="2.5" fill="none" marker-end="url(#a2B8A3E)"/><path d="M548 250 H760 V328" stroke="#6741D9" stroke-width="2.5" fill="none" marker-end="url(#a6741D9)"/><rect x="100" y="480" width="800" height="52" rx="12" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="500.0" y="511.2" font-size="15" fill="#0C8599" text-anchor="middle" font-weight="700">4. Find the symmetry points in the other 7 octants</text><rect x="100" y="560" width="800" height="52" rx="12" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="500.0" y="591.2" font-size="15" fill="#0C8599" text-anchor="middle" font-weight="700">5. Move each point:  x = x + xc ,  y = y + yc</text><rect x="100" y="640" width="800" height="52" rx="12" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="500.0" y="671.2" font-size="15" fill="#E67700" text-anchor="middle" font-weight="700">6. Repeat steps 3 – 5 until x ≥ y</text><path d="M240 430 V478" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#a495057)"/><path d="M760 430 V478" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#a495057)"/><line x1="500" y1="532" x2="500" y2="558" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><line x1="500" y1="612" x2="500" y2="638" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><path d="M100 666 H60 V250 H450" stroke="#495057" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a495057)"/></svg>