<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Bresenham in all 8 octants (from the slides)</text><line x1="200" y1="360" x2="800" y2="360" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 5"/><line x1="288" y1="572" x2="712" y2="148" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 5"/><line x1="500" y1="660" x2="500" y2="60" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 5"/><line x1="712" y1="572" x2="288" y2="148" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 5"/><rect x="720" y="224" width="220" height="92" rx="10" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="830" y="244.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">Octant 1</text><text x="830" y="269.6" font-size="11.5" fill="#343a40" text-anchor="middle">0 ≤ m ≤ 1</text><text x="830" y="284.0" font-size="11.5" fill="#343a40" text-anchor="middle">Ax &lt; Bx</text><text x="830" y="298.4" font-size="11.5" fill="#343a40" text-anchor="middle">normal</text><rect x="550" y="64" width="220" height="92" rx="10" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="660" y="84.5" font-size="13" fill="#6741D9" text-anchor="middle" font-weight="700">Octant 2</text><text x="660" y="109.7" font-size="11.5" fill="#343a40" text-anchor="middle">1 &lt; m &lt; ∞</text><text x="660" y="124.0" font-size="11.5" fill="#343a40" text-anchor="middle">Ay &lt; By</text><text x="660" y="138.4" font-size="11.5" fill="#343a40" text-anchor="middle">swap x , y</text><rect x="230" y="64" width="220" height="92" rx="10" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="340" y="84.5" font-size="13" fill="#6741D9" text-anchor="middle" font-weight="700">Octant 3</text><text x="340" y="109.7" font-size="11.