<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="700" viewBox="0 0 1150 700"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker><marker id="aC2255C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C2255C"/></marker><marker id="aE67700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E67700"/></marker><marker id="a0C8599" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0C8599"/></marker><marker id="a6741D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6741D9"/></marker><marker id="aD9480F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9480F"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><line x1="575.0" y1="350.0" x2="575.0" y2="119.0" stroke="#3B5BDB" stroke-width="3"/><line x1="575.0" y1="350.0" x2="871.7050475966173" y2="205.97385577063255" stroke="#2B8A3E" stroke-width="3"/><line x1="575.0" y1="350.0" x2="944.9851426730021" y2="401.4023357439086" stroke="#D9480F" stroke-width="3"/><line x1="575.0" y1="350.0" x2="739.6588789951134" y2="558.1238084854588" stroke="#6741D9" stroke-width="3"/><line x1="575.0" y1="350.0" x2="410.3411210048867" y2="558.1238084854588" stroke="#0C8599" stroke-width="3"/><line x1="575.0" y1="350.0" x2="205.0148573269979" y2="401.4023357439087" stroke="#C2255C" stroke-width="3"/><line x1="575.0" y1="350.0" x2="278.29495240338264" y2="205.97385577063258" stroke="#E67700" stroke-width="3"/><rect x="455.0" y="312.0" width="240" height="76" rx="38" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="575.0" y="345.6" font-size="16" fill="#495057" text-anchor="middle" font-weight="700">Lecture 5</text><text x="575.0" y="365.6" font-size="16" fill="#495057" text-anchor="middle" font-weight="700">Midpoint Circle (1)</text><rect x="460.0" y="83.0" width="230" height="72" rx="14" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="575.0" y="105.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">Circle</text><text x="575.0" y="125.4" font-size="12.5" fill="#343a40" text-anchor="middle">points at distance r</text><text x="575.0" y="144.4" font-size="12.5" fill="#343a40" text-anchor="middle">from centre (xc , yc)</text><rect x="756.7050475966173" y="169.97385577063255" width="230" height="72" rx="14" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="871.7050475966173" y="192.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">Simple method</text><text x="871.7050475966173" y="212.3" font-size="12.5" fill="#343a40" text-anchor="middle">y = √(r² − x²)</text><text x="871.7050475966173" y="231.3" font-size="12.5" fill="#343a40" text-anchor="middle">gaps + slow (√, ×)</text><rect x="829.9851426730021" y="365.4023357439086" width="230" height="72" rx="14" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="944.9851426730021" y="387.7" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">Parametric</text><text x="944.9851426730021" y="407.8" font-size="12.5" fill="#343a40" text-anchor="middle">x = R cos θ · y = R sin θ</text><text x="944.9851426730021" y="426.8" font-size="12.5" fill="#343a40" text-anchor="middle">no gaps · trig = expensive</text><rect x="624.6588789951134" y="522.1238084854588" width="230" height="72" rx="14" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="739.6588789951134" y="544.4" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">8-way symmetry</text><text x="739.6588789951134" y="564.5" font-size="12.5" fill="#343a40" text-anchor="middle">compute 1/8 of circle</text><text x="739.6588789951134" y="583.5" font-size="12.5" fill="#343a40" text-anchor="middle">mirror the rest</text><rect x="295.3411210048867" y="522.1238084854588" width="230" height="72" rx="14" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="410.3411210048867" y="544.4" font-size="15" fill="#0C8599" text-anchor="middle" font-weight="700">Midpoint idea</text><text x="410.3411210048867" y="564.5" font-size="12.5" fill="#343a40" text-anchor="middle">E (xk+1, yk) or SE (xk+1, yk−1)</text><text x="410.3411210048867" y="583.5" font-size="12.5" fill="#343a40" text-anchor="middle">test midpoint (xk+1, yk−½)</text><rect x="90.01485732699791" y="365.4023357439087" width="230" height="72" rx="14" fill="#FFE8F0" stroke="#C2255C" stroke-width="2"/><text x="205.0148573269979" y="387.7" font-size="15" fill="#C2255C" text-anchor="middle" font-weight="700">Decision pk</text><text x="205.0148573269979" y="407.8" font-size="12.5" fill="#343a40" text-anchor="middle">f = x² + y² − r²</text><text x="205.0148573269979" y="426.8" font-size="12.5" fill="#343a40" text-anchor="middle">&lt; 0 inside · &gt; 0 outside</text><rect x="163.29495240338264" y="169.97385577063258" width="230" height="72" rx="14" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="278.29495240338264" y="192.2" font-size="15" fill="#E67700" text-anchor="middle" font-weight="700">Incremental</text><text x="278.29495240338264" y="212.3" font-size="12.5" fill="#343a40" text-anchor="middle">p0 = 5/4 − r ≈ 1 − r</text><text x="278.29495240338264" y="231.3" font-size="12.5" fill="#343a40" text-anchor="middle">pk&lt;0: +2xk+1+1 · else −2yk+1 too</text></svg>