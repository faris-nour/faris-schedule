<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">gluOrtho2D sets the viewing rectangle</text><rect x="60" y="70" width="400" height="300" fill="white" stroke="#495057" stroke-width="2"/><rect x="160.0" y="145.0" width="200.0" height="150.0" fill="#E03131"/><line x1="60" y1="220.0" x2="460" y2="220.0" stroke="#dee2e6"/><line x1="260.0" y1="70" x2="260.0" y2="370" stroke="#dee2e6"/><text x="260.0" y="399.9" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">gluOrtho2D(−100, 100, −100, 100)</text><text x="72" y="88.8" font-size="11" fill="#868e96" text-anchor="start">−100</text><text x="448" y="88.8" font-size="11" fill="#868e96" text-anchor="end">100</text><rect x="540" y="70" width="400" height="300" fill="white" stroke="#495057" stroke-width="2"/><rect x="690.0" y="182.5" width="100.0" height="75.0" fill="#E03131"/><line x1="540" y1="220.0" x2="940" y2="220.0" stroke="#dee2e6"/><line x1="740.0" y1="70" x2="740.0" y2="370" stroke="#dee2e6"/><text x="740.0" y="399.9" font-size="14" fill="#3B5BDB" text-anchor="middle" font-weight="700">gluOrtho2D(−200, 200, −200, 200)</text><text x="552" y="88.8" font-size="11" fill="#868e96" text-anchor="start">−200</text><text x="928" y="88.8" font-size="11" fill="#868e96" text-anchor="end">200</text><text x="500" y="444.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">same 100×100 square · bigger rectangle → looks smaller · window 800×600 + square range → looks wide</text></svg>