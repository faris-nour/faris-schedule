"231.2" font-size="15" fill="#343a40" text-anchor="middle" font-weight="700">Δx, Δy, 2Δy, 2Δy − 2Δx  ·  p0 = 2Δy − Δx</text><line x1="500" y1="252" x2="500" y2="268" stroke="#495057" stroke-width="2" marker-end="url(#a495057)"/><polygon points="500,272 548,320 500,368 452,320" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="500" y="324.9" font-size="14" fill="#D9480F" text-anchor="middle" font-weight="700">pk &lt; 0 ?</text><rect x="60" y="400" width="360" height="90" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="240" y="433.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">YES → East</text><text x="240" y="461.4" font-size="13" fill="#343a40" text-anchor="middle" font-weight="700">plot (xk + 1 , yk)</text><text x="240" y="477.7" font-size="13" fill="#343a40" text-anchor="middle" font-weight="700">pk+1 = pk + 2Δy</text><rect x="580" y="400" width="360" height="90" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="760" y="433.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">NO → North East</text><text x="760" y="461.4" font-size="13" fill="#343a40" text-anchor="middle" font-weight="700">plot (xk + 1 , yk + 1)</text><text x="760" y="477.7" font-size="13" fill="#343a40" text-anchor="middle" font-weight="700">pk+1 = pk + 2Δy − 2Δx</text><path d="M452 320 H240 V398" stroke="#2B8A3E" stroke-width="2.5" fill="none" marker-end="url(#a2B8A3E)"/><path d="M548 320 H760 V398" stroke="#6741D9" stroke-width="2.5" fill="none" marker-end="url(#a6741D9)"/><rect x="300" y="540" width="400" height="50" rx="12" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="500.0" y="570.2" font-size="15" fill="#E67700" text-anchor="middle" font-weight="700">5. Repeat step 4  (Δx − 1) times</text><path d="M240 490 V565 H298" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#a495057)"/><path d="M760 490 V565 H702" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#a495057)"/