<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Midpoint test: which pixel is closer to the circle?</text><circle cx="150" cy="430" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="150" cy="280" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="150" cy="130" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="300" cy="430" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="300" cy="280" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="300" cy="130" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="450" cy="430" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="450" cy="280" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><circle cx="450" cy="130" r="10" fill="white" stroke="#adb5bd" stroke-width="2"/><path d="M110 138 Q300 145 490 320" fill="none" stroke="#D9480F" stroke-width="3"/><circle cx="150" cy="130" r="11" fill="#212529" opacity=".9"/><text x="150" y="108.5" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">(xk , yk)  plotted</text><circle cx="300" cy="130" r="11" fill="#2B8A3E" opacity=".9"/><text x="320" y="108.5" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">E (xk+1 , yk)</text><circle cx="300" cy="280" r="11" fill="#6741D9" opacity=".9"/><text x="320" y="316.6" font-size="13" fill="#6741D9" text-anchor="middle" font-weight="700">SE (xk+1 , yk−1)</text><line x1="286" y1="205.0" x2="314" y2="205.0" stroke="#C92A2A" stroke-width="3"/><text x="260" y="210.6" font-size="16" fill="#C92A2A" text-anchor="middle" font-weight="700">M</text><rect x="560" y="90" width="410" height="330" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="765" y="125.2" font-size="15" fill="#C92A2A" text-anchor="middle" font-weight="700">M = (xk + 1 , yk − ½)</text><text x="765" y="169.9" font-size="14" fill="#343a40" text-anchor="middle" font-weight="700">pk = f(xk+1 , yk−½)</text><text x="765" y="199.9" font-size="14" fill="#343a40" text-anchor="middle">f(x,y) = x² + y² − r²</text><rect x="585" y="230" width="360" height="75" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="765" y="263.4" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">pk &lt; 0 → M inside</text><text x="765" y="279.7" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">→ choose E (yk)</text><rect x="585" y="325" width="360" height="75" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="765" y="358.4" font-size="13" fill="#6741D9" text-anchor="middle" font-weight="700">pk ≥ 0 → M outside</text><text x="765" y="374.7" font-size="13" fill="#6741D9" text-anchor="middle" font-weight="700">→ choose SE (yk − 1)</text></svg>