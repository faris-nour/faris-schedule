<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Real-time vs Offline Rendering</text><rect x="40" y="70" width="430" height="150" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="255" y="106.0" font-size="17" fill="#D9480F" text-anchor="middle" font-weight="700">Real-time</text><text x="255" y="153.3" font-size="13" fill="#343a40" text-anchor="middle">Video games (interactive)</text><text x="255" y="169.6" font-size="13" fill="#343a40" text-anchor="middle">≥ 60 frames per second</text><text x="255" y="185.8" font-size="13" fill="#343a40" text-anchor="middle">Speed &gt; Quality · uses Rasterization</text><rect x="530" y="70" width="430" height="150" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="745" y="106.0" font-size="17" fill="#6741D9" text-anchor="middle" font-weight="700">Offline</text><text x="745" y="153.3" font-size="13" fill="#343a40" text-anchor="middle">Film production (non-interactive)</text><text x="745" y="169.6" font-size="13" fill="#343a40" text-anchor="middle">Frame = minutes or hours</text><text x="745" y="185.8" font-size="13" fill="#343a40" text-anchor="middle">Quality &gt; Speed</text></svg>