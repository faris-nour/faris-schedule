<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a495057" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="550.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">The Graphics Pipeline (5 stages)</text><rect x="25" y="70" width="190" height="140" rx="12" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="120" y="105.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">1. Modeling</text><text x="120" y="164.6" font-size="13" fill="#343a40" text-anchor="middle">Creating 3D models</text><line x1="215" y1="140" x2="238" y2="140" stroke="#495057" stroke-width="3" marker-end="url(#a495057)"/><rect x="240" y="70" width="190" height="140" rx="12" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="335" y="105.2" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">2. Transformation</text><text x="335" y="156.4" font-size="13" fill="#343a40" text-anchor="middle">Position objects</text><text x="335" y="172.7" font-size="13" fill="#343a40" text-anchor="middle">in 3D space</text><line x1="430" y1="140" x2="453" y2="140" stroke="#495057" stroke-width="3" marker-end="url(#a495057)"/><rect x="455" y="70" width="190" height="140" rx="12" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="550" y="105.2" font-size="15" fill="#E67700" text-anchor="middle" font-weight="700">3. Lighting</text><text x="550" y="156.4" font-size="13" fill="#343a40" text-anchor="middle">How light hits</text><text x="550" y="172.7" font-size="13" fill="#343a40" text-anchor="middle">the objects</text><line x1="645" y1="140" x2="668" y2="140" stroke="#495057" stroke-width="3" marker-end="url(#a495057)"/><rect x="670" y="70" width="190" height="140" rx="12" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="765" y="105.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">4. Rasterization</text><text x="765" y="164.6" font-size="13" fill="#343a40" text-anchor="middle">3D → 2D pixels</text><line x1="860" y1="140" x2="883" y2="140" stroke="#495057" stroke-width="3" marker-end="url(#a495057)"/><rect x="885" y="70" width="190" height="140" rx="12" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="980" y="105.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">5. Shading</text><text x="980" y="156.4" font-size="13" fill="#343a40" text-anchor="middle">Color &amp; brightness</text><text x="980" y="172.7" font-size="13" fill="#343a40" text-anchor="middle">of each pixel</text><text x="550" y="244.6" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">Scene description  →  ...  →  Final rendered image on screen</text></svg>