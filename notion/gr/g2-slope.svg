<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Slope-intercept form: y = mx + b</text><line x1="110" y1="300" x2="380" y2="300" stroke="#868e96" stroke-width="1.5" marker-end="url(#a868e96)"/><line x1="200" y1="435" x2="200" y2="120" stroke="#868e96" stroke-width="1.5" marker-end="url(#a868e96)"/><text x="110" y="319.9" font-size="11" fill="#868e96" text-anchor="middle">-2</text><text x="155" y="319.9" font-size="11" fill="#868e96" text-anchor="middle">-1</text><text x="245" y="319.9" font-size="11" fill="#868e96" text-anchor="middle">1</text><text x="290" y="319.9" font-size="11" fill="#868e96" text-anchor="middle">2</text><text x="335" y="319.9" font-size="11" fill="#868e96" text-anchor="middle">3</text><text x="380" y="319.9" font-size="11" fill="#868e96" text-anchor="middle">4</text><text x="186" y="438.9" font-size="11" fill="#868e96" text-anchor="middle">-3</text><text x="186" y="393.9" font-size="11" fill="#868e96" text-anchor="middle">-2</text><text x="186" y="348.9" font-size="11" fill="#868e96" text-anchor="middle">-1</text><text x="186" y="258.9" font-size="11" fill="#868e96" text-anchor="middle">1</text><text x="186" y="213.8" font-size="11" fill="#868e96" text-anchor="middle">2</text><text x="186" y="168.8" font-size="11" fill="#868e96" text-anchor="middle">3</text><text x="186" y="123.8" font-size="11" fill="#868e96" text-anchor="middle">4</text><line x1="191.0" y1="417.0" x2="290" y2="120" stroke="#3B5BDB" stroke-width="3"/><circle cx="200" cy="390" r="6" fill="#C2255C"/><text x="248" y="394.6" font-size="13" fill="#C2255C" text-anchor="middle" font-weight="700">(0 , −2)</text><path d="M245 255 H290 V120" stroke="#2B8A3E" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/><text x="267.5" y="275.6" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">Δx = 1</text><text x="330" y="192.1" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">Δy = 3</text><text x="720" y="139.1" font-size="26" fill="#3B5BDB" text-anchor="middle" font-weight="700">y = 3x − 2</text><text x="720" y="195.2" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">m = Δy / Δx = 3 / 1 = 3  (gradient)</text><text x="720" y="240.2" font-size="15" fill="#C2255C" text-anchor="middle" font-weight="700">b = −2  (y-intercept)</text><text x="720" y="285.9" font-size="15" fill="#343a40" text-anchor="middle">m = (y2 − y1) / (x2 − x1)</text><text x="720" y="304.6" font-size="15" fill="#343a40" text-anchor="middle">b = y1 − m·x1</text></svg>