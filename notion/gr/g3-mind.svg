<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="700" viewBox="0 0 1150 700"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a0C8599" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0C8599"/></marker><marker id="a6741D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6741D9"/></marker><marker id="a3B5BDB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B5BDB"/></marker><marker id="aD9480F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9480F"/></marker><marker id="aC2255C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C2255C"/></marker><marker id="aE67700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E67700"/></marker><marker id="aC92A2A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C92A2A"/></marker><marker id="a2B8A3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B8A3E"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><line x1="575.0" y1="350.0" x2="575.0" y2="119.0" stroke="#3B5BDB" stroke-width="3"/><line x1="575.0" y1="350.0" x2="843.3470234602948" y2="186.65833354590754" stroke="#2B8A3E" stroke-width="3"/><line x1="575.0" y1="350.0" x2="954.5" y2="350.0" stroke="#D9480F" stroke-width="3"/><line x1="575.0" y1="350.0" x2="843.3470234602948" y2="513.3416664540924" stroke="#6741D9" stroke-width="3"/><line x1="575.0" y1="350.0" x2="575.0" y2="581.0" stroke="#0C8599" stroke-width="3"/><line x1="575.0" y1="350.0" x2="306.6529765397052" y2="513.3416664540925" stroke="#C2255C" stroke-width="3"/><line x1="575.0" y1="350.0" x2="195.5" y2="350.0" stroke="#E67700" stroke-width="3"/><line x1="575.0" y1="350.0" x2="306.65297653970515" y2="186.65833354590754" stroke="#C92A2A" stroke-width="3"/><rect x="455.0" y="312.0" width="240" height="76" rx="38" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="575.0" y="345.6" font-size="16" fill="#495057" text-anchor="middle" font-weight="700">Lecture 3</text><text x="575.0" y="365.6" font-size="16" fill="#495057" text-anchor="middle" font-weight="700">DDA &amp; Bresenham (idea)</text><rect x="460.0" y="73.5" width="230" height="91" rx="14" fill="#E8EEFF" stroke="#3B5BDB" stroke-width="2"/><text x="575.0" y="95.8" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">DDA idea</text><text x="575.0" y="115.9" font-size="12.5" fill="#343a40" text-anchor="middle">Digital Differential Analyzer (1940)</text><text x="575.0" y="134.9" font-size="12.5" fill="#343a40" text-anchor="middle">Incremental method</text><text x="575.0" y="153.9" font-size="12.5" fill="#343a40" text-anchor="middle">Floating point but less</text><rect x="728.3470234602948" y="141.15833354590754" width="230" height="91" rx="14" fill="#E6F7EE" stroke="#2B8A3E" stroke-width="2"/><text x="843.3470234602948" y="163.4" font-size="15" fill="#2B8A3E" text-anchor="middle" font-weight="700">DDA steps</text><text x="843.3470234602948" y="183.5" font-size="12.5" fill="#343a40" text-anchor="middle">Δx, Δy · steps = max(Δx,Δy)</text><text x="843.3470234602948" y="202.5" font-size="12.5" fill="#343a40" text-anchor="middle">xinc = Δx/steps · yinc = Δy/steps</text><text x="843.3470234602948" y="221.5" font-size="12.5" fill="#343a40" text-anchor="middle">x += xinc · y += yinc · round</text><rect x="839.5" y="304.5" width="230" height="91" rx="14" fill="#FFF0E0" stroke="#D9480F" stroke-width="2"/><text x="954.5" y="326.8" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">Slope rules</text><text x="954.5" y="346.9" font-size="12.5" fill="#343a40" text-anchor="middle">m&lt;1: x++ , y+=m</text><text x="954.5" y="365.9" font-size="12.5" fill="#343a40" text-anchor="middle">m=1: x++ , y++</text><text x="954.5" y="384.9" font-size="12.5" fill="#343a40" text-anchor="middle">m&gt;1: x+=1/m , y++</text><rect x="728.3470234602948" y="477.34166645409243" width="230" height="72" rx="14" fill="#F1EBFF" stroke="#6741D9" stroke-width="2"/><text x="843.3470234602948" y="499.6" font-size="15" fill="#6741D9" text-anchor="middle" font-weight="700">DDA pros</text><text x="843.3470234602948" y="519.7" font-size="12.5" fill="#343a40" text-anchor="middle">Simplest · faster than y=mx+b</text><text x="843.3470234602948" y="538.7" font-size="12.5" fill="#343a40" text-anchor="middle">No multiplication</text><rect x="460.0" y="545.0" width="230" height="72" rx="14" fill="#E3F8F6" stroke="#0C8599" stroke-width="2"/><text x="575.0" y="567.2" font-size="15" fill="#0C8599" text-anchor="middle" font-weight="700">DDA cons</text><text x="575.0" y="587.4" font-size="12.5" fill="#343a40" text-anchor="middle">Floating point still slow</text><text x="575.0" y="606.4" font-size="12.5" fill="#343a40" text-anchor="middle">Orientation dependent → poor end accuracy</text><rect x="191.6529765397052" y="477.34166645409255" width="230" height="72" rx="14" fill="#FFE8F0" stroke="#C2255C" stroke-width="2"/><text x="306.6529765397052" y="499.6" font-size="15" fill="#C2255C" text-anchor="middle" font-weight="700">Bresenham</text><text x="306.6529765397052" y="519.7" font-size="12.5" fill="#343a40" text-anchor="middle">Optimum raster locations</text><text x="306.6529765397052" y="538.7" font-size="12.5" fill="#343a40" text-anchor="middle">Integer calculations only</text><rect x="80.5" y="314.0" width="230" height="72" rx="14" fill="#FFF9DB" stroke="#E67700" stroke-width="2"/><text x="195.5" y="336.2" font-size="15" fill="#E67700" text-anchor="middle" font-weight="700">Decision</text><text x="195.5" y="356.4" font-size="12.5" fill="#343a40" text-anchor="middle">dlower vs dupper</text><text x="195.5" y="375.4" font-size="12.5" fill="#343a40" text-anchor="middle">pk = Δx(dlower − dupper)</text><rect x="191.65297653970515" y="150.65833354590754" width="230" height="72" rx="14" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="306.65297653970515" y="172.9" font-size="15" fill="#C92A2A" text-anchor="middle" font-weight="700">Formulas</text><text x="306.65297653970515" y="193.0" font-size="12.5" fill="#343a40" text-anchor="middle">p0 = 2Δy − Δx</text><text x="306.65297653970515" y="212.0" font-size="12.5" fill="#343a40" text-anchor="middle">pk+1 = pk + 2Δy − 2Δx(yk+1−yk)</text></svg>