<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Bresenham: which pixel next?  (xk+1, yk) or (xk+1, yk+1)</text><circle cx="150" cy="330" r="7" fill="#ced4da"/><circle cx="150" cy="220" r="7" fill="#ced4da"/><circle cx="150" cy="110" r="7" fill="#ced4da"/><circle cx="270" cy="330" r="7" fill="#ced4da"/><circle cx="270" cy="220" r="7" fill="#ced4da"/><circle cx="270" cy="110" r="7" fill="#ced4da"/><circle cx="390" cy="330" r="7" fill="#ced4da"/><circle cx="390" cy="220" r="7" fill="#ced4da"/><circle cx="390" cy="110" r="7" fill="#ced4da"/><circle cx="510" cy="330" r="7" fill="#ced4da"/><circle cx="510" cy="220" r="7" fill="#ced4da"/><circle cx="510" cy="110" r="7" fill="#ced4da"/><circle cx="150" cy="330" r="12" fill="#3B5BDB"/><line x1="110" y1="358" x2="550" y2="140" stroke="#D9480F" stroke-width="3"/><circle cx="270" cy="278.7" r="6" fill="#D9480F"/><circle cx="270" cy="330" r="13" fill="none" stroke="#2B8A3E" stroke-width="3"/><circle cx="270" cy="220" r="13" fill="none" stroke="#6741D9" stroke-width="3"/><line x1="295" y1="330" x2="295" y2="278.7" stroke="#2B8A3E" stroke-width="3"/><line x1="310" y1="278.7" x2="310" y2="220" stroke="#6741D9" stroke-width="3"/><text x="365" y="309.3" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">dlower</text><text x="370" y="254.3" font-size="14" fill="#6741D9" text-anchor="middle" font-weight="700">dupper</text><text x="150" y="362.6" font-size="13" fill="#3B5BDB" text-anchor="middle" font-weight="700">(xk , yk)</text><text x="270" y="364.6" font-size="13" fill="#495057" text-anchor="middle">xk+1</text><text x="90" y="224.6" font-size="13" fill="#495057" text-anchor="middle">yk+1</text><text x="90" y="334.6" font-size="13" fill="#495057" text-anchor="middle">yk</text><rect x="620" y="90" width="350" height="250" rx="12" fill="#F1F3F5" stroke="#495057" stroke-width="2"/><text x="795" y="125.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">y = m(xk + 1) + b</text><text x="795" y="169.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">dlower = y − yk</text><text x="795" y="199.9" font-size="14" fill="#6741D9" text-anchor="middle" font-weight="700">dupper = (yk + 1) − y</text><text x="795" y="246.4" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">dlower &lt; dupper → pk &lt; 0</text><text x="795" y="262.7" font-size="13" fill="#2B8A3E" text-anchor="middle" font-weight="700">→ lower pixel (East)</text><text x="795" y="301.4" font-size="13" fill="#6741D9" text-anchor="middle" font-weight="700">otherwise → upper pixel</text><text x="795" y="317.7" font-size="13" fill="#6741D9" text-anchor="middle" font-weight="700">(North East)</text></svg>