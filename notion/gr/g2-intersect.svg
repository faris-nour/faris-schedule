<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style><defs><marker id="a868e96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="white" rx="16"/><text x="500.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">Intersection of two lines</text><line x1="150" y1="350" x2="402" y2="350" stroke="#868e96" stroke-width="1.5" marker-end="url(#a868e96)"/><line x1="150" y1="350" x2="150" y2="56" stroke="#868e96" stroke-width="1.5" marker-end="url(#a868e96)"/><text x="192" y="369.9" font-size="11" fill="#868e96" text-anchor="middle">1</text><text x="234" y="369.9" font-size="11" fill="#868e96" text-anchor="middle">2</text><text x="276" y="369.9" font-size="11" fill="#868e96" text-anchor="middle">3</text><text x="318" y="369.9" font-size="11" fill="#868e96" text-anchor="middle">4</text><text x="360" y="369.9" font-size="11" fill="#868e96" text-anchor="middle">5</text><text x="402" y="369.9" font-size="11" fill="#868e96" text-anchor="middle">6</text><text x="136" y="311.9" font-size="11" fill="#868e96" text-anchor="middle">1</text><text x="136" y="269.9" font-size="11" fill="#868e96" text-anchor="middle">2</text><text x="136" y="227.8" font-size="11" fill="#868e96" text-anchor="middle">3</text><text x="136" y="185.8" font-size="11" fill="#868e96" text-anchor="middle">4</text><text x="136" y="143.8" font-size="11" fill="#868e96" text-anchor="middle">5</text><text x="136" y="101.8" font-size="11" fill="#868e96" text-anchor="middle">6</text><text x="136" y="59.9" font-size="11" fill="#868e96" text-anchor="middle">7</text><line x1="150" y1="308" x2="284.4" y2="39.19999999999999" stroke="#3B5BDB" stroke-width="3"/><line x1="150" y1="56" x2="402" y2="308" stroke="#D9480F" stroke-width="3"/><circle cx="234" cy="140" r="7" fill="#2B8A3E"/><text x="284" y="134.9" font-size="14" fill="#2B8A3E" text-anchor="middle" font-weight="700">(2 , 5)</text><text x="700" y="95.2" font-size="15" fill="#3B5BDB" text-anchor="middle" font-weight="700">Line 1: y = 2x + 1   (m1 = 2, b1 = 1)</text><text x="700" y="130.2" font-size="15" fill="#D9480F" text-anchor="middle" font-weight="700">Line 2: y = −x + 7   (m2 = −1, b2 = 7)</text><text x="700" y="195.2" font-size="15" fill="#343a40" text-anchor="middle">xp = (b2 − b1) / (m1 − m2) = 6 / 3 = 2</text><text x="700" y="235.2" font-size="15" fill="#343a40" text-anchor="middle">yp = (m1·b2 − m2·b1) / (m1 − m2) = 15 / 3 = 5</text><rect x="500" y="280" width="400" height="80" rx="12" fill="#FFE3E3" stroke="#C92A2A" stroke-width="2"/><text x="700" y="316.1" font-size="14" fill="#C92A2A" text-anchor="middle" font-weight="700">Parallel: m1 = m2  →  denominator = 0</text><text x="700" y="333.6" font-size="14" fill="#C92A2A" text-anchor="middle" font-weight="700">→ no point of intersection</text></svg>