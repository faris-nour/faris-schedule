<style>
/* Layout: app shell — right sidebar nav on desktop, bottom tab bar on phone; live hero; views: today / week / quizzes / study / courses / settings */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --surface-3:#E8ECF4; --ink:#111829; --muted:#5A6480; --faint:#8C95AD; --line:#DFE3ED;
  --brand:#17214A; --brand-2:#24326C; --brand-ink:#FFFFFF; --brand-soft:#B7C1E4; --glow:#7CE3B0; --accent:#4F46E5;
  --ok:#1F9460; --ok-bg:#E1F4EA; --danger:#D6453D; --danger-bg:#FCE9E7; --warn:#B9840F; --warn-bg:#FBF1D9;
  --net:#4F46E5; --net-bg:#ECEBFD; --gr:#D9572B; --gr-bg:#FCEBE4; --se:#0E86B8; --se-bg:#E2F2FA;
  --emb:#1F9460; --emb-bg:#E1F4EA; --com:#B9840F; --com-bg:#FBF1D9;
  --shadow:0 1px 2px rgba(17,24,41,.05),0 10px 30px rgba(17,24,41,.06);
  --font-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E18; --surface:#131927; --surface-2:#192032; --surface-3:#212940; --ink:#E9EDF6; --muted:#9AA4BD; --faint:#6D7792; --line:#252E45;
  --brand:#18234D; --brand-2:#233168; --brand-soft:#AEB9DA; --accent:#9A94FF; --btn:#5850EC;
  --ok:#5AD49A; --ok-bg:#15392A; --danger:#FF7B72; --danger-bg:#3A1C1B; --warn:#F2C24F; --warn-bg:#3D3115;
  --net:#9A94FF; --net-bg:#262556; --gr:#FF8F66; --gr-bg:#45251A; --se:#5CC2EE; --se-bg:#15364A;
  --emb:#5AD49A; --emb-bg:#15392A; --com:#F2C24F; --com-bg:#3D3115; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E18; --surface:#131927; --surface-2:#192032; --surface-3:#212940; --ink:#E9EDF6; --muted:#9AA4BD; --faint:#6D7792; --line:#252E45;
  --brand:#18234D; --brand-2:#233168; --brand-soft:#AEB9DA; --accent:#9A94FF; --btn:#5850EC;
  --ok:#5AD49A; --ok-bg:#15392A; --danger:#FF7B72; --danger-bg:#3A1C1B; --warn:#F2C24F; --warn-bg:#3D3115;
  --net:#9A94FF; --net-bg:#262556; --gr:#FF8F66; --gr-bg:#45251A; --se:#5CC2EE; --se-bg:#15364A;
  --emb:#5AD49A; --emb-bg:#15392A; --com:#F2C24F; --com-bg:#3D3115; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.en{direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--se);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#splash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--brand);color:#fff;transition:opacity .6s var(--ease),visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.sp{display:grid;justify-items:center;gap:14px;text-align:center}
.sp svg{width:110px;height:110px}
.sp .stroke{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1s .1s var(--ease) forwards}
.sp .cell{opacity:0;transform-origin:center;transform-box:fill-box;animation:pop .35s var(--ease) forwards}
.sp h1{font-size:34px;opacity:0;transform:translateY(10px);animation:rise .6s .7s var(--ease) forwards}
.sp p{margin:0;color:var(--brand-soft);opacity:0;animation:rise .6s .9s var(--ease) forwards}
.sp .bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;opacity:0;animation:rise .4s 1s forwards}
.sp .bar i{display:block;height:100%;width:0;background:var(--glow);animation:load 1.1s 1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
.reveal{opacity:0;transform:translateY(14px)}
body.ready .reveal{animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i,0) * 80ms)}
body.settled .reveal{animation:none;opacity:1;transform:none}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-inline-start:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand h1{font-size:19px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:500;text-align:start;transition:background .2s,color .2s;position:relative}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand);color:#fff}
.nav .badge{margin-inline-start:auto}
.badge{font-size:11px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;display:inline-grid;place-items:center;padding-inline:6px;font-weight:600}
.side .foot{margin-top:auto;display:grid;gap:8px}
.syncline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.err{background:var(--danger)} .dot.busy{background:var(--warn)}
.main{padding:22px clamp(16px,3vw,34px) 60px;display:flex;flex-direction:column;gap:18px;min-width:0;max-width:1120px;width:100%;margin-inline:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:24px}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.tools{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2);transform:translateY(-1px)}
.pomopill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--font-display);font-size:14px;cursor:pointer}
.pomopill .dot{background:var(--danger)}
.mobilehead{display:none}
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobilehead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .topbar .tools{display:none}
  .main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--faint);padding:6px 0;border-radius:12px;position:relative}
  .tabbar button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px}
  .topbar h2{font-size:21px}
}

.hero{position:relative;overflow:hidden;background:var(--brand);color:var(--brand-ink);border-radius:26px;padding:22px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,227,176,.18),transparent);pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:auto auto -50% -10%;width:380px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,140,255,.22),transparent);pointer-events:none;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-40px,30px)}}
.hero>*{position:relative;z-index:1;min-width:0}
.now{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:var(--glow);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .lbl b{font-family:var(--font-display);font-size:20px;display:block}
.ring .lbl span{font-size:11px;color:var(--brand-soft)}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--brand-soft);display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 0 rgba(124,227,176,.6);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(124,227,176,0)}100%{box-shadow:0 0 0 0 rgba(124,227,176,0)}}
.nowtxt h2{font-size:24px;font-weight:500;margin-top:6px;line-height:1.3}
.nowtxt .meta{color:var(--brand-soft);font-size:13.5px;margin-top:4px}
.countdown{display:flex;gap:8px;margin-top:12px;direction:ltr;justify-content:flex-end}
.cd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 10px;min-width:58px;text-align:center}
.cd b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1}
.cd span{font-size:10.5px;color:var(--brand-soft)}
.hside{display:grid;gap:10px;align-content:start}
.mini{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini .k{font-size:12.5px;color:var(--brand-soft)}
.mini .v{font-family:var(--font-display);font-size:16px;font-weight:500}
.mini .v small{font-size:12px;color:var(--brand-soft);font-weight:400}
.clockbig{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;direction:ltr}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:18px}.now{flex-direction:column;align-items:flex-start}.countdown{justify-content:flex-start}.ring{width:100px;height:100px}}

.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.alert .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;flex:none;background:var(--c-bg);color:var(--c)}
.alert .t{flex:1;min-width:0}
.alert .t b{font-family:var(--font-display);font-weight:500}
.alert .t div{font-size:13px;color:var(--muted)}
.chiptime{font-family:var(--font-display);font-size:12.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2)}
.chiptime.urgent{background:var(--danger-bg);color:var(--danger)}
.chiptime.soon{background:var(--warn-bg);color:var(--warn)}
.chiptime.past{color:var(--faint)}
.chiptime.ok{background:var(--ok-bg);color:var(--ok)}
.del.on{color:var(--ok);background:var(--ok-bg)}
.qi.done .info>b{text-decoration:line-through}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0}
.view{display:grid;gap:18px;animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h3{font-size:18px;display:flex;align-items:center;gap:8px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid2.q{grid-template-columns:minmax(0,360px) minmax(0,1fr)}
@media (max-width:980px){.grid2,.grid2.q{grid-template-columns:1fr}.grid2.q #qf{order:2}}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);transition:all .2s}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--surface-2)}
.chip.c[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:var(--c-bg)}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.sw.lf{background:var(--net-bg);border:1.5px solid var(--net)}
.sw.lo{border:1.5px dashed var(--muted)}
.sw.sc{background:var(--net)}

.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.day{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:9px 4px;text-align:center;position:relative;transition:transform .2s var(--ease),background .2s}
.day:hover{transform:translateY(-2px)}
.day b{display:block;font-family:var(--font-display);font-weight:500;font-size:14px}
.day small{display:block;color:var(--muted);font-size:11.5px}
.day[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-selected="true"] small{color:inherit;opacity:.75}
.day.today::after{content:"";position:absolute;top:7px;left:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.day .qd{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.wknav{display:flex;align-items:center;gap:6px}
.wknav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:13px}
.timeline{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;align-items:stretch;animation:rise .5s var(--ease) both;opacity:0;transform:translateY(8px);animation-delay:calc(var(--i,0)*60ms)}
.when{text-align:center;padding-top:10px}
.when b{display:block;font-family:var(--font-display);font-size:17px}
.when b small{font-size:11px;font-weight:400;color:var(--muted)}
.when span{font-size:12px;color:var(--muted);white-space:nowrap}
.card{border-radius:16px;padding:13px 16px;display:grid;gap:6px;border:1.5px solid transparent;min-width:0;transition:transform .2s var(--ease),box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .cname{font-family:var(--font-display);font-weight:500;font-size:16.5px;direction:ltr;text-align:right}
.card .row{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;align-items:center}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}

const pk=(ds,i)=>{const t=planFor(ds)[i];return t?`${ds}|${t[0]}|${t[1]}`:ds+"|"+i};
const PL_MIGRATE_BEFORE=1792323942353;
function migratePl(d){let ch=false;d.pl=d.pl||{};
  for(const [k,v] of Object.entries(d.pl)){const m=k.match(/^(\d{4}-\d\d-\d\d)\|(\d+)$/);if(!m||!v||(v.u||0)>PL_MIGRATE_BEFORE)continue;
    const nk=pk(m[1],+m[2]);if(nk===k)continue;if(!d.pl[nk]){d.pl[nk]={...v};ch=true}}
  return ch}

/* ---------- sync through a private GitHub gist ---------- */
let syncState={s:"off"};
function merge(a,b){
  const out={};
  for(const k of new Set([...Object.keys(a||{}),...Object.keys(b||{})])){
    const A=(a||{})[k]||{}, B=(b||{})[k]||{}, m={};
    for(const id of new Set([...Object.keys(A),...Object.keys(B)])){const x=A[id],y=B[id];m[id]=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x)}
    out[k]=m;
  }
  return out;
}
const gh=(path,opt={})=>fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{"Authorization":"Bearer "+L.token,"Accept":"application/vnd.github+json",...(opt.body?{"Content-Type":"application/json"}:{})}});
let syncing=false, syncAgain=false;
async function sync(manual){
  if(!L.token){syncState={s:"off"};renderSync();return}
  if(!navigator.onLine){syncState={s:"err",msg:"مفيش نت، هيزامن لما النت يرجع"};renderSync();return}
  if(syncing){syncAgain=true;return}
  syncing=true; syncState={s:"busy"}; renderSync();
  try{
    // find every data gist; the oldest is the shared one, others (made by a device that synced at the same time) get merged in and removed
    const lr=await gh("/gists?per_page=100"); if(lr.status===401||lr.status===403)throw new Error("auth"); if(!lr.ok)throw new Error("net");
    const all=await lr.json();
    let found=all.filter(x=>x.files&&x.files[GIST_FILE]).sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));
    if(!found.length&&L.gistId){const t=await gh("/gists/"+L.gistId);if(t.ok){const j=await t.json();found=[{id:j.id,created_at:j.created_at}]}}
    DIAG.found=`${found.length} من ${all.length}`;
    let remote={}, main=found[0];
    for(const g of found){
      const r=await gh("/gists/"+g.id); if(!r.ok)continue;
      const f=(await r.json()).files[GIST_FILE]; if(!f)continue;
      try{const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content; remote=merge(remote,JSON.parse(txt))}catch(e){}
    }
    const merged=merge(D,remote); fixData(merged); const mj=JSON.stringify(merged);
    if(!main){
      const c=await gh("/gists",{method:"POST",body:JSON.stringify({description:"Faris schedule data (private)",public:false,files:{[GIST_FILE]:{content:mj}}})});
      if(c.status===401||c.status===403)throw new Error("auth"); if(!c.ok)throw new Error("net");
      const cj=await c.json(); L.gistId=cj.id; DIAG.main=cj.id.slice(0,7)+" (جديد)";
    } else {
      const p=await gh("/gists/"+main.id,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:mj}}})});
      if(!p.ok)throw new Error(p.status===401||p.status===403?"auth":"net");
      for(const g of found.slice(1)){try{await gh("/gists/"+g.id,{method:"DELETE"})}catch(e){}}
      L.gistId=main.id; DIAG.main=main.id.slice(0,7);
    }
    const latest=merge(D,merged), lj=JSON.stringify(latest);
    if(lj!==mj)syncAgain=true;          // something changed locally during the sync -> push it next round
    const changed=lj!==JSON.stringify(D);
    D=latest; LS.set("fs-data3",D); try{if(window.saveData)window.saveData(lj)}catch(e){}
    L.lastSync=Date.now(); saveL(); syncState={s:"ok"}; DIAG.err=""; DIAG.at=Date.now(); DIAG.counts=["q","att","st","gr","ln","pm"].map(k=>live(merged[k]).length).join("/");
    if(changed)renderAll(); if(manual)toast("اتزامن ✓");
  }catch(e){
    DIAG.err=String(e&&e.message||e);
    syncState={s:"err",msg:e.message==="auth"?"المفتاح غلط أو مالوش صلاحية Gists":"التزامن فشل، هيحاول تاني"};
    if(manual)toast(syncState.msg);
  }finally{ syncing=false; renderSync(); if(syncAgain){syncAgain=false;setTimeout(sync,500)} }
}
function syncText(){
  if(syncState.s==="off")return ["","التزامن مقفول"];
  if(syncState.s==="busy")return ["busy","بيزامن…"];
  if(syncState.s==="err")return ["err",syncState.msg];
  if(!L.lastSync)return ["busy","بيجهّز التزامن…"];
  const m=Math.round((Date.now()-L.lastSync)/6e4);
  return ["ok",m<1?"متزامن دلوقتي":`متزامن من ${m} دقيقة`];
}

    if(!t){$("#terr").textContent="الصق المفتاح الأول";return}

  on("instNow","onclick",async()=>{if(!installEv)return;installEv.prompt();try{await installEv.userChoice}catch(e){}installEv=null;renderView()});

/* ---------- OS integration ---------- */
let installEv=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;if(L.view==="settings")renderView()});
window.addEventListener("appinstalled",()=>{installEv=null;toast("البرنامج اتسطّب ✓")});
function updateBadge(){try{const n=new Date(),k=upcoming().filter(q=>dayDiff(parseD(q.date),n)<=3).length;if("setAppBadge" in navigator){k?navigator.setAppBadge(k):navigator.clearAppBadge()}}catch(e){}}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return; const tg=e.target; if(tg&&/INPUT|TEXTAREA|SELECT/.test(tg.tagName))return;
  const map={"1":"today","2":"week","3":"quiz","4":"study","5":"courses","6":"settings"};
  if(map[e.key]){go(map[e.key]);e.preventDefault();return}
  if(e.key===" "&&L.view==="study"){const P=L.pomo;pomoAct(!P?"start":P.paused?"resume":P.mode==="w"?"pause":"stop");e.preventDefault()}
});
function icsFor(q){
  const d=q.date.replace(/-/g,""); let tm=parseQTime(q.time), st, en;
  if(tm){const [h,m]=tm;const pad=x=>String(x).padStart(2,"0");st=`DTSTART;TZID=Africa/Cairo:${d}T${pad(h)}${pad(m)}00`;en=`DTEND;TZID=Africa/Cairo:${d}T${pad(Math.min(23,h+1))}${pad(m)}00`}
  else{const n=parseD(q.date);n.setDate(n.getDate()+1);st=`DTSTART;VALUE=DATE:${d}`;en=`DTEND;VALUE=DATE:${ymd(n).replace(/-/g,"")}`}
  const esc2=t=>String(t||"").replace(/[,;\\]/g,m=>"\\"+m).replace(/\n/g," ");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Faris Schedule//AR","BEGIN:VEVENT",`UID:${q.id}@faris-schedule`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,st,en,`SUMMARY:${esc2(q.type+" "+C[q.c].short)}`,`DESCRIPTION:${esc2(q.note)}`,"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:بكره عندك "+esc2(q.type),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function parseQTime(t){if(!t)return null;const m=String(t).match(/(\d{1,2}):(\d{2})\s*(ص|م)?/);if(!m)return null;let h=+m[1];const mi=+m[2];if(m[3]==="م"&&h<12)h+=12;if(m[3]==="ص"&&h===12)h=0;return [h,mi]}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- pomodoro ---------- */
const BASE_TITLE=document.title;
let wlock=null, actx=null;
async function wake(on){try{if(on&&"wakeLock" in navigator&&!wlock){wlock=await navigator.wakeLock.request("screen");wlock.addEventListener("release",()=>{wlock=null})}else if(!on&&wlock){await wlock.release();wlock=null}}catch(e){}}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function chime(work){if(L.sound===false)return;try{unlockAudio();const notes=work?[523,659,784,1047]:[784,659,523];notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.18;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.55)})}catch(e){}}
function pomoAct(a,min){
  const P=L.pomo;
  if(a==="start"){const c=studyCourse,m=min||pomoDur||L.dur||60;L.pomo={c,mode:"w",dur:m,end:Date.now()+m*6e4,paused:0};unlockAudio();wake(true)}
  else if(a==="pause"&&P){P.paused=Math.max(1,P.end-Date.now());wake(false)}
  else if(a==="resume"&&P){P.end=Date.now()+P.paused;P.paused=0;wake(true)}
  else if(a==="stop"&&P){if(P.mode==="w"){const rem=P.paused||Math.max(0,P.end-Date.now()),done=Math.round((P.dur*6e4-rem)/6e4);if(done>=1){put("pm",uid(),{c:P.c,min:done,at:Date.now()});toast(`اتسجّل ${hm(done)} في ${C[P.c].ab}`)}}L.pomo=null;focusMode=false;wake(false)}
  saveL();renderView();tickPomo();
}
function tickPomo(){
  const P=L.pomo, pills=[$("#pomoPill"),$("#pomoPillM")];
  if(!P){pills.forEach(p=>p.hidden=true);if(document.title!==BASE_TITLE)document.title=BASE_TITLE;return}
  const rem=P.paused||Math.max(0,P.end-Date.now()), txt=`${String(Math.floor(rem/6e4)).padStart(2,"0")}:${String(Math.floor(rem%6e4/1e3)).padStart(2,"0")}`;
  pills.forEach(p=>{p.hidden=false;p.innerHTML=`<i class="dot"></i><span class="num en">${txt}</span><span style="font-size:12px;color:var(--muted)">${P.mode==="w"?C[P.c].ab:"راحة"}</span>`;p.onclick=()=>go("study")});
  document.title=`${txt} · ${P.mode==="w"?C[P.c].ab:"راحة"}`;
  $$("[data-pt]").forEach(t=>t.textContent=txt); $$("[data-pf]").forEach(f=>f.style.strokeDashoffset=PC*(1-rem/(P.dur*6e4)));
  if(!P.paused&&rem<=0){
    chime(P.mode==="w");
    if(P.mode==="w"){put("pm",uid(),{c:P.c,min:P.dur,at:Date.now()});notify("خلصت جلسة مذاكرة 👏",`${P.dur} دقيقة في ${C[P.c].short}. خد ${P.dur>=50?10:5} دقايق راحة`,"pomo");const br=P.dur>=50?10:5;L.pomo={c:P.c,mode:"b",dur:br,end:Date.now()+br*6e4,paused:0}}
    else{notify("الراحة خلصت","يلا نرجع نذاكر","pomo");L.pomo=null;focusMode=false;wake(false)}
    saveL(); if(L.view==="study")renderView(); else renderFocus();
  }
}

/* ---------- notifications ---------- */
let swReg=null;
async function notify(title,body,tagId){
  toast(title+" · "+body);
  try{window.nativeFlash&&window.nativeFlash()}catch(e){}
  try{if(window.nativeNotify){await window.nativeNotify(title,body);return}}catch(e){}
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  const o={body,icon:"icon-192.png",badge:"icon-192.png",lang:"ar",dir:"rtl",tag:tagId,renotify:true};
  try{if(swReg&&swReg.showNotification){await swReg.showNotification(title,o);return}}catch(e){}
  try{new Notification(title,o)}catch(e){}
}
function checkNotify(){
  if(!L.notify)return;
  const n=new Date(), i=idxOf(n.getDay()), m=n.getHours()*60+n.getMinutes(), ds=ymd(n), F=L.fired;
  if(i>=0)E.filter(e=>e.d===i&&(e.t!=="lo"||L.notifyLo)).forEach(e=>{
    const k=`e|${ds}|${e.c}|${e.t}`, start=e.s*60;
    if(!F[k]&&m>=start-L.notifyMin&&m<start){F[k]=1;notify(`${tag(e)} · ${C[e.c].short}`,`بعد ${start-m} دقيقة · ${place(e)}`,k)}
  });
  {const tk=planFor(ds),sl=slotsFor(ds);tk.forEach(([c,t],j)=>{const k=`s|${ds}|${j}`,st=sl[j][0],dn=D.pl[pk(ds,j)]&&!D.pl[pk(ds,j)].del;
    if(!dn&&!F[k]&&m>=st-5&&m<st+10){F[k]=1;notify(`وقت المذاكرة · ${c?C[c].ab:""} ${t}`,`${rng(sl[j])} · افتح المؤقت وابدأ`,k)}})}
  upcoming().forEach(q=>{const dd=dayDiff(parseD(q.date),n),k1=`q1|${q.id}`,k0=`q0|${q.id}`;
    if(dd===1&&n.getHours()>=19&&!F[k1]){F[k1]=1;notify(`${q.type} بكرة`,`${C[q.c].short}${q.time?" · "+q.time:""}`,k1)}
    if(dd===0&&n.getHours()>=7&&!F[k0]){F[k0]=1;notify(`${q.type} النهارده`,`${C[q.c].short}${q.time?" · "+q.time:""}`,k0)}
  });
  const cut=ymd(new Date(Date.now()-3*864e5)); for(const k in F){const p=k.split("|");if((p[0]==="e"||p[0]==="s")&&p[1]<cut)delete F[k]}
  saveL();
}

  setTimeout(()=>document.body.classList.add("settled"),2600);
