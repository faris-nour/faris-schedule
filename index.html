ave it"], ["SE", "سكشن 4", "Event vs guard condition on a transition:", "event: must happen for the transition (name + arguments in parentheses) · guard: must be true, written in [square brackets] after the event"], ["SE", "سكشن 4", "Object flows link ______.", "objects to activities (activity → object it changes, object → activity that uses it)"], ["GR", "محاضرة 5", "Equation of a circle centred at (0,0):", "x² + y² = r²"], ["GR", "محاضرة 5", "Two problems of y = √(r² − x²):", "large gaps where the slope approaches vertical · inefficient square and square root operations"], ["GR", "محاضرة 5", "Parametric circle: x = ______, y = ______; problems?", "R cos θ · R sin θ · angular increment hard to set, expensive trigonometric calculations"], ["GR", "محاضرة 5", "A circle centred at (0,0) has ______ symmetry, so we compute only ______.", "eight-way · the top right eighth (one octant)"], ["GR", "محاضرة 5", "Write the 8 symmetric points of (x, y).", "(x,y) (y,x) (−x,y) (−y,x) (−x,−y) (−y,−x) (x,−y) (y,−x)"], ["GR", "محاضرة 5", "f_circ(x,y) = ______; < 0, = 0, > 0 mean?", "x² + y² − r² · inside · on the boundary · outside"], ["GR", "محاضرة 5", "The midpoint circle decision variable pk = ______.", "f_circ(xk + 1, yk − ½)"], ["GR", "محاضرة 5", "p0 for the midpoint circle = ______ (integer r: ______).", "5/4 − r · 1 − r"], ["GR", "محاضرة 5", "Midpoint circle: pk < 0 → ______; pk > 0 → ______.", "(xk+1, yk), pk+1 = pk + 2xk+1 + 1 · (xk+1, yk−1), pk+1 = pk + 2xk+1 + 1 − 2yk+1"], ["GR", "محاضرة 6", "Midpoint circle step 1: (x0, y0) = ______.", "(0, r)"], ["GR", "محاضرة 6", "Midpoint circle: repeat until ______.", "x ≥ y"], ["GR", "محاضرة 6", "Move each calculated point to the real centre by ______.", "x = x + xc , y = y + yc"], ["GR", "محاضرة 6", "Circle r = 10: p0 = ______ and the first octant points are ______.", "−9 · (0,10) (1,10) (2,10) (3,10) (4,9) (5,9) (6,8) (7,7)"], ["GR", "محاضرة 6", "Octant-2 points are obtained from octant-1 points by ______.", "swapping X and Y (mirror effect)"], ["GR", "محاضرة 6", "Key insights of the midpoint circle algorithm:", "eight-way symmetry reduces the work · unit steps along x, choosing between two possible y coordinates"], ["GR", "محاضرة 7", "Ellipse property with foci:", "d1 + d2 = constant for every point on the ellipse"], ["GR", "محاضرة 7", "f_ellipse(x,y) = ______.", "ry²x² + rx²y² − rx²ry²"], ["GR", "محاضرة 7", "An ellipse has ______ symmetry.", "four-way (quadrants)"], ["GR", "محاضرة 7", "Region 1 vs region 2 of the ellipse:", "region 1: |slope| < 1, unit steps in x · region 2: |slope| > 1, unit steps in y"], ["GR", "محاضرة 7", "Move from region 1 to region 2 when ______.", "2ry²x ≥ 2rx²y"], ["GR", "محاضرة 7", "p1₀ = ______; starting point = ______.", "ry² − rx²ry + ¼rx² · (0, ry)"], ["GR", "محاضرة 7", "Region 1: p1k < 0 → ______; else → ______.", "(xk+1, yk), p1 + 2ry²xk+1 + ry² · (xk+1, yk−1), p1 + 2ry²xk+1 − 2rx²yk+1 + ry²"], ["GR", "محاضرة 7", "p2₀ = ______ using the last point of region 1.", "ry²(x0 + ½)² + rx²(y0 − 1)² − rx²ry²"], ["GR", "محاضرة 7", "Region 2: p2k > 0 → ______; else → ______.", "(xk, yk−1), p2 − 2rx²yk+1 + rx² · (xk+1, yk−1), p2 + 2ry²xk+1 − 2rx²yk+1 + rx²"], ["GR", "محاضرة 7", "Example rx = 8, ry = 6: p1₀ = ______; region 1 ends at ______.", "−332 · (7, 3)"], ["GR", "سكشن 3", "The three OpenGL matrix stacks and their minimum depths:", "GL_PROJECTION (2) · GL_MODELVIEW (32) · GL_TEXTURE (2)"], ["GR", "سكشن 3", "glMatrixMode(mode) ______.", "selects which stack we are changing; every matrix call affects its top matrix"], ["GR", "سكشن 3", "Order of calls in SetTransformations():", "glMatrixMode(GL_PROJECTION) → glLoadIdentity() → gluOrtho2D(L,R,B,T) → glMatrixMode(GL_MODELVIEW)"], ["GR", "سكشن 3", "gluOrtho2D sets ______; a bigger range makes the shape look ______.", "the viewing rectangle · smaller"], ["GR", "سكشن 3", "Double buffering needs ______ and ______.", "GLUT_DOUBLE · glutSwapBuffers() at the end of OnDisplay"], ["GR", "سكشن 3", "glTranslatef / glRotatef / glScalef example arguments:", "glTranslatef(40, 25, 0) · glRotatef(30, 0, 0, 1) counter-clockwise · glScalef(1.5, 0.5, 1)"], ["GR", "سكشن 3", "Callbacks for letters, arrow keys and continuous redraw:", "glutKeyboardFunc(OnKeyPress) · glutSpecialFunc(OnSpecialKeyPress) · glutIdleFunc(OnDisplay)"], ["GR", "سكشن 3", "To spin the square around its own centre: ______.", "translate first, then rotate"], ["GR", "سكشن 3", "glPushMatrix() / glPopMatrix() are used to ______.", "save and restore the current matrix so a transformation affects one object only"], ["COM", "محاضرة 7", "Chromatic dispersion is ______.", "the spreading of different wavelengths of light, causing signal degradation in the fiber"], ["COM", "محاضرة 7", "SMF has ______ dispersion; DCF has ______ dispersion.", "positive chromatic · negative chromatic"], ["COM", "محاضرة 7", "In the slide, 80 km of regular fiber is compensated with ______.", "15 km of dispersion compensating fiber"], ["COM", "محاضرة 7", "The three types of optical amplifiers:", "EDFA · Raman amplifier · SOA"], ["COM", "محاضرة 7", "EDFA structure:", "fiber core doped with Er³⁺ · pump laser at 980 or 1480 nm · λ-selective coupler · isolator at the end"], ["COM", "محاضرة 7", "Why is an isolator placed at the end of an EDFA?", "to avoid reflections (else it converts into a laser)"], ["COM", "محاضرة 7", "Regenerator vs EDFA:", "regenerator: 3R (reamplify, reshape, retime), O-E-O, every 40–80 km · EDFA: 1R (reamplify), all λs at once, ~120 km"], ["COM", "محاضرة 7", "Optical amplifier vs regenerator signal processing:", "amplifier amplifies signal and noise together · regenerator removes noise, reshapes and retimes"], ["COM", "محاضرة 7", "Two wavelength conversion technologies:", "opto-electronic (OE-WC: O→E→O, regenerates, speed-limited) · coherent effects (all-optical nonlinear, ultra-fast, no regeneration)"], ["COM", "محاضرة 7", "Optical switching can be ______; current WDM networks use ______.", "circuit (wavelength-routed) or packet (OPS, OBS) · circuit switching (route + wavelength)"], ["COM", "محاضرة 7", "Extinction ratio, insertion loss, crosstalk:", "ON/OFF output power ratio · fraction of power lost · desired vs undesired output power"], ["COM", "محاضرة 8", "The four network generations:", "G1 electronic/copper · G2 optical single λ, electronic node · G3 WDM, hybrid node (deployed) · G4 all-optical (research)"], ["COM", "محاضرة 8", "Why are all-optical networks needed?", "fiber capacity increase outstrips electronic switching capacity · microprocessors dissipate increasing power"], ["COM", "محاضرة 8", "Three generations of WDM networks:", "point-to-point WDM · WADM/OADM · fiber and wavelength cross-connects"], ["COM", "محاضرة 8", "Point-to-point WDM channel counts:", "64 common · 160 maximum today · 320 in the near future"], ["COM", "محاضرة 8", "A WADM consists of ______.", "a DEMUX, a set of switches (one per wavelength), then a MUX"], ["COM", "محاضرة 8", "Three categories of optical interconnection devices:", "passive star · passive router · active switch"], ["COM", "محاضرة 8", "Passive star:", "input power on a wavelength is equally split among all outputs · same λ at the same time → collision"], ["COM", "محاضرة 8", "Passive router:", "fixed routing matrix set by DEMUX–MUX connections · WGR, AWG, WR, Latin router"], ["COM", "محاضرة 8", "Active switch:", "WRS / WSXC · reconfigurable routing matrix · can be blocking → fixed by wavelength converters"], ["NET", "سكشن 2", "UDP is a ______ transport layer protocol.", "connectionless"], ["NET", "سكشن 2", "UDP header: number of fields and size?", "4 fields · 8 bytes (source port, destination port, length, checksum — 2 bytes each)"], ["NET", "سكشن 2", "UDP Length field = ______.", "total length of the datagram (header + data)"], ["NET", "سكشن 2", "UDP checksum is ______ for IPv4 and ______ for IPv6.", "optional · mandatory"], ["NET", "سكشن 2", "UDP connectionless nature:", "no handshake · no acknowledgment · no retransmission"], ["NET", "سكشن 2", "Which application uses UDP port 53?", "DNS"], ["NET", "سكشن 2", "Steps to capture UDP in Wireshark:", "select interface → start capture → nslookup example.com → stop capture → filter: udp"], ["NET", "سكشن 2", "DNS request vs reply ports:", "request: ephemeral → 53 · reply: 53 → ephemeral (swapped)"], ["NET", "سكشن 3", "TCP is ______ and ______.", "connection-oriented · reliable (ordered, error-checked byte stream)"], ["NET", "سكشن 3", "TCP features:", "3-way handshake · retransmission · sequence numbers · ACKs · flow control (window) · congestion control · multiplexing (ports)"], ["NET", "سكشن 3", "Minimum TCP header size = ______.", "20 bytes"], ["NET", "سكشن 3", "Sequence number vs acknowledgment number:", "seq: position of first byte of data in the segment · ack: next byte expected from the other side"], ["NET", "سكشن 3", "TCP flags (6 bits):", "SYN, ACK, FIN, RST, PSH, URG"], ["NET", "سكشن 3", "Three-way handshake packets and flags:", "1. SYN (client → server) · 2. SYN, ACK (server → client) · 3. ACK (client → server)"], ["NET", "سكشن 3", "Well-known ports: HTTP, HTTPS, FTP, SSH, SMTP?", "80 · 443 · 21 control / 20 data · 22 · 25"], ["NET", "سكشن 3", "Ephemeral port range:", "49152 – 65535 (chosen temporarily by the client)"], ["NET", "سكشن 3", "Wireshark filters for HTTP, FTP, HTTPS:", "tcp.port == 80 · tcp.port == 21 · tcp.port == 443"]];

const BASE_TITLE=document.title;
let wlock=null, actx=null;
async function wake(on){try{if(on&&"wakeLock" in navigator&&!wlock){wlock=await navigator.wakeLock.request("screen");wlock.addEventListener("release",()=>{wlock=null})}else if(!on&&wlock){await wlock.release();wlock=null}}catch(e){}}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function chime(work){if(L.sound===false)return;try{unlockAudio();const notes=work?[523,659,784,1047]:[784,659,523];notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.18;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.55)})}catch(e){}}
function pomoAct(a,min){
  const P=L.pomo;
  if(a==="start"){const c=studyCourse,m=min||pomoDur||L.dur||60;L.pomo={c,mode:"w",dur:m,end:Date.now()+m*6e4,paused:0};unlockAudio();wake(true)}
  else if(a==="pause"&&P){P.paused=Math.max(1,P.end-Date.now());wake(false)}
  else if(a==="resume"&&P){P.end=Date.now()+P.paused;P.paused=0;wake(true)}
  else if(a==="stop"&&P){if(P.mode==="w"){const rem=P.paused||Math.max(0,P.end-Date.now()),done=Math.round((P.dur*6e4-rem)/6e4);if(done>=1){put("pm",uid(),{c:P.c,min:done,at:Date.now()});toast(`اتسجّل ${hm(done)} في ${C[P.c].ab}`)}}L.pomo=null;focusMode=false;wake(false)}
  saveL();renderView();tickPomo();
}
function tickPomo(){
  const P=L.pomo, pills=[$("#pomoPill"),$("#pomoPillM")];
  if(!P){pills.forEach(p=>p.hidden=true);if(document.title!==BASE_TITLE)document.title=BASE_TITLE;return}
  const rem=P.paused||Math.max(0,P.end-Date.now()), txt=`${String(Math.floor(rem/6e4)).padStart(2,"0")}:${String(Math.floor(rem%6e4/1e3)).padStart(2,"0")}`;
  pills.forEach(p=>{p.hidden=false;p.innerHTML=`<i class="dot"></i><span class="num en">${txt}</span><span style="font-size:12px;color:var(--muted)">${P.mode==="w"?C[P.c].ab:"راحة"}</span>`;p.onclick=()=>go("study")});
  document.title=`${txt} · ${P.mode==="w"?C[P.c].ab:"راحة"}`;
  $$("[data-pt]").forEach(t=>t.textContent=txt); $$("[data-pf]").forEach(f=>f.style.strokeDashoffset=PC*(1-rem/(P.dur*6e4)));
  if(!P.paused&&rem<=0){
    chime(P.mode==="w");
    if(P.mode==="w"){put("pm",uid(),{c:P.c,min:P.dur,at:Date.now()});notify("خلصت جلسة مذاكرة 👏",`${P.dur} دقيقة في ${C[P.c].short}. خد ${P.dur>=50?10:5} دقايق راحة`,"pomo");const br=P.dur>=50?10:5;L.pomo={c:P.c,mode:"b",dur:br,end:Date.now()+br*6e4,paused:0}}
    else{notify("الراحة خلصت","يلا نرجع نذاكر","pomo");L.pomo=null;focusMode=false;wake(false)}
    saveL(); if(L.view==="study")renderView(); else renderFocus();
  }
}

  const o={body,icon:"icon-192-v3.png",badge:"icon-192-v3.png",lang:"ar",dir:"rtl",tag:tagId,renotify:true};
  try{if(swReg&&swReg.showNotification){await swReg.showNotification(title,o);return}}catch(e){}

}
function mornText(n){
  const ds=ymd(n),i=idxOf(n.getDay()),tk=planFor(ds),sl=slotsFor(ds),out=[];
  const scs=i<0?[]:E.filter(e=>e.d===i&&e.t==="sc");
  if(scs.length)out.push("سكاشن: "+scs.map(e=>`${C[e.c].ab} ${fmt(e.s)}${ap(e.s)}`).join("، "));
  const left=tk.map((t,j)=>[t,j]).filter(([t,j])=>{const r=D.pl[pk(ds,j)];return !(r&&!r.del)});
  if(left.length){const [[c,t],j]=left[0];out.push(`${left.length} ${left.length===1?"مهمة":left.length<=10?"مهام":"مهمة"} مذاكرة، أولها ${h12(Math.floor(sl[j][0]/60))}:${String(sl[j][0]%60).padStart(2,"0")} ${ap(Math.floor(sl[j][0]/60))}: ${c?C[c].ab+" ":""}${t}`)}
  else out.push("مفيش مذاكرة النهارده ✌️");
  const q=upcoming().filter(q=>dayDiff(parseD(q.date),n)<=3);
  if(q.length)out.push(q.map(q=>`${q.type} ${C[q.c].ab} ${leftText(dayDiff(parseD(q.date),n))}`).join("، "));
  return out.join(" · ");
}
function checkNotify(){
  if(!L.notify)return;
  const n=new Date(), i=idxOf(n.getDay()), m=n.getHours()*60+n.getMinutes(), ds=ymd(n), F=L.fired;
  if(i>=0)E.filter(e=>e.d===i&&(e.t==="sc"||L.notifyLo)).forEach(e=>{
    const k=`e|${ds}|${e.c}|${e.t}`, start=e.s*60;
    if(!F[k]&&m>=start-L.notifyMin&&m<start){F[k]=1;notify(`${tag(e)} · ${C[e.c].short}`,`بعد ${start-m} دقيقة · ${place(e)}`,k)}
  });
  {const tk=planFor(ds),sl=slotsFor(ds);tk.forEach(([c,t],j)=>{const k=`s|${ds}|${j}`,st=sl[j][0],dn=D.pl[pk(ds,j)]&&!D.pl[pk(ds,j)].del;
    if(!dn&&!F[k]&&m>=st-5&&m<st+10){F[k]=1;notify(`وقت المذاكرة · ${c?C[c].ab:""} ${t}`,`${rng(sl[j])} · افتح المؤقت وابدأ`,k)}})}
  if(L.morn!==false){const mh=L.mornH||8,km=`m|${ds}`;
    if(!F[km]&&n.getHours()>=mh&&n.getHours()<14){F[km]=1;notify("صباح الخير يا فارس ☀️",mornText(n),km)}}
  upcoming().forEach(q=>{const dd=dayDiff(parseD(q.date),n),k1=`q1|${q.id}`,k0=`q0|${q.id}`;
    if(dd===1&&n.getHours()>=19&&!F[k1]){F[k1]=1;notify(`${q.type} بكرة`,`${C[q.c].short}${q.time?" · "+q.time:""}`,k1)}
    if(dd===0&&n.getHours()>=7&&!F[k0]){F[k0]=1;notify(`${q.type} النهارده`,`${C[q.c].short}${q.time?" · "+q.time:""}`,k0)}
  });
  const cut=ymd(new Date(Date.now()-3*864e5)); for(const k in F){const p=k.split("|");if((p[0]==="e"||p[0]==="s"||p[0]==="m")&&p[1]<cut)delete F[k]}
  saveL();
}
