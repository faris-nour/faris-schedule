<style>
/* Layout: app shell — right sidebar nav on desktop, bottom tab bar on phone; live hero; views: today / week / quizzes / study / courses / settings */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --surface-3:#E8ECF4; --ink:#111829; --muted:#5A6480; --faint:#8C95AD; --line:#DFE3ED;
  --brand:#17214A; --brand-2:#24326C; --brand-ink:#FFFFFF; --brand-soft:#B7C1E4; --glow:#7CE3B0; --accent:#4F46E5;
  --ok:#1F9460; --ok-bg:#E1F4EA; --danger:#D6453D; --danger-bg:#FCE9E7; --warn:#B9840F; --warn-bg:#FBF1D9;
  --net:#4F46E5; --net-bg:#ECEBFD; --gr:#D9572B; --gr-bg:#FCEBE4; --se:#0E86B8; --se-bg:#E2F2FA;
  --emb:#1F9460; --emb-bg:#E1F4EA; --com:#B9840F; --com-bg:#FBF1D9;
  --shadow:0 1px 2px rgba(17,24,41,.05),0 10px 30px rgba(17,24,41,.06);
  --font-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E18; --surface:#131927; --surface-2:#192032; --surface-3:#212940; --ink:#E9EDF6; --muted:#9AA4BD; --faint:#6D7792; --line:#252E45;
  --brand:#18234D; --brand-2:#233168; --brand-soft:#AEB9DA; --accent:#9A94FF; --btn:#5850EC;
  --ok:#5AD49A; --ok-bg:#15392A; --danger:#FF7B72; --danger-bg:#3A1C1B; --warn:#F2C24F; --warn-bg:#3D3115;
  --net:#9A94FF; --net-bg:#262556; --gr:#FF8F66; --gr-bg:#45251A; --se:#5CC2EE; --se-bg:#15364A;
  --emb:#5AD49A; --emb-bg:#15392A; --com:#F2C24F; --com-bg:#3D3115; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E18; --surface:#131927; --surface-2:#192032; --surface-3:#212940; --ink:#E9EDF6; --muted:#9AA4BD; --faint:#6D7792; --line:#252E45;
  --brand:#18234D; --brand-2:#233168; --brand-soft:#AEB9DA; --accent:#9A94FF; --btn:#5850EC;
  --ok:#5AD49A; --ok-bg:#15392A; --danger:#FF7B72; --danger-bg:#3A1C1B; --warn:#F2C24F; --warn-bg:#3D3115;
  --net:#9A94FF; --net-bg:#262556; --gr:#FF8F66; --gr-bg:#45251A; --se:#5CC2EE; --se-bg:#15364A;
  --emb:#5AD49A; --emb-bg:#15392A; --com:#F2C24F; --com-bg:#3D3115; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.en{direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--se);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#splash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--brand);color:#fff;transition:opacity .6s var(--ease),visibility .6s}
#splash.out{opacity:0;visibility:hidden}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
.reveal{opacity:0;transform:translateY(14px)}
body.ready .reveal{animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i,0) * 80ms)}
body.settled .reveal{animation:none;opacity:1;transform:none}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-inline-start:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand h1{font-size:19px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:500;text-align:start;transition:background .2s,color .2s;position:relative}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand);color:#fff}
.nav .badge{margin-inline-start:auto}
.badge{font-size:11px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;display:inline-grid;place-items:center;padding-inline:6px;font-weight:600}
.side .foot{margin-top:auto;display:grid;gap:8px}
.syncline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.err{background:var(--danger)} .dot.busy{background:var(--warn)}
.main{padding:22px clamp(16px,3vw,34px) 60px;display:flex;flex-direction:column;gap:18px;min-width:0;max-width:1120px;width:100%;margin-inline:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:24px}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.tools{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2);transform:translateY(-1px)}
.pomopill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-family:var(--font-display);font-size:14px;cursor:pointer}
.pomopill .dot{background:var(--danger)}
.mobilehead{display:none}
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobilehead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .topbar .tools{display:none}
  .main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--faint);padding:6px 0;border-radius:12px;position:relative}
  .tabbar button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px}
  .topbar h2{font-size:21px}
}

.hero{position:relative;overflow:hidden;background:var(--brand);color:var(--brand-ink);border-radius:26px;padding:22px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,227,176,.18),transparent);pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:auto auto -50% -10%;width:380px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,140,255,.22),transparent);pointer-events:none;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-40px,30px)}}
.hero>*{position:relative;z-index:1;min-width:0}
.now{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:var(--glow);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .lbl b{font-family:var(--font-display);font-size:20px;display:block}
.ring .lbl span{font-size:11px;color:var(--brand-soft)}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--brand-soft);display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 0 rgba(124,227,176,.6);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(124,227,176,0)}100%{box-shadow:0 0 0 0 rgba(124,227,176,0)}}
.nowtxt h2{font-size:24px;font-weight:500;margin-top:6px;line-height:1.3}
.nowtxt .meta{color:var(--brand-soft);font-size:13.5px;margin-top:4px}
.countdown{display:flex;gap:8px;margin-top:12px;direction:ltr;justify-content:flex-end}
.cd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 10px;min-width:58px;text-align:center}
.cd b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1}
.cd span{font-size:10.5px;color:var(--brand-soft)}
.hside{display:grid;gap:10px;align-content:start}
.mini{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini .k{font-size:12.5px;color:var(--brand-soft)}
.mini .v{font-family:var(--font-display);font-size:16px;font-weight:500}
.mini .v small{font-size:12px;color:var(--brand-soft);font-weight:400}
.clockbig{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;direction:ltr}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:18px}.now{flex-direction:column;align-items:flex-start}.countdown{justify-content:flex-start}.ring{width:100px;height:100px}}

.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.alert .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;flex:none;background:var(--c-bg);color:var(--c)}
.alert .t{flex:1;min-width:0}
.alert .t b{font-family:var(--font-display);font-weight:500}
.alert .t div{font-size:13px;color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.clamp.open{display:block;-webkit-line-clamp:unset}
.chiptime{font-family:var(--font-display);font-size:12.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2)}
.chiptime.urgent{background:var(--danger-bg);color:var(--danger)}
.chiptime.soon{background:var(--warn-bg);color:var(--warn)}
.chiptime.past{color:var(--faint)}
.chiptime.ok{background:var(--ok-bg);color:var(--ok)}
.del.on{color:var(--ok);background:var(--ok-bg)}
.qi.done .info>b{text-decoration:line-through}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0}
.view{display:grid;gap:18px;animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h3{font-size:18px;display:flex;align-items:center;gap:8px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid2.q{grid-template-columns:minmax(0,360px) minmax(0,1fr)}
@media (max-width:980px){.grid2,.grid2.q{grid-template-columns:1fr}.grid2.q #qf{order:2}}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);transition:all .2s}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--surface-2)}
.chip.c[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:var(--c-bg)}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.sw.lf{background:var(--net-bg);border:1.5px solid var(--net)}
.sw.lo{border:1.5px dashed var(--muted)}
.sw.sc{background:var(--net)}

.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.day{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:9px 4px;text-align:center;position:relative;transition:transform .2s var(--ease),background .2s}
.day:hover{transform:translateY(-2px)}
.day b{display:block;font-family:var(--font-display);font-weight:500;font-size:14px}
.day small{display:block;color:var(--muted);font-size:11.5px}
.day[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-selected="true"] small{color:inherit;opacity:.75}
.day.today::after{content:"";position:absolute;top:7px;left:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.day .qd{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.wknav{display:flex;align-items:center;gap:6px}
.wknav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-size:13px}
.timeline{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;align-items:stretch;animation:rise .5s var(--ease) both;opacity:0;transform:translateY(8px);animation-delay:calc(var(--i,0)*60ms)}
.when{text-align:center;padding-top:10px}
.when b{display:block;font-family:var(--font-display);font-size:17px}
.when b small{font-size:11px;font-weight:400;color:var(--muted)}
.when span{font-size:12px;color:var(--muted);white-space:nowrap}
.card{border-radius:16px;padding:13px 16px;display:grid;gap:6px;border:1.5px solid transparent;min-width:0;transition:transform .2s var(--ease),box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .cname{font-family:var(--font-display);font-weight:500;font-size:16.5px;direction:ltr;text-align:right}
.card .row{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;align-items:center}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.card.lf{background:var(--c-bg)}
.card.lf .tag{background:var(--surface);color:var(--c)}
.card.lo{background:var(--surface);border:1.5px dashed var(--c)}
.card.lo .tag{background:var(--c-bg);color:var(--c)}
.card.sc{background:var(--c);color:#fff}
.card.sc .tag{background:rgba(255,255,255,.22);color:#fff}
.card.lf .cname,.card.lo .cname{color:var(--c)}
.card.live{box-shadow:0 0 0 3px var(--glow)}
.card.done{opacity:.6}
.qflag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--danger);color:#fff}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

.gap{font-size:12.5px;color:var(--faint);padding-inline-start:92px;display:flex;align-items:center;gap:8px}

form.f{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;align-content:start}

.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,select.sel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:42px;transition:border-color .2s,box-shadow .2s}
select.sel{width:auto;min-height:36px;padding:6px 10px;border-radius:10px}
.pick{position:relative;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-height:42px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.pick svg.i{color:var(--muted);width:18px;height:18px}
.pick .ph{color:var(--faint)}
.pick .ph.set{color:var(--ink);font-weight:500}
.pick:focus-within{border-color:var(--se);box-shadow:0 0 0 3px color-mix(in srgb,var(--se) 20%,transparent)}
.field .pick input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
.field textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px;direction:ltr}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--se);box-shadow:0 0 0 3px color-mix(in srgb,var(--se) 20%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types label{cursor:pointer}
.types input{position:absolute;opacity:0;pointer-events:none}
.types span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);transition:all .2s}
.types input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--btn,var(--brand));color:#fff;transition:transform .15s var(--ease),filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg.i{width:17px;height:17px}
.err{color:var(--danger);font-size:12.5px;min-height:1em}

.list{display:grid;gap:10px;align-content:start}
.lgroup{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-top:6px}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);animation:rise .4s var(--ease) both;opacity:0;transform:translateY(6px)}
.qi .date{width:56px;border-radius:12px;background:var(--c-bg);color:var(--c);text-align:center;padding:6px 0;line-height:1.15}
.qi .date b{display:block;font-family:var(--font-display);font-size:20px}
.qi .date span{font-size:11px}
.qi .info b{font-family:var(--font-display);font-weight:500}
.qi .info .cn{direction:ltr;text-align:right;color:var(--c);font-size:13.5px;font-weight:600}
.qi .info .meta{font-size:12.5px;color:var(--muted)}
.qi .act{display:flex;align-items:center;gap:6px}
.qi.past{opacity:.6}
.del{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--faint);transition:all .2s;flex:none}
.del:hover{background:var(--danger-bg);color:var(--danger)}
.del svg{width:16px;height:16px}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px}
.confirm button{border:0;border-radius:8px;padding:4px 10px;font-size:12.5px}
.confirm .yes{background:var(--danger);color:#fff}
.confirm .no{background:var(--surface-2)}
details.box summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}

.finals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.final{border-radius:18px;padding:14px 16px;background:var(--c-bg);color:var(--c);display:grid;gap:4px}
.final .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.final .cn{direction:ltr;text-align:right;font-weight:600}

.progress{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--c,var(--accent));border-radius:8px;transition:width .6s var(--ease)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.lec{border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;background:var(--surface);transition:border-color .2s,background .2s}
.lec.full{border-color:var(--c);background:var(--c-bg)}
.lec b{font-family:var(--font-display);font-weight:500;font-size:14px}
.lec label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer}
.lec input{accent-color:var(--c);width:16px;height:16px}
.coursebar{display:grid;gap:10px}
.cb{display:grid;grid-template-columns:160px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:13px}
.cb .n{direction:ltr;text-align:right;font-weight:600;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pomo{display:grid;justify-items:center;gap:14px;text-align:center}
.pring{width:220px;height:220px;position:relative}
.pring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:10}
.pring .bg{stroke:var(--surface-3)}
.pring .fg{stroke:var(--c,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.pring .lbl{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.pring .lbl b{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1;direction:ltr}
.pring .lbl span{color:var(--muted);font-size:13px;margin-top:6px}

.chead{border-radius:22px;padding:18px;background:var(--c-bg);color:var(--c);display:grid;gap:10px}
.chead h3{direction:ltr;text-align:right;font-size:20px}
.chead .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.stat.bad span{color:var(--danger)}
.kv{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.kv li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px;flex-wrap:wrap}
.kv li:last-child{border-bottom:0}
.kv li b{font-weight:500}
.linkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;min-width:0}
.linkrow a{color:var(--c);font-weight:600;text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow a:hover{text-decoration:underline}

#wg{display:none}
/* desktop-wallpaper mode (Lively Wallpaper): the widget sits in a corner of the desktop */
body.desk{background:var(--deskbg,radial-gradient(1200px 800px at 85% 10%,#2b3a8a 0%,#141a3a 55%,#0b0f22 100%))!important;min-height:100vh;overflow:hidden}
body.desk #wg{position:fixed;top:56px;right:40px;width:380px;max-height:calc(100vh - 120px);min-height:0!important;overflow:auto;padding:14px;border-radius:22px;background:rgba(255,255,255,.80);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.35)}

body.wmode .shell,body.wmode .tabbar{display:none!important}
body.wmode #wg{display:flex;flex-direction:column;gap:10px;padding:12px;min-height:100vh;box-sizing:border-box}
.wg-h{display:flex;align-items:center;gap:8px}.wg-h b{font-family:'Readex Pro',sans-serif;font-size:15px;flex:1}

.wg-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

.wg-next b{display:block;font-size:14px}.wg-next small{color:var(--muted);font-size:12px}
.wg-t{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.wg-t:first-of-type{border-top:0}.wg-t input{margin-top:3px;accent-color:var(--c,var(--btn))}
.wg-t .tm{color:var(--faint);font-size:11.5px;white-space:nowrap}.wg-t.on .tx{text-decoration:line-through;color:var(--faint)}
.wg-t .tx{flex:1;min-width:0}.wg-t .cn{color:var(--c);font-weight:600;margin-inline-end:4px}
.wg-bar{height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden}.wg-bar i{display:block;height:100%;background:var(--btn);border-radius:9px}
.wg-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}.wg-row span:last-child{color:var(--muted)}
.wg-hot{color:#DC2626;font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .t b{font-family:var(--font-display);font-weight:500}
.setrow .t div{font-size:12.5px;color:var(--muted)}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.steps b{color:var(--ink)}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:all .35s var(--ease);z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (max-width:560px){
  .days{grid-template-columns:repeat(3,minmax(0,1fr))}

  .qi{grid-template-columns:auto minmax(0,1fr)}

  .row2,.row3{grid-template-columns:1fr}
  .pring{width:190px;height:190px}

}

.lg{--o:cubic-bezier(.34,1.56,.64,1);--e2:cubic-bezier(.2,.8,.2,1);display:grid;justify-items:center;text-align:center}
.lg-av{position:relative;width:246px;height:238px;margin-bottom:18px}
.lg-fl{position:absolute;inset:0;animation:lg-float 4.5s 2.40s ease-in-out infinite}
.lg-p{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lg-fx{position:absolute;left:50%;top:50%;width:0;height:0}
.lg-fx svg{position:absolute;left:-180px;top:-180px;width:360px;height:360px;overflow:visible}
.lg-new{opacity:0;transform-origin:300px 290px;transform:scale(.55) rotate(-8deg);animation:lg-newin .7s .25s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes lg-newin{to{opacity:1;transform:none}}
.lg-bg{fill:#fff;transform-origin:300px 290px;transform:scale(0);animation:lg-pop 0.40s 0.04s var(--o) forwards}
.lg-gray{opacity:0;animation:lg-fade 0.48s 0.60s ease-out forwards,lg-out .3s 1.92s forwards}
.lg-line{animation:lg-out .3s 1.92s forwards}
.lg-full{opacity:0;animation:lg-fade .4s 1.56s forwards}
#lgdraw path{fill:none;stroke:#fff;stroke-width:96;stroke-dasharray:1;stroke-dashoffset:1;animation:lg-dash 0.72s 0.20s cubic-bezier(.45,.05,.55,.95) forwards}
#lgpaint path{fill:none;stroke:#fff;stroke-width:190;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:lg-dash 0.40s var(--e2) forwards}
.lg-ring{fill:none;stroke:url(#lgrg);stroke-width:12;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:lg-ringd 0.80s 1.20s var(--e2) forwards}
.lg-ringg{transform-origin:300px 290px;animation:lg-spin 9s 2.00s linear infinite}
.lg-shine{transform:translateX(-300px) skewX(-20deg);animation:lg-shine 0.80s 1.84s ease-in-out forwards}
.lg-hair{transform-origin:300px 205px;animation:lg-hair 2.8s 1.92s ease-in-out infinite}
.lg-eyeR,.lg-eyeL{opacity:0;animation:lg-blink 12s 2.78s infinite}
.lg-spl{opacity:0;transform:translate(0,0) scale(0);animation:lg-burst 0.56s var(--o) forwards,lg-tw 3.2s ease-in-out infinite}
.lg-wave{transform-origin:300px 290px;fill:none;stroke:#fff;stroke-width:5;opacity:0;animation:lg-wave 0.72s 1.52s ease-out forwards}
.lg-ttl{width:230px;margin:0 0 6px;overflow:visible;position:relative}
.lg-ttl path{fill:#fff;fill-opacity:0;stroke:#fff;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:lg-dash 0.44s var(--t) cubic-bezier(.5,0,.3,1) forwards,lg-ink 0.40s calc(var(--t) + 0.28s) ease-out forwards}
.lg-sub{margin:0;font-family:'Readex Pro',sans-serif;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;font-size:12px;color:#AFC0FF;opacity:0;transform:translateY(10px);animation:lg-rise .6s 2.70s var(--e2) forwards}
.lg-bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:18px;overflow:hidden;opacity:0;animation:lg-fade .3s 2.78s forwards}
.lg-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF7A1A,#E8323C,#8E3BD9,#2AA8F0);animation:lg-load 0.72s 2.82s var(--e2) forwards}
@keyframes lg-pop{to{transform:scale(1)}}
@keyframes lg-fade{to{opacity:1}}
@keyframes lg-dash{to{stroke-dashoffset:0}}
@keyframes lg-ringd{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes lg-spin{to{transform:rotate(1turn)}}
@keyframes lg-shine{to{transform:translateX(700px) skewX(-20deg)}}
@keyframes lg-hair{0%,100%{transform:rotate(0) skewX(0)}30%{transform:rotate(-1.4deg) skewX(1.6deg)}65%{transform:rotate(1.1deg) skewX(-1.3deg)}}
@keyframes lg-blink{0%,2%{opacity:0}2.1%,3.1%{opacity:1}3.2%,40%{opacity:0}40.1%,41.1%{opacity:1}41.2%,75%{opacity:0}75.1%,76.1%{opacity:1}76.2%,100%{opacity:0}}
@keyframes lg-out{to{opacity:0}}
@keyframes lg-burst{0%{opacity:0;transform:translate(0,0) scale(0)}30%{opacity:1}100%{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}}
@keyframes lg-tw{50%{transform:translate(var(--x),var(--y)) scale(.75) rotate(25deg);opacity:.55}}
@keyframes lg-wave{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
@keyframes lg-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lg-rise{to{opacity:1;transform:none}}
@keyframes lg-load{to{width:100%}}
@keyframes lg-ink{to{fill-opacity:1;stroke-width:4}}
@media (prefers-reduced-motion:reduce){.lg *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

  const isDone=(ds,c,t)=>{const r=D.pl[`${ds}|${c}|${t}`];return r&&!r.del};
  const left=missedTasks().filter(x=>x.c===q.c).map(x=>x.t);let allNeed=missedTasks().reduce((a,x)=>a+taskMin(x.t),0),free=0;
  for(let ds=today;ds<=end;){planFor(ds).forEach(([c,t])=>{if(isDone(ds,c,t))return;allNeed+=taskMin(t);if(c===q.c)left.push(t)});
    const busy=busyFor(ds);let st=Math.max((L.sStart||10)*60,homeFrom(ds),ds===today?nowM:0),fr=Math.max(0,25*60-st);busy.forEach(([a,z])=>{fr-=Math.max(0,Math.min(z,25*60)-Math.max(a,st))});free+=Math.max(0,fr);

const QB=[["COM", "محاضرة 1", "Any communication system consists of three basic blocks. Name them.", "Transmitter · Receiver · Communication Channel"], ["COM", "محاضرة 1", "A ______ prepares the data (information) to be transmitted in the appropriate format in order to be transmitted over the communication channel.", "Transmitter"], ["COM", "محاضرة 1", "For digital systems, the Analog-to-Digital Converter (ADC) performs three critical steps. List them in order.", "a) Sampling  b) Quantization  c) Encoding (e.g., Pulse Code Modulation – PCM)"], ["COM", "محاضرة 1", "Sampling converts the continuous-time signal to ______.", "a discrete-time signal"], ["COM", "محاضرة 1", "Quantization converts the continuous-amplitude samples into ______.", "a finite set of discrete amplitude levels"], ["COM", "محاضرة 1", "Encoding maps the quantized levels to ______, producing the raw bit stream.", "binary codes (e.g., PCM)"], ["COM", "محاضرة 1", "The ______ encoder maps the signal into a digital form so as to remove redundancy (using as few bits as possible).", "Source encoder (Compression) — e.g., MP3"], ["COM", "محاضرة 1", "When transmitting binary data, the ______ encoder could add extra bits (redundancy) that help detect and correct errors.", "Channel encoder"], ["COM", "محاضرة 1", "Most modulation schemes impress the information on either the ______, ______ or ______ of a sinusoid.", "amplitude, phase or frequency"], ["COM", "محاضرة 1", "Twisting reduces electromagnetic interference (EMI) and crosstalk. Which guided channel?", "Twisted Pair Cable"], ["COM", "محاضرة 1", "Which guided channel uses total internal reflection to guide light signals inside a glass/plastic core?", "Optical Fiber"], ["COM", "محاضرة 1", "Hollow metallic or dielectric structures that guide high-frequency signals (microwave, millimeter-wave) are called ______.", "Waveguides (used in radar, satellite communication, and microwave links)"], ["COM", "محاضرة 1", "Undersea communication requires optical fiber cables. This is because of: (a) the nature of the application (b) the nature of the communication channel (c) cost", "(b) The nature of the communication channel"], ["COM", "محاضرة 1", "______: intentional interference that aims at destroying the quality of the transmitted signal to prevent transmission.", "Jamming"], ["COM", "محاضرة 1", "Interference is due to ______.", "superposition of two or more signals (may result from bad design of communication systems)"], ["COM", "محاضرة 1", "True or False: Noise is usually under our control.", "False — Noise is usually not under our control (your system has to deal with it)."], ["COM", "محاضرة 1", "Speaking in a microphone: what is the data and what is the signal?", "Data is what I say; signal is what moves inside the wire of the microphone (electricity)."], ["COM", "محاضرة 1", "Voice over IP (VoIP) is an example of: (a) Analog Data, Analog Signal (b) Analog Data, Digital Signal (c) Digital Data, Analog Signal (d) Digital Data, Digital Signal", "(b) Analog Data, Digital Signal"], ["COM", "محاضرة 1", "Modems and optical networks are examples of ______ data, ______ signal.", "Digital Data, Analog Signal"], ["COM", "محاضرة 1", "Ethernet and Wi-Fi are examples of ______ data, ______ signal.", "Digital Data, Digital Signal"], ["COM", "محاضرة 1", "Order by bandwidth (lowest → highest): Optical Fiber · Twisted Pair · Coaxial Cable", "Twisted Pair (few–hundreds MHz) < Coaxial (up to several GHz) < Optical Fiber (terabits/s)"], ["COM", "محاضرة 2", "A ______ signal is one in which the signal intensity varies in a smooth fashion over time.", "Continuous signal"], ["COM", "محاضرة 2", "A ______ signal is one in which the signal intensity maintains a constant level for some period of time and then changes to another constant level.", "Discrete signal"], ["COM", "محاضرة 2", "The ______ wave is used in digital systems to represent binary data (0s and 1s).", "Square wave"], ["COM", "محاضرة 2", "Amplitude (A) is ______.", "the peak value (height) of the wave — the maximum displacement of the wave from its central position"], ["COM", "محاضرة 2", "Phase (φ) refers to the ______ of the wave.", "horizontal shift"], ["COM", "محاضرة 2", "The period is the inverse of frequency. If T = 4 ms, then f = ?", "f = 1/T = 1/0.004 = 250 Hz"], ["COM", "محاضرة 2", "The spectrum of a signal is ______.", "the range of frequencies that it contains"], ["COM", "محاضرة 2", "If a signal includes a component of zero frequency, that component is a ______.", "direct current (dc) or constant component"], ["COM", "محاضرة 2", "Bandwidth is ______.", "the difference between the upper and lower frequencies in a continuous band of frequencies (measured in Hz)"], ["COM", "محاضرة 2", "A signal contains frequencies 5, 15 and 25 kHz. What is its bandwidth?", "25 − 5 = 20 kHz"], ["COM", "محاضرة 2", "In traditional telephone systems, the bandwidth is typically limited to ______, i.e. a ______ bandwidth.", "300 Hz to 3400 Hz · 3.1 kHz"], ["COM", "محاضرة 2", "AM radio stations use bandwidths around ______ per channel, while FM radio uses around ______.", "AM ≈ 10 kHz · FM ≈ 200 kHz"], ["COM", "محاضرة 2", "Analog TV signals use bandwidths around ______.", "6 MHz"], ["COM", "محاضرة 2", "Wi-Fi operates in the ______ or ______ frequency bands, with bandwidths typically from ______ to ______.", "2.4 GHz or 5 GHz · 20 MHz to 160 MHz"], ["COM", "محاضرة 3", "Main components of an optical transmission system are:", "Optical fiber links · Transmitters · Receivers · Amplifiers · Network medium"], ["COM", "محاضرة 3", "Light propagates in optical fiber by ______.", "total internal reflection"], ["COM", "محاضرة 3", "Why are fiber optic cables immune to electromagnetic interference (EMI)?", "Because they transmit light instead of electrical signals."], ["COM", "محاضرة 3", "Compare SMF and MMF core size.", "SMF: small (8–10 microns) · MMF: larger (50–62.5 microns)"], ["COM", "محاضرة 3", "MMF is used for short distances up to ______; SMF for long distances up to ______.", "MMF up to 550 meters · SMF up to 40 km or more"], ["COM", "محاضرة 3", "Attenuation (dB) = ______", "α × L  (α = attenuation coefficient in dB/km, L = fiber length in km)"], ["COM", "محاضرة 3", "α = 0.25 dB/km and the maximum allowed attenuation is 12 dB. What is the maximum fiber length?", "L = 12 ÷ 0.25 = 48 km"], ["COM", "محاضرة 3", "Dispersion is ______.", "the widening of a pulse duration as it travels through a fiber"], ["COM", "محاضرة 3", "As a pulse widens, it can interfere with neighboring pulses (bits) on the fiber, leading to ______.", "ISI (Inter-Symbol Interference)"], ["COM", "محاضرة 3", "Modal Dispersion occurs in ______ fibers. It is mitigated by ______.", "multimode fibers · single-mode fibers or graded-index fibers"], ["COM", "محاضرة 3", "Chromatic Dispersion affects: (a) SMF only (b) MMF only (c) both single-mode and multimode fibers", "(c) both — different wavelengths travel at different speeds"], ["COM", "محاضرة 3", "Polarization Mode Dispersion (PMD) occurs in ______ fibers when ______.", "single-mode fibers · different polarization states travel at different speeds due to fiber imperfections"], ["COM", "محاضرة 3", "Four-Wave Mixing (FWM) — cause and effect?", "Cause: multiple wavelengths interact → new wavelengths are generated. Effect: crosstalk and signal degradation."], ["COM", "محاضرة 3", "A ______ (1×N coupler) takes an input signal from one fiber and splits it into N output fibers.", "Splitter"], ["COM", "محاضرة 3", "For a 1×2 coupler, P1 = 6 mW and P2 = 2 mW. Coupling ratio of port 1 = ?", "P1/(P1+P2) = 6/8 = 0.75 (75%)"], ["COM", "محاضرة 3", "How many 2×1 couplers are needed to design a 1×16 splitter?", "15 couplers (in 4 stages)"], ["COM", "محاضرة 3", "Why are passive star couplers called passive?", "Because they do not require external power to operate."], ["COM", "محاضرة 3", "In the PSC, Pout = ______. For a 16×16 PSC with Pin = 4 mW, Pout = ?", "Pout = Pin / N → 4 / 16 = 0.25 mW"], ["COM", "محاضرة 4", "LASER is an acronym for ______.", "Light Amplification by Stimulated Emission of Radiation"], ["COM", "محاضرة 4", "Stable atoms are in the ______ state.", "ground state (electrons in the lowest possible energy levels)"], ["COM", "محاضرة 4", "Population inversion is ______.", "a state where there are more electrons in the excited state than in the ground state"], ["COM", "محاضرة 4", "Population inversion allows the substance to ______.", "emit more light than it absorbs"], ["COM", "محاضرة 4", "Stimulated emission occurs when ______.", "a photon passes very closely to an excited electron (a coherent photon is released)"], ["COM", "محاضرة 4", "The ______ of the cavity controls the frequency of the emitted light.", "length"], ["COM", "محاضرة 4", "Physical characteristics of lasers that may affect system performance are:", "laser linewidth · frequency instability · the number of longitudinal modes"], ["COM", "محاضرة 4", "Laser linewidth is ______.", "the spectral width of the light generated by the laser"], ["COM", "محاضرة 4", "Frequency instabilities — important types?", "mode hopping · mode shifts"], ["COM", "محاضرة 4", "The number of longitudinal modes is ______.", "the number of wavelengths that a laser can amplify"], ["COM", "محاضرة 4", "Mechanically-Tuned lasers: tuning range and tuning time?", "Wide tuning range · Slow tuning time (order of ms)"], ["COM", "محاضرة 4", "Acousto-optic and Electro-optic tuned lasers: tuning range and time?", "Moderate tuning range · Moderate tuning time (order of tens of ns)"], ["COM", "محاضرة 4", "Injection-Current-Tuned lasers — main drawback?", "mode hopping"], ["COM", "محاضرة 4", "A laser array — advantage and possible drawback?", "Advantage: multiple transmissions simultaneously · Drawback: the number of wavelengths is fixed"], ["COM", "محاضرة 5", "List the common digital modulation techniques in optical fiber.", "ASK/IM · PSK · QAM · FSK"], ["COM", "محاضرة 5", "In Intensity Modulation (IM): Binary 1 = ______, Binary 0 = ______.", "High intensity (light \"on\") · Low intensity (light \"off\")"], ["COM", "محاضرة 5", "BPSK encodes data using ______ phases; QPSK uses ______ phases, allowing ______ bits per symbol.", "BPSK: two (0°, 180°) · QPSK: four (0°, 90°, 180°, 270°) · 2 bits"], ["COM", "محاضرة 5", "16-QAM transmits ___ bits per symbol; 64-QAM transmits ___ bits per symbol.", "16-QAM: 4 bits · 64-QAM: 6 bits"], ["COM", "محاضرة 5", "You need 5 bits per symbol. Which QAM?", "32-QAM (2⁵ = 32)"], ["COM", "محاضرة 5", "A system runs at 10 Gsymbol/s using 64-QAM. Bit rate = ?", "10 × 6 = 60 Gbps"], ["COM", "محاضرة 5", "Why is FSK rarely used in optical fiber?", "due to its lower spectral efficiency (MSK is a variation used in some systems)"], ["COM", "محاضرة 5", "Two types of optical receivers:", "1. Direct detection  2. Coherent detection"], ["COM", "محاضرة 5", "Which receiver combines the optical signal with a local oscillator (a reference laser) using a hybrid?", "Coherent Detection Receiver"], ["COM", "محاضرة 5", "Direct detection receiver is used in ______.", "low- and medium-speed systems like FTTH, data centers, and short-range communication"], ["COM", "محاضرة 5", "Fiber Bragg Grating (FBG) is ______.", "a periodic variation in the refractive index of the fiber core, which reflects specific wavelengths and transmits others"], ["COM", "محاضرة 5", "In a Mach-Zehnder interferometer, wavelengths for which the phase difference is ______ are filtered out.", "180°"], ["COM", "محاضرة 5", "MZI tunability is done by ______.", "varying temperature (~ few ms) [slow and complex]"], ["COM", "محاضرة 5", "Key characteristics of optical filters:", "Center Wavelength · Bandwidth · Rejection Band · Insertion Loss · Out-of-Band Rejection"], ["COM", "محاضرة 6", "The transponder is typically placed between ______ and ______.", "the terminal side equipment (e.g., routers or switches) and the DWDM system"], ["COM", "محاضرة 6", "Primary functions of the transponder:", "Signal Conversion · Regeneration · Wavelength Assignment"], ["COM", "محاضرة 6", "850 nm is used in ______; 1310 nm is common for ______ (up to ___ km).", "850: multimode fiber, short distance · 1310: single-mode fiber, medium distances (up to 10 km)"], ["COM", "محاضرة 6", "1550 nm on the terminal side is used for ______.", "single-mode fiber, longer-distance connections (10–40 km)"], ["COM", "محاضرة 6", "DWDM systems operate in the C-band (______) and sometimes in the L-band (______).", "C-band: 1530–1565 nm · L-band: 1565–1625 nm"], ["COM", "محاضرة 6", "A(n) ______ allows light to pass in one direction but not in the opposite direction.", "Isolator — used in the front and end of amplifiers and laser diode modules"], ["COM", "محاضرة 6", "Circulator: light entering at any particular port exits at ______.", "the next port"], ["COM", "محاضرة 6", "______ combines multiple optical signals (each with a different wavelength) into a single beam.", "Multiplexer (Mux)"], ["COM", "محاضرة 6", "OADM ______ specific wavelengths from the DWDM signal while allowing other wavelengths to pass through.", "adds or removes"], ["COM", "محاضرة 6", "The optical attenuator is used to ______.", "control the power level of the optical signal, to prevent overloading of components (amplifiers or receivers)"], ["COM", "محاضرة 6", "Fixed vs Variable Optical Attenuator (VOA)?", "Fixed: predetermined amount of attenuation · VOA: adjustable attenuation levels"], ["COM", "محاضرة 6", "The signal arrives at −3 dBm and the receiver maximum input is −8 dBm. What attenuator is needed?", "−3 − (−8) = 5 dB"], ["COM", "سكشن 1", "A 250 MB file is sent over a 1 Gbps link. Transmission time = ?", "250 × 8 = 2000 Mbit ÷ 1000 Mbps = 2 s"], ["COM", "سكشن 1", "Bandwidth = 5 GHz and spectral efficiency = 2 bit/s/Hz. Maximum bit rate = ?", "5 × 2 = 10 Gbps"], ["COM", "سكشن 1", "Which wavelength has the lowest attenuation in silica fiber?", "1550 nm"], ["COM", "سكشن 1", "Frequency at λ = 1550 nm (f = c / λ) ≈ ?", "3×10⁸ ÷ 1550×10⁻⁹ ≈ 193.5 THz"], ["COM", "سكشن 1", "Fiber loss 0.3 dB/km, length 20 km. Total loss = ?", "0.3 × 20 = 6 dB"], ["COM", "سكشن 1", "A loss of 3 dB means the power becomes ______.", "half"], ["COM", "سكشن 1", "D = 4 ps/(nm·km), L = 50 km, Δλ = 0.5 nm. Dispersion Δt = ?", "Δt = D × L × Δλ = 4 × 50 × 0.5 = 100 ps"], ["COM", "سكشن 1", "n₁ = 1.5, n₂ = 1.48. Numerical Aperture NA = ?", "NA = √(n₁² − n₂²) ≈ 0.24"], ["COM", "سكشن 1", "Signal = 20 mW, Noise = 0.2 mW. SNR in dB = ?", "10 log(100) = 20 dB"], ["COM", "سكشن 1", "50 errors in 5 × 10⁶ bits. BER = ?", "50 ÷ 5×10⁶ = 10⁻⁵"], ["COM", "سكشن 1", "0 dBm = ______ mW", "1 mW"], ["COM", "سكشن 1", "The APD is used in the ______ (Transmitter / Receiver).", "Receiver"], ["COM", "سكشن 1", "Compare DWDM to CWDM.", "DWDM: narrower channel spacing, more channels, more expensive"], ["COM", "سكشن 1", "Which is stronger: −20 dBm or −10 dBm?", "−10 dBm"], ["COM", "سكشن 1", "Link 60 km, 0.25 dB/km, Tx = +2 dBm, receiver sensitivity = −18 dBm. Does it work?", "Loss = 15 dB → Rx = 2 − 15 = −13 dBm > −18 dBm → Yes (margin 5 dB)"], ["COM", "سكشن 2", "Fiber (−4 dB) → amplifier (+10 dB) → splitter (−3 dB). Total gain = ?", "−4 + 10 − 3 = +3 dB (power doubled)"], ["COM", "سكشن 2", "For s(t) = 7 sin(100πt − π/4), find A, f and φ.", "A = 7 · f = 100π/2π = 50 Hz · φ = −π/4"], ["COM", "سكشن 2", "A signal has frequencies 200, 400 and 1000 Hz. Bandwidth? Analog or digital?", "1000 − 200 = 800 Hz · Analog"], ["COM", "سكشن 2", "−23 dB means ______ % of the power arrives.", "10^(−2.3) ≈ 0.5%"], ["COM", "سكشن 2", "True or False: The spectrum is the heights of the lines.", "False — the spectrum is the range of frequencies (the f-axis)."], ["COM", "سكشن 2", "In sin(4t), the frequency = ?", "ω = 4 → f = 4 / 2π = 2/π Hz"], ["COM", "سكشن 2", "Stages −11, −6, −3 dB; input = 5 mW. Output = ?", "Total −20 dB → 5 × 0.01 = 0.05 mW"], ["COM", "سكشن 3", "Splitting loss of a 32×32 PSC = ?", "log₂32 × 3 = 15 dB"], ["COM", "سكشن 3", "The host needs 0.1 mW and the total loss is 18 dB. Required transmit power = ?", "−10 dBm + 18 = +8 dBm ≈ 6.3 mW"], ["COM", "سكشن 3", "In an ideal coupler, directivity loss L_D = ?", "∞"], ["COM", "سكشن 3", "A 4-wavelength MUX using FBGs and circulators needs how many stages?", "3 stages"], ["COM", "سكشن 3", "True or False: An 8×8 PSC has 24 dB splitting loss.", "False — log₂8 × 3 = 9 dB"], ["COM", "سكشن 4", "Link A–B has only λ2 free and B–C has only λ1 free. Can we set up (A,C)?", "Not without a wavelength converter; yes with a converter at B"], ["COM", "سكشن 4", "In the Cross state, which gates are ON?", "Gates 2 and 3"], ["COM", "سكشن 4", "In the Bar state, which gates are ON?", "Gates 1 and 4"], ["COM", "سكشن 4", "Static traffic and a tight budget: Passive or Active router?", "Passive router"], ["COM", "سكشن 5", "OADM with 8 wavelengths and 3 tunable transponders. Switch size = ?", "(8 + 3) × (8 + 3) = 11×11"], ["COM", "سكشن 5", "4 fibers × 3 λ, one add/drop port per wavelength. Number and size of switches?", "3 switches, each 5×5"], ["COM", "سكشن 5", "Splitter followed by combiner (each 3 dB). Minimum loss = ?", "6 dB"], ["COM", "سكشن 5", "True or False: A fixed transponder can drop any wavelength.", "False — that is the tunable transponder."], ["EMB", "محاضرة 1", "What is an Embedded System (ES)?", "An Electronic/Electro mechanical system which is designed to perform a specific function and is a combination of both hardware and firmware (Software)."], ["EMB", "محاضرة 1", "An embedded system is a combination of 3 things:", "a) Hardware  b) Software  c) Mechanical Component"], ["EMB", "محاضرة 1", "Any computing system must consist of three main things:", "Processor · Memory · I/O"], ["EMB", "محاضرة 1", "A microwave is a ______ purpose computing system.", "Specific purpose (Embedded) — used for single purpose"], ["EMB", "محاضرة 1", "While making an embedded system, the ES challenges are:", "power, cost, speed/time, and size"], ["EMB", "محاضرة 1", "Compare SB and SoC in size, cost, power and performance.", "SB: Larger, Expensive, High power · SoC: Smaller, Less Expensive, Less power · Performance: Same"], ["EMB", "محاضرة 1", "Based on challenges, if we add configurability, which one can be editable: SB or SoC?", "SB (Configurability: SB Yes, SoC No)"], ["EMB", "محاضرة 1", "Timer 555 is an example of ______.", "IC (Integrated Circuit)"], ["EMB", "محاضرة 1", "VLSI stands for ______.", "Very Large-Scale Integrated Circuit — IC with millions of transistors / NAND gates"], ["EMB", "محاضرة 1", "MCU is a computing system which consists of three things:", "Processor (MPU) · Memory · I/O — so MPU is a part of MCU"], ["EMB", "محاضرة 1", "______ is the master processor, and other microprocessors are slaves (GPU, DSP).", "CPU"], ["EMB", "محاضرة 1", "GPU is also occasionally called ______.", "Visual Processing Unit (VPU)"], ["EMB", "محاضرة 1", "For complex computations like Fourier transform, we use ______ to decrease load on the primary processor.", "DSP (Digital Signal Processor)"], ["EMB", "محاضرة 1", "Inside MP there are: ______", "ALU (Arithmetic and Logic Unit) · CU (Control Unit) · RF (Register Files)"], ["EMB", "محاضرة 2", "MP + Memory + I/O + GPU + DSP on one chip — name this system.", "System on chip (SoC) — a high performance MCU"], ["EMB", "محاضرة 2", "Which application type does SoC deal with? And why?", "OS Applications, because we need Microcontroller with high performance"], ["EMB", "محاضرة 2", "OS Applications have an extra layer that BareMetal SW does not have. What is it?", "Kernel"], ["EMB", "محاضرة 2", "Examples of OS Applications (Non-BareMetal SW):", "Embedded Linux · Android"], ["EMB", "محاضرة 2", "Kit + Sensors & Actuators = ______", "ECU (Electrical Control Unit) — cars consist of at least 200 ECU"], ["EMB", "محاضرة 2", "______ is a device used for the conversion of physical events into electrical signals.", "Sensor"], ["EMB", "محاضرة 2", "______ is a device that converts the electrical signals into physical events. Example?", "Actuator — e.g., motors and heaters"], ["EMB", "محاضرة 2", "The first recognized embedded system is ______.", "Apollo Guidance Computer (AGC), developed by MIT lab — its UI is DSKY"], ["EMB", "محاضرة 2", "In 1971 Intel introduced the world's first microprocessor chip called ______.", "the 4004 (for business calculators, produced by Busicom)"], ["EMB", "محاضرة 2", "The classification of embedded systems is based on:", "Generation · Complexity & performance · Deterministic behavior · Triggering"], ["EMB", "محاضرة 2", "Smart phones belong to which generation?", "Fourth Generation (SoCs, reconfigurable and multicore processors)"], ["EMB", "محاضرة 2", "______ Real time systems: missing a deadline can have catastrophic consequences.", "Hard (e.g., a pacemaker)"], ["EMB", "محاضرة 2", "Event Triggered vs Time Triggered?", "Event: activities are dynamic and depend on events · Time: follow a statically computed schedule (predictable)"], ["EMB", "محاضرة 2", "Monitoring embedded systems ______ impose control over variables. Example?", "cannot — e.g., ECG machine"], ["EMB", "محاضرة 2", "Embedded system with control functionality contains both ______ and ______. Example?", "sensors and actuators — Air conditioner (thermistor = sensor, compressor = actuator)"], ["EMB", "محاضرة 3", "The embedded system design process is a ______ view; we start with ______.", "top–down · the system requirements"], ["EMB", "محاضرة 3", "Requirements may be ______ or ______.", "functional or nonfunctional"], ["EMB", "محاضرة 3", "Typical nonfunctional requirements include:", "Performance · Cost · Physical size and weight · Power consumption"], ["EMB", "محاضرة 3", "Cost typically has two major components:", "Manufacturing cost (components and assembly) · NRE costs (personnel and other costs of designing the system)"], ["EMB", "محاضرة 3", "Power can be specified in the requirements stage in terms of ______. Why?", "battery life — the customer is unlikely to be able to describe the allowable wattage"], ["EMB", "محاضرة 3", "Purpose in the requirements form should be a brief ______ description.", "one or two lines"], ["EMB", "محاضرة 3", "For power, the most important decision is ______.", "whether the machine will be battery powered or plugged into the wall"], ["EMB", "محاضرة 3", "GPS moving map requirements: performance, manufacturing cost and power?", "Updates screen within 0.25 seconds · $30 · 100 mW"], ["EMB", "محاضرة 3", "GPS moving map outputs:", "Back-lit LCD display 400 × 600"], ["EMB", "محاضرة 4", "Smart thermometer: NRE $10,000, each costs $20, 500 units. Total cost?", "Manufacturing = 500 × $20 = $10,000 → Total = $10,000 + $10,000 = $20,000"], ["EMB", "محاضرة 4", "Smart door lock: NRE $30,000, each costs $50, 1,000 units. Total project cost?", "$30,000 + $50,000 = $80,000"], ["EMB", "محاضرة 4", "NRE $20,000, $40 per unit, 100 units. Effective cost per unit?", "$20,000 ÷ 100 = $200 → $200 + $40 = $240 per unit"], ["EMB", "محاضرة 4", "Smart watch: which are NRE costs?", "PCB design · Firmware development · Prototype testing"], ["EMB", "محاضرة 4", "Buying production components and assembling finished watches are ______ costs.", "manufacturing costs"], ["EMB", "محاضرة 4", "Hardware $8,000 + Software $12,000 + Testing $5,000; $30/unit; 2,000 units. NRE and total?", "NRE = $25,000 · Manufacturing = $60,000 · Total = $85,000"], ["EMB", "محاضرة 4", "The ______ is more precise; it serves as the contract between the customer and the architects.", "Specification"], ["EMB", "محاضرة 4", "Microprocessor vs Microcontroller: which is independent and has lots of power saving features?", "Microcontroller (Microprocessor is a dependent unit that requires other chips)"], ["EMB", "محاضرة 4", "Bus set contains the three main buses:", "Data bus · Address Bus · Control Bus"], ["EMB", "محاضرة 5", "Role of the processor is making three main things:", "Fetch · Decode · Execute"], ["EMB", "محاضرة 5", "A program counter contains ______.", "the memory address (location) of the next program instruction to be executed — Next Instruction Not Current Instruction"], ["EMB", "محاضرة 5", "Who fetches the instruction? And to where?", "The control unit (CU) — from Memory to the Instruction Register (IR)"], ["EMB", "محاضرة 5", "______ inside CU is used to decode the instruction.", "Instruction Decoder (ID)"], ["EMB", "محاضرة 5", "To decode an instruction we need to know two things:", "Instruction Set · Instruction Format"], ["EMB", "محاضرة 5", "8-bit format: 000 111 01 (Op-code, Operand 1, Operand 2), 000 = ADD. Result?", "ADD 7, 1 = 8"], ["EMB", "محاضرة 5", "Why does RISC need strong SW (compiler)?", "Because if it only understands (+ & −) and the instruction is *, it needs a strong compiler to convert * into many add operations."], ["EMB", "محاضرة 5", "Hard-Wired ID is used with ______; Memory-Mapped ID with ______.", "Hard-Wired: RISC · Memory-Mapped: CISC"], ["EMB", "محاضرة 5", "In embedded systems we use ______, as we need less no. of instructions.", "RISC"], ["EMB", "محاضرة 5", "The range of RISC instructions is ______.", "30 to 40"], ["EMB", "محاضرة 5", "Two types of Register files:", "General Purpose Registers (GPR) · Special Purpose Registers (SPR/SFR)"], ["EMB", "محاضرة 5", "Stack Pointer (SP) stores ______. The stack works in ______ manner.", "the memory address of the last data element added to the stack (top) · LIFO"], ["EMB", "محاضرة 6", "Process Status Word (PSW) is ______. Sign flag = 1 means?", "a set of flags, each flag is a bit · the last result from ALU is negative"], ["EMB", "محاضرة 6", "Jump instructions like JMP ______ ALU operation. Why?", "do not require — they only change the PC to a new address; no computation is performed"], ["EMB", "محاضرة 6", "If the two operands are larger than 8-bits (e.g., 16-bit), the solution is ______.", "Slicing"], ["EMB", "محاضرة 6", "An ______ bus determines the location in memory that the processor will read data from or write data to.", "address"], ["EMB", "محاضرة 6", "A ______ bus indicates whether the operation is a read or a write.", "control"], ["EMB", "محاضرة 6", "Read time is less than write time. Why?", "Because write operation may have to clear data in memory first then write."], ["EMB", "محاضرة 6", "Three key advantages of memory:", "1. Capacity  2. Speed / Access time  3. Organization"], ["EMB", "محاضرة 6", "Memory capacity is determined by ______.", "Address lines in the address bus"], ["EMB", "محاضرة 6", "Three types of memory:", "Volatile (RAM) · Non-Volatile (ROM) · Hybrid"], ["EMB", "محاضرة 7", "DRAM is based on ______. What is its problem?", "capacitor — it discharges over time, so we need a Refreshment Circuit"], ["EMB", "محاضرة 7", "Who has the highest priority to access memory: CPU or Refreshment Circuit?", "Refreshment Circuit"], ["EMB", "محاضرة 7", "SRAM: a bit is represented by a ______ that uses at least ______ transistors.", "flipflop · 6 transistors"], ["EMB", "محاضرة 7", "Which is faster, SRAM or DRAM? Why?", "SRAM — it doesn't need a refreshment circuit"], ["EMB", "محاضرة 7", "Which has high density and low cost per bit?", "DRAM"], ["EMB", "محاضرة 7", "Compare SRAM & DRAM in power consumption.", "SRAM: Lower · DRAM: Higher (needs refreshment circuit, and the capacitor consumes power)"], ["EMB", "محاضرة 7", "Flash memory belongs to ______ memory.", "Hybrid"], ["EMB", "محاضرة 7", "ROM is based on ______.", "floating gate MOSFET (FGM)"], ["EMB", "محاضرة 7", "Access time of ROM is ______ than RAM.", "slower"], ["GR", "محاضرة 1", "Computer graphics is the field of computer science that deals with ______ visual content using computers.", "generating (creating), manipulating (editing, moving), and displaying (representing)"], ["GR", "محاضرة 1", "List the primary stages of the graphics pipeline in order.", "Modeling → Transformation → Lighting → Rasterization → Shading"], ["GR", "محاضرة 1", "______: Converting 3D information into a 2D image (essentially turning models into pixels).", "Rasterization"], ["GR", "محاضرة 1", "______: Determining the color and brightness of pixels based on the lighting and material properties.", "Shading"], ["GR", "محاضرة 1", "From model to image, the coordinate systems in order are:", "Model → World → View → NDC → Display"], ["GR", "محاضرة 1", "Interactive computer graphics involves ______ communication.", "computer-user two-way communication"], ["GR", "محاضرة 1", "The modern interactive graphics display is composed of three components:", "A. Display controller (video controller) · B. Digital memory (frame buffer) · C. Television monitor"], ["GR", "محاضرة 1", "In today's terms, the frame buffer is called ______ and the display controller is recognized as ______.", "V-RAM (video RAM) · a display card (e.g., VGA 640×480)"], ["GR", "محاضرة 1", "Why does the frame buffer increase the speed of graphics?", "The graphics hardware can quickly read and write to the frame buffer without involving the slower main CPU or RAM."], ["GR", "محاضرة 1", "Non-interactive computer graphics are also known as ______. Give examples.", "passive computer graphics — screen savers, graphics in PDF, static images, brochures/business cards"], ["GR", "محاضرة 1", "Using double or triple buffering ensures ______.", "smooth visual transitions without screen tearing or flickering"], ["GR", "محاضرة 1", "Real-time vs Offline rendering?", "Real-time: interactive (games), ≥ 60 fps, speed over quality · Offline: films, quality prioritized, minutes or hours per frame"], ["GR", "محاضرة 1", "Raster graphics are ______; vector graphics are ______.", "Raster: resolution-dependent (pixels) · Vector: resolution-independent (mathematical equations)"], ["GR", "محاضرة 1", "Examples of raster and vector graphics:", "Raster: Paint, Photoshop · Vector: SVG, EPS"], ["GR", "محاضرة 2", "Two points would represent a ______, collection of three or more points a ______.", "line or edge · polygon"], ["GR", "محاضرة 2", "In y = mx + b, m = ______ and b = ______.", "m = (y2 − y1)/(x2 − x1) · b = y1 − m·x1"], ["GR", "محاضرة 2", "Write the slope-intercept equation of the line through (2,2) and (3,4).", "m = 2 · b = −2 → y = 2x − 2"], ["GR", "محاضرة 2", "The x of the intersection point of two lines is xp = ______.", "(b2 − b1) / (m1 − m2)"], ["GR", "محاضرة 2", "Why is there no point of intersection for parallel lines?", "They have the same slope (m1 = m2), so the denominator becomes zero (divide by zero)."], ["GR", "محاضرة 2", "The process of 'turning on' the pixels for a line segment is called ______.", "vector generation or line generation"], ["GR", "محاضرة 2", "Requirements of a line drawing algorithm:", "Straight with accurate start and end · constant brightness · drawn rapidly"], ["GR", "محاضرة 2", "The problem with the direct method (y = mx + b) is ______.", "floating-point numbers are expensive → very slow, not suitable for real time"], ["GR", "محاضرة 2", "Parametric form of a line:", "x = x1 + t(x2 − x1) · y = y1 + t(y2 − y1) · 0 ≤ t ≤ 1"], ["GR", "محاضرة 2", "In the parametric form, t = 0 gives ______ and t = 1 gives ______.", "the start point (x1,y1) · the end point (x2,y2)"], ["GR", "محاضرة 2", "Draw a line from (5,10) to (25,18) using the parametric form: write x and y.", "x = 5 + 20t · y = 10 + 8t"], ["GR", "محاضرة 3", "DDA stands for ______. It appeared in ______.", "Digital Differential Analyzer · 1940 (hardware and software)"], ["GR", "محاضرة 3", "In DDA, the number of steps = ______.", "max(Δx , Δy)"], ["GR", "محاضرة 3", "Line from (10,14) to (20,18) by DDA: steps, xinc, yinc?", "steps = 10 · xinc = 1 · yinc = 0.4"], ["GR", "محاضرة 3", "DDA rules by slope: m < 1, m = 1, m > 1?", "m<1: x++, y = y+m · m=1: x++, y++ · m>1: x = x + 1/m, y++"], ["GR", "محاضرة 3", "Trace (23,33) → (29,40) by DDA: Length, Xinc, Yinc?", "Length = 7 · Xinc = 6/7 = 0.857 · Yinc = 1"], ["GR", "محاضرة 3", "Advantages of DDA:", "Simplest · faster than y = mx + b · eliminates the multiplication (increments in x or y)"], ["GR", "محاضرة 3", "Disadvantages of DDA:", "Floating point arithmetic still time-consuming · orientation dependent → poor end point accuracy"], ["GR", "محاضرة 3", "The basic principle of Bresenham's line algorithm is ______.", "to select the optimum raster locations to represent a straight line (integer calculations only)"], ["GR", "محاضرة 3", "Bresenham: dlower = ______ and dupper = ______.", "dlower = y − yk · dupper = (yk + 1) − y"], ["GR", "محاضرة 3", "Decision parameter pk = ______.", "Δx(dlower − dupper) = 2Δy·xk − 2Δx·yk + c"], ["GR", "محاضرة 3", "If dlower < dupper then pk is ______ → plot ______.", "negative → the lower pixel (East)"], ["GR", "محاضرة 3", "First decision parameter p0 = ______.", "2Δy − Δx"], ["GR", "محاضرة 4", "Bresenham for |m| < 1: if pk < 0, next point = ______ and pk+1 = ______.", "(xk+1 , yk) · pk + 2Δy"], ["GR", "محاضرة 4", "Bresenham for |m| < 1: otherwise (pk ≥ 0), next point = ______ and pk+1 = ______.", "(xk+1 , yk+1) · pk + 2Δy − 2Δx"], ["GR", "محاضرة 4", "Step 5 of Bresenham: repeat step 4 ______ times.", "Δx − 1"], ["GR", "محاضرة 4", "Trivial situations that do not need Bresenham:", "m = 0 horizontal · m = ±1 line y = ±x · m = ∞ vertical"], ["GR", "محاضرة 4", "Draw (20,10) → (30,18): Δx, Δy, p0, 2Δy, 2Δy − 2Δx?", "Δx = 10 · Δy = 8 · p0 = 6 · 2Δy = 16 · 2Δy − 2Δx = −4"], ["GR", "محاضرة 4", "Line (5,8) → (9,11): p0 and the first next point?", "p0 = 2(3) − 4 = 2 ≥ 0 → NE → (6,9)"], ["GR", "محاضرة 4", "First octant: condition and slope?", "Ax < Bx · 0 ≤ m ≤ 1"], ["GR", "محاضرة 4", "Second octant: condition and slope?", "Ay < By · 1 < m < ∞"], ["GR", "محاضرة 4", "Rule 1 to use Bresenham in 8 octants:", "Calculate slope; if |m| > 1 → swap x & y values (re-swap when plotting)"], ["GR", "محاضرة 4", "Rule 2 to use Bresenham in 8 octants:", "If Δx < 0 or Δy < 0 → use |Δx| & |Δy| but decrement x or y (not increment)"], ["GR", "محاضرة 4", "First octant example (32,3) → (48,8): dx, dy, P0?", "dx = 16 · dy = 5 · 2dy = 10 · 2dy − 2dx = −22 · P0 = −6"], ["NET", "محاضرة 1", "Transport layer provides logical communication between ______; network layer between ______.", "application processes running on different hosts · hosts"], ["NET", "محاضرة 1", "At the sender, transport breaks application messages into ______ and passes them to ______.", "segments · network layer"], ["NET", "محاضرة 1", "Household analogy: hosts, processes, app messages, transport protocol, network-layer protocol?", "houses · kids · letters in envelopes · Ann and Bill · postal service"], ["NET", "محاضرة 1", "Transport layer sender actions (in order):", "is passed an app-layer message → determines segment header fields values → creates segment → passes segment to IP"], ["NET", "محاضرة 1", "Transport layer receiver actions (in order):", "receives segment from IP → checks header values → extracts app-layer message → demultiplexes up to application via socket"], ["NET", "محاضرة 2", "TCP services:", "reliable, in-order delivery · congestion control · flow control · connection setup"], ["NET", "محاضرة 2", "UDP is described as ______.", "unreliable, unordered delivery · no-frills extension of \"best-effort\" IP"], ["NET", "محاضرة 2", "Services not available in TCP or UDP:", "delay guarantees · bandwidth guarantees"], ["NET", "محاضرة 3", "Multiplexing as sender vs demultiplexing as receiver?", "Mux: handle data from multiple sockets, add transport header · Demux: use header info to deliver received segments to correct socket"], ["NET", "محاضرة 3", "Host uses ______ to direct a segment to the appropriate socket.", "IP addresses & port numbers"], ["NET", "محاضرة 3", "UDP (connectionless) demultiplexing uses ______.", "destination port number (only)"], ["NET", "محاضرة 3", "IP/UDP datagrams with same dest port # but different source IP/ports will be directed to ______.", "the same socket at the receiving host"], ["NET", "محاضرة 3", "TCP socket is identified by the 4-tuple:", "source IP address · source port number · dest IP address · dest port number"], ["NET", "محاضرة 4", "Why is there a UDP?", "no connection establishment (no RTT delay) · simple (no connection state) · small header size · no congestion control"], ["NET", "محاضرة 4", "UDP use:", "streaming multimedia apps · DNS · SNMP · HTTP/3"], ["NET", "محاضرة 4", "UDP segment header fields:", "source port # · dest port # · length · checksum"], ["NET", "محاضرة 4", "UDP length field = ______.", "length, in bytes of UDP segment, including header"], ["NET", "محاضرة 4", "Goal of UDP checksum:", "detect errors (i.e., flipped bits) in transmitted segment"], ["NET", "محاضرة 4", "Internet checksum: add 1110011001100110 + 1101010101010101. Sum and checksum?", "sum = 1011101110111100 (with wraparound) · checksum = 0100010001000011"], ["NET", "محاضرة 4", "When adding numbers for the checksum, a carryout from the most significant bit ______.", "needs to be added to the result (wraparound)"], ["NET", "محاضرة 5", "rdt_send(), udt_send(), rdt_rcv(), deliver_data()?", "rdt_send: from above (app) · udt_send: by rdt over unreliable channel · rdt_rcv: packet arrives at receiver · deliver_data: by rdt to upper layer"], ["NET", "محاضرة 5", "rdt1.0 assumes ______.", "underlying channel perfectly reliable: no bit errors, no loss of packets"], ["NET", "محاضرة 5", "rdt2.0 recovers from bit errors using:", "checksum · ACKs · NAKs · retransmission on NAK (stop and wait)"], ["NET", "محاضرة 5", "rdt2.0 fatal flaw:", "if ACK/NAK corrupted, sender doesn't know what happened at receiver; can't just retransmit (possible duplicate)"], ["NET", "محاضرة 5", "rdt2.1 handles duplicates by ______.", "adding sequence number (0,1) to each pkt; receiver discards duplicate pkt"], ["NET", "محاضرة 5", "rdt2.2 is ______.", "a NAK-free protocol: receiver sends ACK for last pkt received OK (with seq #); duplicate ACK = retransmit"], ["NET", "محاضرة 5", "rdt3.0 approach for loss:", "sender waits \"reasonable\" amount of time for ACK (countdown timer), retransmits if no ACK"], ["NET", "محاضرة 6", "Stop-and-wait: 1 Gbps link, 15 ms prop. delay, 8000-bit packet. Dtrans and U?", "Dtrans = L/R = 8 µs · U = 0.008/30.008 = 0.00027"], ["NET", "محاضرة 6", "Pipelining: ______.", "sender allows multiple, \"in-flight\", yet-to-be-acknowledged packets (more seq #s + buffering)"], ["NET", "محاضرة 6", "3-packet pipelining: U = ______.", "3L/R / (RTT + L/R) = 0.024/30.008 = 0.00081 (× 3)"], ["NET", "محاضرة 6", "Go-Back-N: ACK(n) and timeout(n)?", "cumulative ACK: all packets up to n · timeout(n): retransmit packet n and all higher seq # packets in window"], ["NET", "محاضرة 6", "Selective repeat: receiver and sender?", "receiver individually ACKs and buffers · sender timer for each unACKed pkt, retransmits only that packet"], ["NET", "محاضرة 6", "Selective repeat dilemma: seq #s 0–3, window 3. Relationship needed?", "window size ≤ half the sequence # space"], ["NET", "محاضرة 7", "TCP overview: point-to-point means ______; byte stream means ______.", "one sender, one receiver · reliable, in-order byte stream, no \"message boundaries\""], ["NET", "محاضرة 7", "TCP segment seq # and ACK #?", "seq #: counting bytes of data into bytestream (first byte) · ACK: seq # of next expected byte (cumulative)"], ["NET", "محاضرة 7", "Telnet: A sends Seq=42, ACK=79, data='C'. B replies?", "Seq=79, ACK=43, data='C' · then A: Seq=43, ACK=80"], ["NET", "محاضرة 7", "EstimatedRTT = ______ (typical α = ______).", "(1−α)·EstimatedRTT + α·SampleRTT · α = 0.125 (EWMA)"], ["NET", "محاضرة 7", "TimeoutInterval = ______; DevRTT = ______ (β = ______).", "EstimatedRTT + 4·DevRTT · (1−β)·DevRTT + β·|SampleRTT − EstimatedRTT| · β = 0.25"], ["NET", "محاضرة 7", "Timeout too short vs too long?", "too short: premature timeout, unnecessary retransmissions · too long: slow reaction to segment loss"], ["NET", "محاضرة 8", "TCP receiver: arrival of out-of-order segment (gap detected) → ______.", "immediately send duplicate ACK, indicating seq # of next expected byte"], ["NET", "محاضرة 8", "TCP receiver: in-order segment, all data up to expected seq # already ACKed → ______.", "delayed ACK: wait up to 500 ms for next segment; if none, send ACK"], ["NET", "محاضرة 8", "TCP fast retransmit:", "if sender receives 3 additional ACKs for same data (triple duplicate ACKs), resend unACKed segment with smallest seq #"], ["NET", "محاضرة 8", "TCP flow control:", "receiver advertises free buffer space in rwnd field; sender limits unACKed (in-flight) data to rwnd → buffer won't overflow"], ["NET", "محاضرة 8", "2-way handshake problems:", "half open connection (no client) · duplicate data accepted"], ["NET", "محاضرة 8", "TCP 3-way handshake segments:", "SYN (SYNbit=1, Seq=x) → SYNACK (SYNbit=1, Seq=y, ACKbit=1, ACKnum=x+1) → ACK (ACKbit=1, ACKnum=y+1)"], ["NET", "محاضرة 8", "Closing a TCP connection:", "each side sends TCP segment with FIN bit = 1; respond to FIN with ACK (can be combined with own FIN)"], ["SE", "سكشن 2", "List the 7 phases of the SDLC in order.", "Requirements Collection → Requirements Analysis → System Design → System Development → System Testing → System Deployment → System Maintenance"], ["SE", "سكشن 2", "System modeling: a model helps take the users' business ______, translate them into ______, and turn them into ______.", "needs · requirements · code"], ["SE", "سكشن 2", "The most important benefit of a visual modeling standard is ______.", "communication"], ["SE", "سكشن 2", "UML stands for ______ and is a standard language for ______.", "Unified Modelling Language · specifying, visualizing, constructing and documenting software systems"], ["SE", "سكشن 2", "Four benefits of using UML:", "help teams communicate · explore potential designs · validate the architectural design · independent of programming languages and development processes"], ["SE", "سكشن 2", "The Business Use Case diagram answers the question ______.", "\"What does the business do?\" (organization as a whole)"], ["SE", "سكشن 2", "Business actor vs business worker:", "actor: anyone/anything outside the organization that interacts with it · worker: a role within the organization"], ["SE", "سكشن 2", "Business use cases are named in the form ______.", "<verb> <noun> (e.g. Sell P
